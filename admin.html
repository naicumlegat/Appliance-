<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSV Upload</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

  <h2>Upload CSV to D1</h2>

  <form id="uploadForm">
    <!-- 1. Category -->
    <p>
      <label><b>Category:</b></label><br>
      <select id="category" style="font-size: 16px; padding: 8px; margin-top: 5px;">
        <option value="Refrigeration">Refrigeration</option>
        <option value="Dishwashing">Dishwashing</option>
        <option value="Laundry">Laundry</option>
        <option value="Cooking">Cooking</option>
        <option value="Air Quality">Air Quality</option>
        <option value="HVAC">HVAC</option>
        <option value="Plumbing Fixture">Plumbing Fixture</option>
        <option value="Appliance">Appliance</option>
      </select>
    </p>

    <!-- 2. File -->
    <p>
      <label><b>CSV File:</b></label><br>
      <input type="file" id="csvFile" accept=".csv" required style="font-size: 16px; margin-top: 5px;">
    </p>

    <br>
    <button type="submit" id="btn" style="font-size: 18px; padding: 10px 20px;">Upload</button>
  </form>

  <p id="status" style="font-size: 16px; margin-top: 20px; font-weight: bold;"></p>

  <script>
    const form = document.getElementById('uploadForm');
    const category = document.getElementById('category');
    const fileInput = document.getElementById('csvFile');
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const file = fileInput.files[0];
      if (!file) return;

      btn.disabled = true;
      btn.textContent = 'Uploading...';
      status.textContent = 'Processing file...';

      try {
        const text = await file.text();
        const url = `https://appliance.naicumlegat.workers.dev/admin/ingest-csv?category=${encodeURIComponent(category.value)}`;

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'text/csv' },
          body: text
        });

        const data = await res.json();
        if (res.ok && data.success) {
          status.style.color = 'green';
          status.textContent = `Done! Added ${data.count} models to ${category.value}.`;
          fileInput.value = '';
        } else {
          status.style.color = 'red';
          status.textContent = `Error: ${data.error || 'Failed to upload'}`;
        }
      } catch (err) {
        status.style.color = 'red';
        status.textContent = `Network Error: ${err.message}`;
      } finally {
        btn.disabled = false;
        btn.textContent = 'Upload';
      }
    });
  </script>
</body>
</html>
