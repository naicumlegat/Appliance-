<body class="font-sans antialiased selection:bg-[#FF9500]/30">
  <div id="root">

    </div>

  <div id="runtime-error-box" style="display:none; position:fixed; bottom:0; left:0; right:0; background:#b91c1c; color:#fff; padding:12px; font-size:11px; font-family:monospace; z-index:999999; word-break:break-all;"></div>
  <script>
    window.onerror = function(msg, url, line, col, err) {
      var box = document.getElementById('runtime-error-box');
      if (box) {
        box.style.display = 'block';
        box.innerText = 'Runtime Error: ' + msg + ' (Line: ' + line + ', Col: ' + col + ')\n' + (err ? err.stack : '');
      }
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        const swBlob = new Blob([
          `self.addEventListener('install', e => self.skipWaiting());\n` +
          `self.addEventListener('activate', e => e.waitUntil(clients.claim()));\n` +
          `self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));`
        ], { type: 'application/javascript' });
        const swUrl = URL.createObjectURL(swBlob);
        navigator.serviceWorker.register(swUrl).catch(() => {});
      });
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const UI_ACCENT = {
      badge: 'bg-[#FF9500]/15 text-amber-700 dark:text-[#FF9500]',

    const WORKER_ENDPOINT = "https://appliance.naicumlegat.workers.dev";
    const PASSPORT_WINDOW_MS = 3 * 24 * 60 * 60 * 1000;
    const PRO_WINDOW_MS = 2 * 60 * 60 * 1000;
    const STORAGE_CLEANUP_INTERVAL_MS = 72 * 60 * 60 * 1000;

    const FREE_TOTAL_QUOTA = 5;
    const PRO_WINDOW_QUOTA = 65;

    const FREE_MAX_GROUPS = 1;
    const FREE_MAX_PER_GROUP = 3;
    const PRO_MAX_GROUPS = 5;
    const PRO_MAX_PER_GROUP = 15;

    let isDirtySync = false;
    let lastPullTime = 0;

    function triggerHaptic(type = 'light') {
      const isEnabled = localStorage.getItem('app_notif_haptics') !== 'false';
      if (!isEnabled) return;
      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try {
          if (type === 'light') navigator.vibrate(10);
          else if (type === 'success') navigator.vibrate([15, 30, 20]);
          else if (type === 'arm' || type === 'warn') navigator.vibrate([25, 40, 30]);
        } catch(e) {}
      }
    }

    // Headless Retailer Deep Link
    function openExternalRetailer(url) {
      if (!url) return;
      triggerHaptic('light');
      const link = document.createElement('a');
      link.href = url;
      link.rel = 'noopener noreferrer';
      link.target = '_blank';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // iOS-Style Slider Toggle in Signature Orange
    function AppleToggle({ checked, onChange, disabled = false }) {
      return (
        <button
          type="button"
          role="switch"
          aria-checked={checked}
          disabled={disabled}
          onClick={(e) => {
            e.stopPropagation();
            triggerHaptic('light');
            onChange(!checked);
          }}
          className={`relative inline-flex h-6 w-11 shrink-0 cursor-pointer rounded-full p-0.5 transition-colors duration-200 ease-in-out focus:outline-none disabled:opacity-40 ${
            checked ? 'bg-[#FF9500]' : 'bg-black/10 dark:bg-zinc-800'
          }`}
        >
          <span
            className={`pointer-events-none inline-block h-5 w-5 transform rounded-full bg-white shadow-sm ring-0 transition duration-200 ease-in-out ${
              checked ? 'translate-x-5' : 'translate-x-0'
            }`}
          />
        </button>
      );
    }

    function formatApplianceTitle(brand = '', name = '') {
      const b = (brand || '').trim();
      const n = (name || '').trim();
      if (!b) return n || 'Appliance';
      if (!n) return b;
      return n.toLowerCase().startsWith(b.toLowerCase()) ? n : `${b} ${n}`;
    }

    function getDynamicGreetingInfo(name) {
      const hour = new Date().getHours();
      let greeting = 'Good evening';
      let iconType = 'evening';
      if (hour >= 5 && hour < 12) {
        greeting = 'Good morning';
        iconType = 'morning';
      } else if (hour >= 12 && hour < 17) {
        greeting = 'Good afternoon';
        iconType = 'afternoon';
      }
      
      const cleanName = (name || '').trim();
      const text = (cleanName && cleanName !== 'Welcome' && cleanName !== 'Guest') 
        ? `${greeting}, ${cleanName}` 
        : greeting;
      return { text, iconType };
    }

    function getDegradationColor(percent) {
      const p = Math.max(0, Math.min(100, percent));
      let r, g, b;

      if (p > 50) {
        const t = (100 - p) / 50;
        r = Math.round(16 + (245 - 16) * t);
        g = Math.round(185 + (158 - 185) * t);
        b = Math.round(129 + (11 - 129) * t);
      } else if (p > 20) {
        const t = (50 - p) / 30;
        r = Math.round(245 + (249 - 245) * t);
        g = Math.round(158 + (115 - 158) * t);
        b = Math.round(11 + (22 - 11) * t);
      } else {
        const t = (20 - p) / 20;
        r = Math.round(249 + (225 - 249) * t);
        g = Math.round(115 + (29 - 115) * t);
        b = Math.round(22 + (72 - 22) * t);
      }

      return {
        rgbString: `rgb(${r}, ${g}, ${b})`,
        bgStyle: { backgroundColor: `rgb(${r}, ${g}, ${b})` }
      };
    }

    // Direct Calendar Export with Regex Telephone Mask Protection
    function exportConsumableToIcs(appliance, consumable) {
      triggerHaptic('success');
      const intervalMonths = consumable.intervalMonths || 6;
      const baseMs = new Date(consumable.lastReplaced || appliance.purchaseDate || Date.now()).getTime();
      const targetDueMs = baseMs + (intervalMonths * 30.4375 * 24 * 60 * 60 * 1000);
      const dueDate = new Date(targetDueMs);

      const y = dueDate.getFullYear();
      const m = String(dueDate.getMonth() + 1).padStart(2, '0');
      const d = String(dueDate.getDate()).padStart(2, '0');
      const datestamp = `${y}${m}${d}T090000Z`;

      const title = `Replace ${consumable.name} (${appliance.brand} ${appliance.name})`;
      const desc = `Scheduled replacement for OEM Part #${consumable.partNumber || 'Standard'}. Tracked via Appliance Engine.`;
      
      const cleanUnit = (appliance.unitName || 'Main Residence').replace(/^[0-9-]+$/, 'Unit $&');
      const cleanRoom = appliance.nickname ? ` - ${appliance.nickname}` : '';
      const locationText = `Property: ${cleanUnit}${cleanRoom}`;

      const icsString = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Appliance Engine//Consumables Calendar//EN",
        "CALSCALE:GREGORIAN",
        "METHOD:PUBLISH",
        "BEGIN:VEVENT",
        `UID:consumable_${Date.now()}@applianceengine`,
        `DTSTAMP:${datestamp}`,
        `DTSTART:${datestamp}`,
        `SUMMARY:${title}`,
        `DESCRIPTION:${desc}`,
        `LOCATION:${locationText}`,
        "STATUS:CONFIRMED",
        "BEGIN:VALARM",
        "TRIGGER:-P1D",
        "ACTION:DISPLAY",
        `DESCRIPTION:Reminder: ${title}`,
        "END:VALARM",
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");

      const blob = new Blob([icsString], { type: 'text/calendar;charset=utf-8' });
      const filename = `${consumable.name.replace(/\s+/g, '_')}_Reminder.ics`;

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1200);
    }

    // Client-Side CSV Generator
    async function exportInventoryToCsv(items, meta = {}) {
      triggerHaptic('success');
      const includeValuation = Boolean(meta.includeValuation);
      
      const lines = [
        `\uFEFF# Home Appliance Passport - Verified Inventory Ledger`,
        `# Notice: Self-reported owner records; not a certified appraisal or inspection.`,
        `# Property: ${meta.propertyAddress || meta.unitName || 'Main Residence'}`,
        `# Prepared For: ${meta.ownerName || 'Owner'}`,
        `# Verification Hash: ${meta.verificationHash || 'HAP-LEDGER'} | Generated: ${new Date().toLocaleDateString()}`,
        `#`
      ];

      const headers = includeValuation 
        ? ["Property", "Appliance Name", "Brand", "Model SKU", "Serial Number", "Category", "Purchase Date", "Declared Valuation", "Retailer"]
        : ["Property", "Appliance Name", "Brand", "Model SKU", "Serial Number", "Category", "Purchase Date", "Retailer"];
      
      lines.push(headers.map(h => `"${h}"`).join(","));

      items.forEach(it => {
        const row = [
          it.unitName || 'Main Residence',
          it.name || '',
          it.brand || '',
          it.modelNumber || '',
          it.serialNumber || '',
          it.category || 'Appliance',
          it.purchaseDate || '',
        ];

        if (includeValuation) {
          row.push(it.purchasePrice || 'Not Declared');
        }
        row.push(it.vendor || '');

        lines.push(row.map(val => `"${String(val).replace(/"/g, '""')}"`).join(","));
      });

      const csvContent = lines.join("\r\n");
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const filename = `${(meta.unitName || 'Home_Appliance').replace(/\s+/g, '_')}_Inventory_Ledger.csv`;

      const file = new File([blob], filename, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: filename });
          return;
        } catch (e) {}
      }

    // Federal CPSC Recall Check
    async function verifyCpscRecallCached(brand, modelNumber) {
      if (!modelNumber || !modelNumber.trim()) return null;
      const cacheKey = `cpsc_${brand}_${modelNumber}`.toLowerCase().replace(/\s+/g, '_');
      
      try {
        const cached = await ApplianceStorageDB.get('manuals_cache', cacheKey);
        if (cached && (Date.now() - cached.timestamp < 30 * 24 * 60 * 60 * 1000)) {
          return cached.hasRecall ? cached.details : null;
        }

        const cleanQuery = encodeURIComponent(`${brand} ${modelNumber}`.trim());
        const endpoint = `https://www.saferproducts.gov/RestWebServices/Recall?format=json&RecallTitle=${cleanQuery}`;
        const res = await fetch(endpoint, { mode: 'cors' }).catch(() => null);

        let recallFound = null;
        if (res && res.ok) {
          const data = await res.json().catch(() => []);
          if (Array.isArray(data) && data.length > 0) {
            recallFound = {
              title: data[0].RecallTitle || data[0].Title || "CPSC Safety Recall Notice",
              url: data[0].URL || `https://www.cpsc.gov/Recalls`,
              date: data[0].RecallDate || ""
            };
          }
        }

        await ApplianceStorageDB.set('manuals_cache', cacheKey, {
          timestamp: Date.now(),
          hasRecall: Boolean(recallFound),
          details: recallFound
        });

        return recallFound;
      } catch(e) {
        return null;
      }
    }

    const ApplianceStorageDB = {
      dbPromise: null,
      getDB() {
        if (!this.dbPromise) {
          this.dbPromise = new Promise((resolve, reject) => {
            const req = indexedDB.open('ApplianceEngineDB', 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('passport_pdfs')) db.createObjectStore('passport_pdfs');
              if (!db.objectStoreNames.contains('media_store')) db.createObjectStore('media_store');
              if (!db.objectStoreNames.contains('manuals_cache')) db.createObjectStore('manuals_cache');
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        }
        return this.dbPromise;
      },
      async get(storeName, key) {
        try {
          const db = await this.getDB();
          return new Promise((resolve) => {
            const tx = db.transaction(storeName, 'readonly');
            const req = tx.objectStore(storeName).get(key);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          });
        } catch (e) { return null; }
      },
      async set(storeName, key, value) {
        try {
          const db = await this.getDB();
          return new Promise((resolve, reject) => {
            const tx = db.transaction(storeName, 'readwrite');
            const req = tx.objectStore(storeName).put(value, key);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
          });
        } catch (e) {}
      },
      async delete(storeName, key) {
        try {
          const db = await this.getDB();
          return new Promise((resolve) => {
            const tx = db.transaction(storeName, 'readwrite');
            const req = tx.objectStore(storeName).delete(key);
            req.onsuccess = () => resolve();
            req.onerror = () => resolve();
          });
        } catch (e) {}
      }
    };

    async function runAutomatedStorageMaintenance(isPaidUser) {
      const now = Date.now();
      const lastRun = Number(localStorage.getItem('last_storage_maintenance_ts') || 0);
      if (now - lastRun < STORAGE_CLEANUP_INTERVAL_MS) return;

      try {
        const db = await ApplianceStorageDB.getDB();
        const tx = db.transaction('passport_pdfs', 'readwrite');
        const store = tx.objectStore('passport_pdfs');
        const cursorReq = store.openCursor();

        cursorReq.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            const passId = String(cursor.key);
            const timestamp = Number(passId.replace('pass_', ''));
            if (timestamp && (now - timestamp > STORAGE_CLEANUP_INTERVAL_MS)) {
              cursor.delete();
            }
            cursor.continue();
          }
        };

        Object.keys(localStorage).forEach((key) => {
          if (key.startsWith('chat_history_')) {
            try {
              const session = JSON.parse(localStorage.getItem(key) || '{}');
              const maxRetention = isPaidUser ? (7 * 86400000) : (24 * 86400000);
              if (session.timestamp && (now - session.timestamp > maxRetention)) {
                localStorage.removeItem(key);
              }
            } catch (err) {}
          }
        });

        localStorage.setItem('last_storage_maintenance_ts', now.toString());
      } catch (err) {}
    }

    /**
     * Cleaned & Monetized Part Purchase Link Builder
     * 1. Eliminates unmonetized Google Shopping links; routes maintenance consumables (Affresh, TwinDos,
     *    descalers, dishwasher salt, filters) through precision Amazon Associates queries.
     * 2. Strips appliance model SKU pollution and restrictive quotes from routine cleaners.
     * 3. Retains affiliate tag (tag=applianceengine-20) across all Amazon lookups.
     */
    function buildPartPurchaseUrl(brand, partItem, targetStore = 'amazon', applianceModel = '') {
      const cleanBrand = (brand || '').trim();
      const partNumber = (partItem?.partNumber || '').trim();
      const partName = (partItem?.name || '').trim();
      const asin = (partItem?.asin || '').trim();
      const modelSku = (applianceModel || '').trim();

      const isRoutineMaintenance = /clean|tablet|wash|descal|salt|odor|twindos|detergent|deodor|sanit/i.test(partName);

      if (targetStore === 'amazon') {
        const tagParam = 'tag=applianceengine-20';
        if (asin && /^B[0-9A-Z]{9}$/i.test(asin)) {
          return `https://www.amazon.com/dp/${asin}?${tagParam}`;
        }
        
        let query = '';
        if (isRoutineMaintenance) {
          const simplifiedName = partName.replace(/\b(for|replacement|cartridge|pack)\b/gi, '').trim();
          query = `${cleanBrand} ${simplifiedName}`.trim();
        } else if (partNumber && partNumber.length > 2 && !/filter|oem|part|cleaner/i.test(partNumber)) {
          query = `${cleanBrand} ${partNumber} replacement part`.trim();
        } else if (modelSku) {
          query = `${cleanBrand} ${modelSku} ${partName}`.trim();
        } else {
          query = `${cleanBrand} ${partName}`.trim();
        }
        
        const cleanQuery = query.replace(/["']/g, '');
        return `https://www.amazon.com/s?k=${encodeURIComponent(cleanQuery)}&${tagParam}`;
      }

      // OEM / Mechanical Parts Routing
      if (isRoutineMaintenance) {
        // Routine cleaners routed to Amazon Associates with tag instead of empty RepairClinic schematics
        const simplifiedName = partName.replace(/\b(for|replacement|cartridge|pack)\b/gi, '').trim();
        const cleanQuery = `${cleanBrand} ${simplifiedName}`.replace(/["']/g, '').trim();
        return `https://www.amazon.com/s?k=${encodeURIComponent(cleanQuery)}&tag=applianceengine-20`;
      }

      const clearinghouseQuery = (partNumber || (modelSku ? `${modelSku} ${partName}` : `${cleanBrand} ${partName}`)).replace(/["']/g, '').trim();
      return `https://www.repairclinic.com/Shop-For-Parts?query=${encodeURIComponent(clearinghouseQuery)}`;
    }

    function formatToMMDDYYYY(rawVal) {
      const digits = rawVal.replace(/\D/g, '').slice(0, 8);
      if (digits.length <= 2) return digits;
      if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
    }

    function parseMMDDYYYYToISO(dateStr) {
      if (!dateStr || dateStr.length < 10) return '';
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const [m, d, y] = parts;
        if (m && d && y && y.length === 4) return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
      }
      return '';
    }

    function compressImageFast(file, maxDimension = 900) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDimension) {
              h = Math.round((h * maxDimension) / w);
              w = maxDimension;
            } else if (h > maxDimension) {
              w = Math.round((w * maxDimension) / h);
              h = maxDimension;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.75);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function extractBarcodeOrQrFromImage(dataUrl) {
      return new Promise((resolve) => {
        if (!window.jsQR) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
          resolve(code ? code.data : null);
        };
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      });
    }

    function calculateConsumableStatus(consumable, appliance) {
      const intervalMonths = consumable.intervalMonths || 6;
      const baseDateStr = consumable.lastReplaced || appliance.purchaseDate;
      
      if (!baseDateStr) {
        const colors = getDegradationColor(100);
        return { 
          badgeType: null,
          percent: 100, 
          displayPercent: 100,
          colors,
          timeRemainingText: `${intervalMonths} Months Remaining`,
          scheduleLine1: `Every ${intervalMonths} Months`,
          scheduleLine2: `Interval: ${intervalMonths} Months`
        };
      }

      const totalSpanMs = intervalMonths * 30.4375 * 24 * 60 * 60 * 1000;
      const baseMs = new Date(baseDateStr).getTime();
      const elapsedMs = Date.now() - baseMs;
      const remainingMs = totalSpanMs - elapsedMs;
      const remainingDays = Math.ceil(remainingMs / (24 * 60 * 60 * 1000));
      
      const rawPct = Math.round((remainingMs / totalSpanMs) * 100);
      const percent = Math.max(0, Math.min(100, rawPct));
      const colors = getDegradationColor(percent);

      const dueDateObj = new Date(baseMs + totalSpanMs);
      const nextDueDateStr = dueDateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

      if (remainingDays < 0) {
        const overdueDays = Math.abs(remainingDays);
        return { 
          badgeType: 'past_due',
          percent: 0, 
          displayPercent: 3.5,
          colors,
          timeRemainingText: `${overdueDays} Days Overdue`,
          scheduleLine1: `Every ${intervalMonths} Months`,
          scheduleLine2: `Target: ${nextDueDateStr}`
        };
      }

      if (remainingDays <= 5) {
        return { 
          badgeType: 'due_now',
          percent, 
          displayPercent: Math.max(3.5, percent),
          colors,
          timeRemainingText: remainingDays === 0 ? 'Due Today' : `${remainingDays} Days Remaining`,
          scheduleLine1: `Every ${intervalMonths} Months`,
          scheduleLine2: `Target: ${nextDueDateStr}`
        };
      }

      if (remainingDays <= 20) {
        return { 
          badgeType: 'replace_soon',
          percent, 
          displayPercent: Math.max(5, percent),
          colors,
          timeRemainingText: `${remainingDays} Days Remaining`,
          scheduleLine1: `Every ${intervalMonths} Months`,
          scheduleLine2: `Target: ${nextDueDateStr}`
        };
      }

      const remainingMonths = Math.ceil(remainingDays / 30.4);
      return { 
        badgeType: null,
        percent, 
        displayPercent: percent,
        colors,
        timeRemainingText: remainingMonths === 1 ? '1 Month Remaining' : `${remainingMonths} Months Remaining`,
        scheduleLine1: `Every ${intervalMonths} Months`,
        scheduleLine2: `Target: ${nextDueDateStr}`
      };
    }

    /**
     * Accurate Warranty Badging (Separates unverified date estimates from active OEM verified certificates)
     */
    function calculateApplianceWarrantyStatus(appliance) {
      if (appliance.warrantyActivated && appliance.warrantyDoc) {
        return { status: 'active', label: 'Warranty Verified (OEM Active)', isExpired: false, daysRemaining: null };
      }
      if (!appliance.purchaseDate || !appliance.purchaseDate.trim()) {
        return { status: 'unverified', label: 'No Purchase Date Specified', isExpired: false, daysRemaining: null };
      }
      const months = appliance.warrantyMonths || 12;
      const purchaseMs = new Date(appliance.purchaseDate).getTime();
      if (isNaN(purchaseMs)) {
        return { status: 'unverified', label: 'No Purchase Date Specified', isExpired: false, daysRemaining: null };
      }
      const spanMs = months * 30.4375 * 24 * 60 * 60 * 1000;
      const expireMs = purchaseMs + spanMs;
      const remainingMs = expireMs - Date.now();
      const remainingDays = Math.ceil(remainingMs / (24 * 60 * 60 * 1000));
      if (remainingDays <= 0) {
        return { status: 'expired', label: 'Standard Warranty Window Elapsed', isExpired: true, daysRemaining: 0 };
      }
      const remainingMonths = Math.ceil(remainingDays / 30.4);
      return {
        status: 'estimated_active',
        label: `Estimated Standard Window (${remainingMonths} Mo Remaining)`,
        isExpired: false,
        daysRemaining: remainingDays,
        isExpiringSoon: remainingDays <= 30
      };
    }

      // Check bundled fallback registry
      for (const [key, portal] of Object.entries(STATIC_BRAND_PORTALS)) {

      const cleanDomain = b.replace(/[^a-z0-9]/g, '');

        support: `https://www.${cleanDomain}.com/support`

    const AIQuotaTracker = {
      getStatus(isPaid) {
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          const now = Date.now();
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 0, startTime: now };
            localStorage.setItem('pro_ai_window', JSON.stringify(data));
          }
          return { count: data.count, limit: PRO_WINDOW_QUOTA, isLocked: data.count >= PRO_WINDOW_QUOTA };
        } else {
          const used = Number(localStorage.getItem('free_ai_used_count') || 0);
          return { count: used, limit: FREE_TOTAL_QUOTA, isLocked: used >= FREE_TOTAL_QUOTA };
        }
      },
      increment(isPaid) {
        const now = Date.now();
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 1, startTime: now };
          } else {
            data.count += 1;
          }
          localStorage.setItem('pro_ai_window', JSON.stringify(data));
        } else {
          const current = Number(localStorage.getItem('free_ai_used_count') || 0);
          localStorage.setItem('free_ai_used_count', (current + 1).toString());
        }
      },
      resetAll() {

    const ExpertDiagnosticEngine = {

          `Conclusion: The drain pump motor is jammed or its internal drive winding has worn out.\n\nWe've tried every troubleshooting step I can think of for this issue.\n\nBased on what I could assess, your Drain Pump Assembly likely needs replacement.\n\n[RECOMMEND_TECH]`
        ]
      },

      async lookupErrorCode(category = '', query = '') {
        const q = (query || '').toUpperCase();
        const catKey = (category || 'refrigeration').toLowerCase();
        let customDict = await ApplianceStorageDB.get('manuals_cache', 'chassis_error_catalog');
        if (!customDict) customDict = BUNDLED_CHASSIS_ERRORS;
        const table = customDict[catKey] || BUNDLED_CHASSIS_ERRORS[catKey] || {};
        for (const [code, desc] of Object.entries(table)) {
          if (q.includes(code)) return { code, desc };
        }
        return null;
      },

      checkOverdueConsumables(appliance) {
        const list = appliance.consumables || [];
        for (const c of list) {
          const status = calculateConsumableStatus(c, appliance);
          if (status.badgeType === 'past_due' || status.badgeType === 'due_now') {
            return { name: c.name, timeRemainingText: status.timeRemainingText };
          }
        }
        return null;
      },

      isNegativeFeedback(q) {
        const normalized = q.toLowerCase().trim();
        const triggers = [
          'no', 'nope', "didn't work", "did not work", 'still red', 'still bad', 'still warm',
          'no change', 'did that', 'tried that', 'same', 'nothing happened', 'not working',
          'failed', 'wont spin', "won't spin", 'does not spin', 'stiff', 'grinding', 'yes it rattles'
        ];
        return triggers.some(t => normalized === t || normalized.startsWith(t) || normalized.includes(t));
      },

      identifyActiveTree(history) {
        for (let i = history.length - 1; i >= 0; i--) {
          const text = history[i].text || '';
          if (text.includes('optical lens') || text.includes('sensor chamber') || text.includes('optical particle sensor')) return 'air_quality_sensor';
          if (text.includes('Safety Latch Check') || text.includes('Free-Spin Test')) return 'air_quality_fan';
          if (text.includes('Damper Airflow Check') || text.includes('Frost Buildup Inspection')) return 'refrig_temp';
          if (text.includes('Starter Rattle Check') || text.includes('compressor attempt to start')) return 'refrig_relay';
          if (text.includes('Filter & Hose Check') || text.includes('Impeller Spin')) return 'drain_general';
        }
        return null;
      },

      findNextStepIndex(treeKey, history) {
        const tree = this.diagnosticTrees[treeKey] || [];
        for (let idx = 0; idx < tree.length; idx++) {
          const stepKeyPhrase = tree[idx].slice(0, 30);
          const alreadySent = history.some(m => m.sender === 'assistant' && m.text.includes(stepKeyPhrase));
          if (!alreadySent) return idx;
        }
        return tree.length - 1;
      },

      async evaluateQuery(appliance, rawQuery, history = []) {
        const q = (rawQuery || '').toLowerCase().trim();
        const brand = appliance.brand || 'Appliance';
        const name = appliance.name || 'Appliance';
        const cleanTitle = formatApplianceTitle(brand, name);
        const category = appliance.category || 'Appliance';

        const lastAssistantMsg = [...history].reverse().find(m => m.sender === 'assistant')?.text || '';

        const hazardKeywords = ['smoke', 'burning smell', 'spark', 'sparks', 'fire', 'shock', 'arcing'];
        if (hazardKeywords.some(k => q.includes(k))) {
          return `⚠️ **CRITICAL ELECTRICAL HAZARD DETECTED**\n\n` +
                 `1. Disconnect power at the main home breaker immediately.\n` +
                 `2. Do not touch bare metal surfaces or wiring.\n\n` +
                 `Is electrical power disconnected at the breaker, and is the area safe to inspect?`;
        }

        if (lastAssistantMsg.includes('CRITICAL ELECTRICAL HAZARD')) {
          if (q.includes('yes') || q.includes('cut') || q.includes('safe') || q.includes('off')) {
            return `Breaker disconnect confirmed.\n\n` +
                   `Because an active thermal or electrical hazard occurred, inspecting internal high-voltage components carries risk.\n\n` +
                   `We've tried every troubleshooting step I can think of for this issue.\n\n` +
                   `Based on what I could assess, an internal wiring harness or electronic relay likely needs replacement.\n\n` +
                   `[RECOMMEND_TECH]`;
          }
        }

        const activeTreeKey = this.identifyActiveTree(history);
        if (activeTreeKey && this.isNegativeFeedback(q)) {
          const nextIdx = this.findNextStepIndex(activeTreeKey, history);
          const stepText = this.diagnosticTrees[activeTreeKey][nextIdx];
          const alreadyDelivered = history.some(m => m.sender === 'assistant' && m.text === stepText);
          if (!alreadyDelivered) {
            return stepText;
          }
        }

        const overdue = this.checkOverdueConsumables(appliance);
        if (overdue && (q.includes('smell') || q.includes('odor') || q.includes('air') || q.includes('flow') || q.includes('not cooling')) && history.filter(m => m.sender === 'user').length <= 1) {
          return `Quick check: Your ${overdue.name} is currently ${overdue.timeRemainingText}.\n\nA saturated filter restricts normal airflow and can cause these exact symptoms.\n\n1. Inspect or replace the overdue filter first before opening access panels.\n2. Is the filter housing clean and seated flush?`;
        }

        const errMatch = await this.lookupErrorCode(category, rawQuery);
        if (errMatch) {
          return `Fault code **${errMatch.code}** confirmed for this appliance: ${errMatch.desc}\n\nBefore ordering replacement sensors, inspect the wiring harness plug for loose pins or dust.`;
        }

        if (category === 'Air Quality' || cleanTitle.toLowerCase().includes('purifier')) {
          if (q.includes('red') || q.includes('orange') || q.includes('sensor') || q.includes('ring')) {
            return this.diagnosticTrees['air_quality_sensor'][0];
          }
          if (q.includes('spin') || q.includes('fan') || q.includes('dead') || q.includes('hum')) {
            return this.diagnosticTrees['air_quality_fan'][0];
          }
        }

        if (category === 'Refrigeration' || cleanTitle.toLowerCase().includes('fridge')) {
          if (q.includes('click') || q.includes('relay') || q.includes('hum')) {
            return this.diagnosticTrees['refrig_relay'][0];
          }
          if (q.includes('warm') || q.includes('not cooling') || q.includes('freezer') || q.includes('temp')) {
            return this.diagnosticTrees['refrig_temp'][0];
          }
        }

        if (q.includes('drain') || q.includes('water') || q.includes('pump') || q.includes('leak')) {
          return this.diagnosticTrees['drain_general'][0];
        }

        return `Safe inspection checks for your ${cleanTitle}:\n\n` +
               `1. Power Reset: Disconnect power at the breaker or plug for 60 seconds to allow microprocessors to reset.\n` +
               `2. Safety Latches: Check that all access panels, filters, and doors close completely flush.\n` +
               `3. Intake & Grilles: Ensure intake vents are free of dust or pet hair.\n\n` +
               `Safety Notice: Always disconnect electrical power before opening internal panels or inspecting wiring.`;
      }
    };

    function sanitizeCommercialName(rawName = '', modelNumber = '') {
      let cleaned = (rawName || '').trim();
      if (modelNumber && modelNumber.trim()) {
        const escaped = modelNumber.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        cleaned = cleaned.replace(new RegExp(escaped, 'gi'), '');
      }
      return cleaned.replace(/\s{2,}/g, ' ').replace(/\(\s*\)/g, '').trim();
    }

        const targetAppliance = appliances.find(a => a.id === applianceId);
        if (!targetAppliance) return;
        const previousLastReplaced = targetAppliance.consumables?.[consumableIndex]?.lastReplaced || null;
        const previousHistory = [...(targetAppliance.consumables?.[consumableIndex]?.replacementHistory || [])];
        const todayIso = new Date().toISOString();

        let updatedConsumableInstance = null;

        const updated = appliances.map(app => {
          if (app.id !== applianceId) return app;
          const nextConsumables = [...(app.consumables || [])];
          if (nextConsumables[consumableIndex]) {
            updatedConsumableInstance = {
              ...nextConsumables[consumableIndex],
              lastReplaced: todayIso,
              replacementHistory: [...previousHistory, todayIso]
            };
            nextConsumables[consumableIndex] = updatedConsumableInstance;
          }
          return { ...app, consumables: nextConsumables, updatedAt: Date.now() };
        });

        setAppliances(updated);

        // Keep local drawer state in sync with updated consumable

          consumableIndex,
          previousLastReplaced,
          previousHistory

              modelNumber: a.modelNumber,
              serialNumber: a.serialNumber,

            id: passId,
            unitName: passportMeta.unitName,
            propertyAddress: passportMeta.propertyAddress,
            ownerName: passportMeta.ownerName,

            await navigator.share({ files: [file], title: filename });
            return;

        }
        const url = URL.createObjectURL(pdfBlob);

          if (remainingDays <= notifLeadDays || status.badgeType === 'past_due' || status.badgeType === 'due_now') {

            allDueNotifications.push({
              key,
              appliance: app,
              consumable: c,
              index: idx,
              status
            });
          }
        });

          localStorage.setItem('acknowledged_alert_keys', JSON.stringify(updated));

              onTouchMove={(e) => {
                if (activeSwipingIdRef.current !== item.id) return;
                const deltaX = e.touches[0].clientX - touchStartPosRef.current.x;
                const deltaY = e.touches[0].clientY - touchStartPosRef.current.y;

                if (touchIsHorizontalRef.current === null) {
                  if (Math.abs(deltaX) > Math.abs(deltaY) + 6) {
                    touchIsHorizontalRef.current = true;
                  } else if (Math.abs(deltaY) > Math.abs(deltaX) + 6) {
                    touchIsHorizontalRef.current = false;
                  }
                }

                if (!touchIsHorizontalRef.current) return;

                const damped = deltaX < 0
                  ? Math.max(-96, deltaX)
                  : Math.min(24, Math.sign(deltaX) * Math.pow(Math.abs(deltaX), 0.7));

                setSwipeOffsets(prev => ({ ...prev, [item.id]: damped }));

                              const deltaY = e.touches[0].clientY - notifTouchStartPosRef.current.y;

                              if (notifTouchIsHorizontalRef.current === null) {

                    Delete Forever
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 10. AUTHENTICATION MODAL (Centered Floating Pop-Up Dialog) */}
          {isAuthModalOpen && (
            <div 
              onClick={() => {
                setIsAuthModalOpen(false);
                setIsSettingsOpen(true);
              }} 
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-[95] cursor-pointer animate-in fade-in duration-200"
            >
              <div 
                onClick={(e) => e.stopPropagation()} 
                className={`w-full max-w-sm rounded-[32px] p-6 space-y-4 shadow-2xl cursor-default animate-sheet-spring ${
                  isDark ? 'bg-zinc-900 text-white' : 'apple-card-light text-zinc-900'
                }`}
              >
                <div className="flex justify-between items-start">
                  <h3 className="text-base font-black pt-0.5">Account Login</h3>
                  <div className="-mt-1 -mr-1">
                    <AppleCloseButton 
                      isDark={isDark} 
                      onClick={() => {
                        setIsAuthModalOpen(false);
                        setIsSettingsOpen(true);
                      }} 
                    />
                  </div>
                </div>

                {authStep === 'email' ? (
                  <form onSubmit={handleAuthSendOtp} className="space-y-3">
                    <p className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-zinc-500'}`}>
                      Enter your email to sign in and synchronize your hardware schedule:
                    </p>
                    <input
                      type="email"
                      style={{ fontSize: '14px', colorScheme: isDark ? 'dark' : 'light' }}
                      className={`w-full rounded-2xl p-3 text-xs font-semibold focus:outline-none ${
                        isDark ? 'bg-zinc-800 text-white' : 'bg-white border border-black/10 text-black shadow-xs'
                      }`}
                      placeholder="your@email.com"
                      value={authEmailInput}
                      onChange={(e) => setAuthEmailInput(e.target.value)}
                      required
                      autoFocus
                    />
                    <button
                      type="submit"
                      disabled={authLoading}
                      className={`w-full ${UI_ACCENT.solid} font-black text-xs py-3 rounded-2xl shadow-xs transition-all active:scale-95`}
                    >
                      {authLoading ? 'Sending Code...' : 'Send Login Code'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleAuthVerifyOtp} className="space-y-3">
                    <p className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-zinc-500'}`}>
                      A 6-digit code was sent to <strong className={UI_ACCENT.text}>{authEmailInput}</strong>.
                    </p>

                    <input
                      type="text"
                      maxLength="6"
                      style={{ fontSize: '14px', colorScheme: isDark ? 'dark' : 'light' }}
                      className={`w-full rounded-2xl p-3 text-center text-lg tracking-widest font-mono font-black focus:outline-none ${
                        isDark ? 'bg-zinc-800 text-white' : 'bg-white border border-black/10 text-black shadow-xs'
                      }`}
                      placeholder="000000"
                      value={authPinInput}
                      onChange={(e) => setAuthPinInput(e.target.value.replace(/\D/g, ''))}
                      required
                      autoFocus
                    />

                    <button
                      type="submit"
                      disabled={authLoading || authPinInput.length < 6}
                      className={`w-full ${UI_ACCENT.solid} font-black text-xs py-3 rounded-2xl shadow-xs transition-all disabled:opacity-50 active:scale-95`}
                    >
                      {authLoading ? 'Verifying...' : 'Verify & Sign In'}
                    </button>

                    <div className="flex justify-between items-center pt-2">
                      <button type="button" onClick={() => setAuthStep('email')} className="text-xs text-zinc-400 hover:opacity-80">
                        ← Change Email
                      </button>
                      <button
                        type="button"
                        disabled={otpCooldownSeconds > 0}
                        onClick={handleAuthSendOtp}
                        className={`text-xs ${UI_ACCENT.text} disabled:opacity-40`}
                      >
                        {otpCooldownSeconds > 0 ? `Resend in ${otpCooldownSeconds}s` : 'Resend Code'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* 11. DIAGNOSTIC ASSISTANT OVERLAY (Dedicated Fullscreen with Visual Viewport Keyboard Pinning) */}
          {activeAppliance && (
            <div 
              style={{
                position: 'fixed',
                inset: 0,
                zIndex: 80,
                height: viewportHeight ? `${viewportHeight}px` : '100dvh',
                top: viewportHeight ? `${viewportOffsetTop}px` : '0px',
                paddingTop: 'max(16px, env(safe-area-inset-top, 16px))',
                paddingBottom: 'max(14px, env(safe-area-inset-bottom, 12px))',
                overscrollBehavior: 'contain'
              }}
              className={`w-full flex flex-col transition-colors duration-200 animate-sheet-spring ${
                isDark ? 'bg-black text-white' : 'bg-[#F2F2F7] text-[#111827]'
              }`}
            >
              {/* Top Bar Anchored */}
              <div className={`px-5 pb-3 border-b flex items-center justify-between shrink-0 ${
                isDark ? 'border-zinc-800 bg-black' : 'border-black/5 bg-[#F2F2F7]'
              }`}>
                <div className="min-w-0 flex-1 pr-3">
                  <h3 className="text-sm font-black truncate leading-tight">{formatApplianceTitle(activeAppliance.brand, activeAppliance.name)}</h3>
                  <p className={`text-[11px] mt-0.5 ${
                    getAssistantTierLabel().includes('Advanced') 
                      ? 'text-[#FF9500] font-bold' 
                      : (isDark ? 'text-zinc-400 font-semibold' : 'text-zinc-500 font-semibold')
                  }`}>
                    {getAssistantTierLabel()}
                  </p>
                </div>
                <div className="-mt-1 -mr-1">
                  <AppleCloseButton 
                    isDark={isDark} 
                    onClick={() => {
                      if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch(e){}
                      }
                      setIsListeningDictation(false);
                      setActiveAppliance(null);
                    }} 
                  />
                </div>
              </div>

              {/* Adaptive Action Chips (Smooth Horizontal Touch Scrolling) */}
              <div className={`py-2 px-4 overflow-x-auto scrollbar-none pill-scroll-mask shrink-0 ${
                isDark ? 'bg-zinc-950/40' : 'bg-white/40'
              }`}>
                <div className="flex items-center gap-1.5 w-max pr-6">
                  {getAdaptiveChips(activeAppliance).map(chip => (
                    <button
                      key={chip}
                      onClick={() => sendQuery(chip)}
                      className={`text-xs px-3 py-1 rounded-full font-bold shadow-2xs active:scale-95 transition-transform whitespace-nowrap ${
                        chip === 'Go Deeper' ? `${UI_ACCENT.solid}` : (isDark ? 'bg-zinc-800 text-zinc-300 hover:bg-zinc-750' : 'bg-white text-zinc-700 hover:bg-zinc-50 shadow-xs')
                      }`}
                    >
                      {chip}
                    </button>
                  ))}
                </div>
              </div>

              {/* Message Stream */}
              <div 
                ref={chatContainerRef}
                className="flex-1 overflow-y-auto px-4 py-3 space-y-2.5 text-xs scrollbar-none"
              >
                {(isPaidUser || AIQuotaTracker.getStatus(false).count < FREE_TOTAL_QUOTA) && chatSystemStatus === 'offline' && (
                  <div className="text-center my-3 py-0.5 animate-in fade-in duration-300">
                    <p className={`text-[11px] font-medium tracking-tight ${isDark ? 'text-zinc-500' : 'text-zinc-400'}`}>
                      Internet Connection Offline • Resuming with Local Equipment Schematics
                    </p>
                  </div>
                )}

                {(isPaidUser || AIQuotaTracker.getStatus(false).count < FREE_TOTAL_QUOTA) && chatSystemStatus === 'restored' && (
                  <div className="text-center my-3 py-0.5 animate-in fade-in duration-300">
                    <p className={`text-[11px] font-medium tracking-tight ${isDark ? 'text-zinc-500' : 'text-zinc-400'}`}>
                      Internet Connection Restored • Advanced Diagnostics Engaged
                    </p>
                  </div>
                )}

                {messages.map(m => (
                  <div key={m.id} className="space-y-2">
                    <div className={`py-2.5 px-4 rounded-[20px] w-fit max-w-[85%] whitespace-pre-line font-medium leading-relaxed ${
                      m.sender === 'user' 
                        ? 'ml-auto bg-[#FF9500] text-white shadow-xs' 
                        : (isDark ? 'mr-auto bg-zinc-800 text-zinc-200 shadow-xs' : 'mr-auto bg-white text-zinc-900 shadow-xs border border-black/5')
                    }`}>
                      {m.text}
                    </div>

                    {m.showReferralFork && (
                      <div className={`mx-auto max-w-[92%] p-4 rounded-2xl space-y-3 shadow-xs ${
                        isDark ? 'bg-zinc-800/80 text-zinc-200' : 'apple-card-light text-zinc-900'
                      }`}>
                        <div className="border-b border-black/5 dark:border-zinc-700/50 pb-2 text-center">
                          <span className={`text-[10px] font-black uppercase tracking-wider ${UI_ACCENT.text} block`}>
                            Recommended Next Steps
                          </span>
                          <p className="text-[11px] font-medium leading-relaxed text-zinc-500 dark:text-zinc-400 mt-1">
                            If you aren't comfortable handling the equipment yourself, I recommend having a specialist review the device physically.
                          </p>
                        </div>

                        <div className="grid grid-cols-2 gap-2 pt-0.5">
                          <button
                            type="button"
                            onClick={() => {
                              const wearPart = activeAppliance.replacementParts?.[0];
                              openExternalRetailer(buildPartPurchaseUrl(activeAppliance.brand, wearPart || { name: 'Part' }, 'amazon', activeAppliance.modelNumber));
                            }}
                            className={`p-2.5 rounded-xl text-center flex flex-col items-center justify-center font-bold text-xs shadow-xs active:scale-95 transition-transform ${
                              isDark ? 'bg-zinc-700/70 hover:bg-zinc-700 text-white' : 'bg-[#FAFAFC] hover:bg-zinc-100 text-zinc-900'
                            }`}
                          >
                            <span className="leading-tight">Order OEM Part</span>
                            <span className="text-[9.5px] opacity-70 mt-0.5 font-normal">Verified Replacement ↗</span>
                          </button>

                          <button
                            type="button"
                            onClick={() => {
                              const q = `${activeAppliance.brand} certified appliance service technician repair near me`;
                              openExternalRetailer(`https://www.google.com/search?q=${encodeURIComponent(q)}`);
                            }}
                            className={`p-2.5 rounded-xl text-center flex flex-col items-center justify-center font-bold text-xs shadow-xs active:scale-95 transition-transform ${
                              isDark ? 'bg-zinc-700/70 hover:bg-zinc-700 text-white' : 'bg-[#FAFAFC] hover:bg-zinc-100 text-zinc-900'
                            }`}
                          >
                            <span className="leading-tight">Find a Specialist</span>
                            <span className="text-[9.5px] opacity-70 mt-0.5 font-normal">Certified Local Service ↗</span>
                          </button>
                        </div>

                        <p className="text-[11px] text-zinc-500 dark:text-zinc-400 text-center font-medium pt-1 italic">
                          Otherwise, send another message to continue troubleshooting.
                        </p>
                      </div>
                    )}

                    {m.showTransitionCard && (
                      <div className={`mx-auto max-w-[92%] p-4 rounded-2xl space-y-3 shadow-xs ${
                        isDark ? 'bg-zinc-800/80 text-zinc-200' : 'apple-card-light text-zinc-900'
                      }`}>
                        <div className="border-b border-black/5 dark:border-zinc-700/50 pb-2 text-center">
                          <span className={`text-[10px] font-black uppercase tracking-wider ${UI_ACCENT.text} block`}>
                            Diagnostic Limit Reached
                          </span>
                          <p className="text-[11px] font-medium leading-relaxed text-zinc-500 dark:text-zinc-400 mt-1">
                            5 complimentary Advanced Inquiries used. Standard Diagnostic is now active.
                          </p>
                        </div>

                        <div className="pt-0.5">
                          <button
                            type="button"
                            onClick={() => { triggerHaptic('light'); setIsPaywallOpen(true); }}
                            className={`w-full py-2.5 rounded-xl text-xs font-bold ${UI_ACCENT.solid} shadow-xs active:scale-95 transition-all flex items-center justify-center`}
                          >
                            Upgrade to Advanced Manager ↗
                          </button>
                        </div>

                        <p className="text-[11px] text-zinc-500 dark:text-zinc-400 text-center font-medium pt-1 italic">
                          Or continue below with Standard Diagnostic.
                        </p>
                      </div>
                    )}

                    {m.showPeriodicReminder && (
                      <div className="flex justify-center my-2">
                        <button
                          type="button"
                          onClick={() => { triggerHaptic('light'); setIsPaywallOpen(true); }}
                          className={`text-[11px] font-bold py-1.5 px-3.5 rounded-full transition-all active:scale-95 flex items-center gap-1 ${
                            isDark 
                              ? 'bg-zinc-800 text-[#FF9500] hover:bg-zinc-750' 
                              : 'bg-amber-50 text-amber-800 hover:bg-amber-100 shadow-2xs'
                          }`}
                        >
                          <span>Using Standard Diagnostic • Upgrade to Advanced Diagnostic ➔</span>
                        </button>
                      </div>
                    )}
                  </div>
                ))}

                {isThinking && (
                  <div className={`h-7 px-3.5 rounded-full inline-flex items-center justify-center gap-1.5 mr-auto shadow-xs ${
                    isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-white text-zinc-500 border border-black/5'
                  }`}>
                    <span className="w-1.5 h-1.5 rounded-full bg-[#FF9500] imessage-dot"></span>
                    <span className="w-1.5 h-1.5 rounded-full bg-[#FF9500] imessage-dot"></span>
                    <span className="w-1.5 h-1.5 rounded-full bg-[#FF9500] imessage-dot"></span>
                  </div>
                )}

                {streamingText && (
                  <div className={`py-2.5 px-4 rounded-[20px] w-fit max-w-[85%] mr-auto whitespace-pre-line font-medium leading-relaxed ${
                    isDark ? 'bg-zinc-800 text-zinc-200' : 'bg-white text-zinc-900 border border-black/5 shadow-xs'
                  }`}>
                    {streamingText}
                  </div>
                )}

                {needsPlacardVerification && (
                  <div className={`p-3.5 rounded-2xl space-y-2 mt-2 ${
                    isDark ? 'bg-zinc-800/80 border border-[#FF9500]/40' : 'bg-amber-50 border border-amber-200'
                  }`}>
                    <div className="flex justify-between items-center">
                      <span className={`text-[10px] font-black uppercase tracking-wider ${UI_ACCENT.text}`}>
                        Placard Model Verification Required
                      </span>
                      <button
                        type="button"
                        onClick={() => { triggerHaptic('light'); placardFileInputRef.current?.click(); }}
                        className={`inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-lg transition-colors active:scale-95 ${
                          isDark ? 'bg-zinc-700 text-[#FF9500] hover:bg-zinc-600' : 'bg-white text-amber-700 hover:bg-amber-100 shadow-2xs'
                        }`}
                      >
                        <svg className="w-3.5 h-3.5 stroke-[1.8] stroke-linecap-round stroke-linejoin-round" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                          <circle cx="12" cy="13" r="4"></circle>
                        </svg>
                        <span>Snap Photo</span>
                      </button>
                    </div>
                    <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-300' : 'text-zinc-700'}`}>
                      Enter the exact model SKU from the silver rating plate to reconcile factory schematics:
                    </p>
                    <div className="flex gap-2 pt-1">
                      <input
                        style={{ fontSize: '14px', colorScheme: isDark ? 'dark' : 'light' }}
                        className={`flex-1 rounded-xl px-3 py-1.5 text-xs font-semibold focus:outline-none ${
                          isDark ? 'bg-zinc-700 text-white' : 'bg-white border border-black/10 text-black'
                        }`}
                        placeholder="e.g. 5440i"
                        value={placardVerifyInput}
                        onChange={(e) => setPlacardVerifyInput(e.target.value)}
                        onKeyDown={(e) => e.key === 'Enter' && handleInlinePlacardVerification()}
                      />
                      <button
                        type="button"
                        onClick={handleInlinePlacardVerification}
                        className={`${UI_ACCENT.solid} font-bold text-xs px-3.5 py-1.5 rounded-xl shadow-xs active:scale-95 transition-transform`}
                      >
                        Verify ➔
                      </button>
                    </div>
                  </div>
                )}

                {isLoading && <p className="text-xs text-zinc-400 animate-pulse px-2">Analyzing...</p>}
              </div>

              {/* Docked Composer */}
              <div className={`px-4 pt-2 pb-1 border-t flex flex-col gap-1.5 shrink-0 ${
                isDark ? 'border-zinc-800 bg-black' : 'border-black/5 bg-[#F2F2F7]'
              }`}>
                <div className="flex items-center gap-2">
                  <div className={`flex-1 rounded-full px-2 py-1.5 flex items-center gap-2 ${
                    isDark ? 'bg-zinc-800 text-white' : 'bg-white text-zinc-900 border border-black/5 shadow-xs'
                  }`}>
                    <input
                      type="text"
                      enterKeyHint="send"
                      autoComplete="off"
                      autoCorrect="off"
                      style={{ fontSize: '14px', colorScheme: isDark ? 'dark' : 'light' }}
                      className="flex-1 bg-transparent text-xs pl-2.5 focus:outline-none placeholder:text-zinc-500"
                      placeholder={isListeningDictation ? "Listening... Speak now" : "Describe issue, sound, or symptom..."}
                      value={queryInput}
                      onChange={(e) => setQueryInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && sendQuery()}
                    />

                    <button
                      type="button"
                      onClick={toggleDictation}
                      className={`w-6 h-6 rounded-full flex items-center justify-center transition-all ${
                        isListeningDictation
                          ? 'bg-[#FF9500] text-white animate-mic-listening'
                          : (isDark ? 'text-zinc-400 hover:text-white' : 'text-zinc-600 hover:text-zinc-900')
                      }`}
                      title={isListeningDictation ? "Stop Dictation" : "Dictate with Voice"}
                    >
                      <svg className="w-3.5 h-3.5 stroke-[1.8] stroke-linecap-round stroke-linejoin-round" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                      </svg>
                    </button>
                  </div>

                  <button 
                    type="button" 
                    onClick={() => sendQuery()} 
                    disabled={!queryInput.trim()}
                    className={`${UI_ACCENT.solid} font-bold text-xs px-4 py-2 rounded-full active:scale-95 transition-all disabled:opacity-40 shadow-xs`}
                  >
                    Send
                  </button>
                </div>
                <p className={`text-[9px] text-center font-semibold ${isDark ? 'text-zinc-500' : 'text-zinc-400'}`}>
                  Informational reference only. Always disconnect electrical power before servicing equipment.
                </p>
              </div>
            </div>
          )}

          {/* 12. INLINE PDF VIEWER */}
          {inlinePdfViewerData && (
            <div className="fixed inset-0 z-[95] flex flex-col bg-zinc-950 text-white animate-sheet-spring">
              <div 
                style={{ paddingTop: 'max(24px, calc(env(safe-area-inset-top, 44px) + 20px))' }}
                className="p-4 border-b border-white/10 flex justify-between items-center bg-zinc-900"
              >
                <button
                  onClick={() => {
                    triggerHaptic('light');
                    URL.revokeObjectURL(inlinePdfViewerData.url);
                    setInlinePdfViewerData(null);
                  }}
                  className="px-4 py-1.5 rounded-full text-xs font-bold bg-zinc-800 text-zinc-200 active:scale-95 transition-transform"
                >
                  Done
                </button>
                <h3 className="text-xs font-extrabold truncate px-2">{inlinePdfViewerData.title}</h3>
                <button
                  onClick={() => handleShareOrDownloadPdf(inlinePdfViewerData.blob, `${inlinePdfViewerData.title.replace(/\s+/g, '_')}.pdf`)}
                  className={`px-3.5 py-1.5 rounded-full text-xs font-bold ${UI_ACCENT.solid} active:scale-95 transition-transform`}
                >
                  Share ↗
                </button>
              </div>
              <iframe src={inlinePdfViewerData.url} className="w-full flex-1 border-none" title="PDF Preview" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
