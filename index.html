    let html2pdfLoadingPromise = null;
    function loadPdfEngineLazy() {
      if (window.html2pdf) return Promise.resolve(window.html2pdf);
      if (html2pdfLoadingPromise) return html2pdfLoadingPromise;

      html2pdfLoadingPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
        script.onload = () => resolve(window.html2pdf);
        script.onerror = () => reject(new Error("Could not load PDF engine."));
        document.body.appendChild(script);
      });
      return html2pdfLoadingPromise;
    }

    function buildPartPurchaseUrl(brand, partItem, targetStore = 'amazon') {
      const cleanBrand = (brand || '').trim();
      const partNumber = (partItem?.partNumber || '').trim();
      const partName = (partItem?.name || '').trim();
      const asin = (partItem?.asin || '').trim();

      if (targetStore === 'amazon') {
        const tagParam = AFFILIATE_SETTINGS.amazonTag ? `tag=${AFFILIATE_SETTINGS.amazonTag}` : '';
        if (asin && /^B[0-9A-Z]{9}$/i.test(asin)) {
          return `https://www.amazon.com/dp/${asin}?${tagParam}`;
        }
        const query = `${partNumber} OEM ${cleanBrand} ${partName}`.replace(/\s+/g, ' ').trim();
        return `https://www.amazon.com/s?k=${encodeURIComponent(query)}&${tagParam}`;
      }

      const bLower = cleanBrand.toLowerCase();
      let oemUrl = '';
      if (bLower.includes('coway')) {
        oemUrl = `https://cowaymega.com/search?q=${encodeURIComponent(partNumber || partName)}`;
      } else if (bLower.includes('moen')) {
        oemUrl = `https://www.moen.com/search?query=${encodeURIComponent(partNumber)}`;
      } else if (bLower.includes('kohler')) {
        oemUrl = `https://www.kohler.com/en/search?q=${encodeURIComponent(partNumber)}`;
      } else {
        oemUrl = `https://www.repairclinic.com/Shop-For-Parts?query=${encodeURIComponent(partNumber)}`;
      }

      if (AFFILIATE_SETTINGS.useSkimlinks && AFFILIATE_SETTINGS.skimlinksPubId && AFFILIATE_SETTINGS.skimlinksPubId !== 'YOUR_SKIMLINKS_ID') {
        return `https://go.skimlinks.com/?id=${AFFILIATE_SETTINGS.skimlinksPubId}&url=${encodeURIComponent(oemUrl)}`;
      }
      return oemUrl;
    }

    function formatToMMDDYYYY(rawVal) {
      const digits = rawVal.replace(/\D/g, '').slice(0, 8);
      if (digits.length <= 2) return digits;
      if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
    }

    function parseMMDDYYYYToISO(dateStr) {
      if (!dateStr || dateStr.length < 10) return '';
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const [m, d, y] = parts;
        if (m && d && y && y.length === 4) {
          return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
        }
      }
      return '';
    }

    function formatISOToMMDDYYYY(isoStr) {
      if (!isoStr) return '';
      const datePart = isoStr.split('T')[0];
      const parts = datePart.split('-');
      if (parts.length === 3) {
        return `${parts[1]}/${parts[2]}/${parts[0]}`;
      }
      return isoStr;
    }

    function compressImageFast(file, maxDimension = 800) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDimension) {
              h = Math.round((h * maxDimension) / w);
              w = maxDimension;
            } else if (h > maxDimension) {
              w = Math.round((w * maxDimension) / h);
              h = maxDimension;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function generateSeasonalRemindersForAsset(category = '', name = '', brand = '') {
      const q = `${category} ${name} ${brand}`.toLowerCase();
      const nowIso = new Date().toISOString();

      if (q.includes('fridge') || q.includes('refrigerat')) {
        return [
          { id: `st_${Date.now()}_1`, label: 'Vacuum bottom/rear condenser coils to preserve compressor efficiency and prevent overheating', intervalMonths: 6, lastCompleted: nowIso, dismissed: false }
        ];
      }
      if (q.includes('purifier') || q.includes('air') || q.includes('hepa')) {
        return [
          { id: `st_${Date.now()}_1`, label: 'Gently wipe particle sensor lens with dry cotton swab and vacuum mesh pre-filter screen', intervalMonths: 2, lastCompleted: nowIso, dismissed: false }
        ];
      }
      if (q.includes('dish') || q.includes('washer')) {
        return [
          { id: `st_${Date.now()}_1`, label: 'Twist and rinse lower cylindrical filter basket under hot water to clear food debris', intervalMonths: 1, lastCompleted: nowIso, dismissed: false }
        ];
      }
      if (q.includes('dryer') || q.includes('laundry')) {
        return [
          { id: `st_${Date.now()}_1`, label: 'Vacuum exhaust lint chamber and inspect exterior wall vent flap for lint accumulation', intervalMonths: 6, lastCompleted: nowIso, dismissed: false }
        ];
      }
      if (q.includes('hvac') || q.includes('heat pump') || q.includes('air conditioner') || q.includes('condenser')) {
        return [
          { id: `st_${Date.now()}_1`, label: 'Flush condensate drain pan with 1 cup white vinegar to prevent algal drain blockage', intervalMonths: 3, lastCompleted: nowIso, dismissed: false }
        ];
      }
      if (q.includes('heater') || q.includes('boiler') || q.includes('tank')) {
        return [
          { id: `st_${Date.now()}_1`, label: 'Drain 2-3 gallons from bottom drain spigot to purge mineral sediment build-up', intervalMonths: 12, lastCompleted: nowIso, dismissed: false }
        ];
      }
      return [
        { id: `st_${Date.now()}_1`, label: 'Inspect physical connections, intake vents, and power cord for wear or debris', intervalMonths: 6, lastCompleted: nowIso, dismissed: false }
      ];
    }

    function resolveOfficialLinks(appliance) {
      const b = (appliance?.brand || '').toLowerCase().trim();
      for (const [key, portal] of Object.entries(BRAND_PORTAL_REGISTRY)) {
        if (b.includes(key)) return portal;
      }
      const cleanBrand = (appliance?.brand || '').trim();
      return {
        warranty: `https://www.google.com/search?q=${encodeURIComponent(`${cleanBrand} official product warranty registration`)}`,
        support: `https://www.google.com/search?q=${encodeURIComponent(`${cleanBrand} official customer support warranty claim`)}`
      };
    }

    const openWarrantyRegistration = (appliance) => {
      window.open(resolveOfficialLinks(appliance).warranty, '_blank', 'noopener,noreferrer');
    };

    const openOfficialBrandSupport = (appliance) => {
      window.open(resolveOfficialLinks(appliance).support, '_blank', 'noopener,noreferrer');
    };

    const TelemetryEngine = {
      recordReliabilityEvent(eventType, modelNum, category, component = '') {
        try {
          const enabled = localStorage.getItem('app_telemetry_optin') !== 'false';
          if (!enabled) return;

          const rawEvents = localStorage.getItem('app_telemetry_queue') || '[]';
          const queue = JSON.parse(rawEvents);
          queue.push({
            t: Date.now(),
            e: eventType,
            m: (modelNum || '').trim().toUpperCase(),
            c: category || 'Appliance',
            p: component || null
          });
          if (queue.length > 50) queue.shift();
          localStorage.setItem('app_telemetry_queue', JSON.stringify(queue));
          this.flushQueue();
        } catch (err) {}
      },

      async flushQueue() {
        if (!navigator.onLine) return;
        const rawEvents = localStorage.getItem('app_telemetry_queue') || '[]';
        const queue = JSON.parse(rawEvents);
        if (queue.length === 0) return;

        const payload = JSON.stringify({ events: queue });
        const endpoint = WORKER_ENDPOINT.replace(/\/$/, '') + '/telemetry';

        if (navigator.sendBeacon) {
          const blob = new Blob([payload], { type: 'application/json' });
          if (navigator.sendBeacon(endpoint, blob)) {
            localStorage.setItem('app_telemetry_queue', '[]');
            return;
          }
        }

        try {
          const res = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload,
            keepalive: true
          });
          if (res.ok) localStorage.setItem('app_telemetry_queue', '[]');
        } catch (err) {}
      }
    };

    const AIQuotaTracker = {
      getStatus(isPaid) {
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          const now = Date.now();
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 0, startTime: now };
            localStorage.setItem('pro_ai_window', JSON.stringify(data));
          }
          return {
            count: data.count,
            limit: PRO_WINDOW_QUOTA,
            isLocked: data.count >= PRO_WINDOW_QUOTA,
            remainingMinutes: Math.max(0, Math.ceil((PRO_WINDOW_MS - (now - data.startTime)) / 60000))
          };
        } else {
          const used = Number(localStorage.getItem('free_ai_used_count') || 0);
          return {
            count: used,
            limit: FREE_TOTAL_QUOTA,
            isLocked: used >= FREE_TOTAL_QUOTA,
            remainingMinutes: 0
          };
        }
      },
      increment(isPaid) {
        const now = Date.now();
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          data = (now - data.startTime > PRO_WINDOW_MS) ? { count: 1, startTime: now } : { count: data.count + 1, startTime: data.startTime };
          localStorage.setItem('pro_ai_window', JSON.stringify(data));
        } else {
          const current = Number(localStorage.getItem('free_ai_used_count') || 0);
          localStorage.setItem('free_ai_used_count', (current + 1).toString());
        }
      }
    };

    function sanitizeCommercialName(rawName = '', modelNumber = '') {
      let cleaned = (rawName || '').trim();
      if (modelNumber && modelNumber.trim()) {
        const escaped = modelNumber.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        cleaned = cleaned.replace(new RegExp(escaped, 'gi'), '');
      }
      return cleaned.replace(/\s{2,}/g, ' ').replace(/\(\s*\)/g, '').trim();
    }

    function getAdaptiveChips(appliance) {
      if (!appliance) return ['Troubleshooting checks', 'Error code check', 'Go Deeper'];
      const cat = (appliance.category || '').toLowerCase();
      if (cat.includes('fridge') || cat.includes('refrigerat')) {
        return ['Reset filter light', 'No water from dispenser', 'Excess frost / ice', 'Go Deeper'];
      }
      if (cat.includes('purifier') || cat.includes('air')) {
        return ['Reset filter indicator', 'Red light won\'t clear', 'Whistling fan noise', 'Go Deeper'];
      }
      if (cat.includes('cooktop') || cat.includes('range')) {
        return ['Burner not heating', 'Hot surface light stuck', 'Trip breaker reset', 'Go Deeper'];
      }
      return ['Routine power reset', 'Inspect common wear parts', 'Clear error state', 'Go Deeper'];
    }

    const GLYPHS = {
      default: (
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" className="w-5 h-5">
          <rect x="4" y="4" width="16" height="16" rx="2.5"/>
          <line x1="8" y1="12" x2="16" y2="12" strokeLinecap="round"/>

    function AppleCloseButton({ onClick, isDark }) {
      return (
        <button
          type="button"

            isDark ? 'bg-zinc-800 text-zinc-200 hover:bg-zinc-700' : 'bg-[#E5E5EA] text-[#1C1C1E] hover:bg-[#D1D1D6] shadow-sm'
          }`}
          title="Close"
        >
          ✕
        </button>

    }

    function App() {
      const [units, setUnits] = useState([
        { id: 'unit_apt_25', name: 'APT 25', notificationsEnabled: true, collapsed: false },
        { id: 'unit_main', name: 'Main Residence', notificationsEnabled: true, collapsed: false }
      ]);

      const [appliances, setAppliances] = useState(() => {
        const saved = localStorage.getItem('user_appliances_catalog');
        return saved ? JSON.parse(saved) : [];
      });

      const [themeMode, setThemeMode] = useState('dark');
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('app_user_session');
        return saved ? JSON.parse(saved) : null;
      });
      const [isPaidUser, setIsPaidUser] = useState(false);

      // Auth Modal States
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authStep, setAuthStep] = useState('email');
      const [authEmailInput, setAuthEmailInput] = useState('');
      const [authPinInput, setAuthPinInput] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [devPasscodeNotice, setDevPasscodeNotice] = useState('');

      const [selectedAppliance, setSelectedAppliance] = useState(null);
      const [detailTab, setDetailTab] = useState('parts');
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isPaywallOpen, setIsPaywallOpen] = useState(false);
      const [activeAppliance, setActiveAppliance] = useState(null);
      const [messages, setMessages] = useState([]);
      const [queryInput, setQueryInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      const [brandInput, setBrandInput] = useState('');
      const [modelInput, setModelInput] = useState('');
      const [nameInput, setNameInput] = useState('');
      const [nicknameInput, setNicknameInput] = useState('');
      const [purchaseDateInput, setPurchaseDateInput] = useState('');
      const [warrantyMonthsInput, setWarrantyMonthsInput] = useState('12');
      const [lookupStatus, setLookupStatus] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);

      const isDark = themeMode === 'dark';

      useEffect(() => {
        localStorage.setItem('user_appliances_catalog', JSON.stringify(appliances));
      }, [appliances]);

      useEffect(() => {
        setIsPaidUser(Boolean(currentUser?.is_pro));
        setThemeMode(localStorage.getItem('app_theme') || 'dark');
        TelemetryEngine.flushQueue();
      }, [currentUser]);

      // Cloud Push Helper
      const pushCatalogToCloud = async (appList = appliances) => {
        if (!currentUser?.email) return;
        try {
          await fetch(WORKER_ENDPOINT + 'sync-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userEmail: currentUser.email, appliances: appList })
          });
        } catch (e) {}
      };

      // OTP Login Actions
      const handleRequestOtp = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        setDevPasscodeNotice('');
        try {
          const res = await fetch(WORKER_ENDPOINT + 'api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: authEmailInput })
          });
          const data = await res.json();
          if (data.status === 'sent') {
            setAuthStep('otp');
            if (data.devCode) {
              setDevPasscodeNotice(`Dev Mode Code: ${data.devCode}`);
            }
          }
        } catch (err) {
          alert("Could not send code. Check connection.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleConfirmOtp = async (e) => {
        e.preventDefault();
        setAuthLoading(true);
        try {
          const res = await fetch(WORKER_ENDPOINT + 'api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: authEmailInput, pin: authPinInput })
          });
          const data = await res.json();
          if (data.token) {
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('app_user_session', JSON.stringify(data.user));
            setCurrentUser(data.user);
            setIsPaidUser(Boolean(data.user.is_pro));

            // Restore from cloud or push local
            const pullRes = await fetch(WORKER_ENDPOINT + 'sync-pull', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ userEmail: data.user.email })
            });
            const pullData = await pullRes.json();
            if (pullData.appliances && pullData.appliances.length > 0) {
              setAppliances(pullData.appliances);
            } else if (appliances.length > 0) {
              await pushCatalogToCloud(appliances);
            }

            setIsAuthModalOpen(false);
            setAuthStep('email');
          } else {
            alert(data.error || "Invalid code");
          }
        } catch (err) {
          alert("Verification error.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('app_user_session');
        setCurrentUser(null);
        setIsPaidUser(false);
      };

      const handleAddAppliance = async (e) => {
        e.preventDefault();
        setIsAnalyzing(true);
        setLookupStatus('Cataloging equipment specs...');

        const effectiveBrand = brandInput.trim();
        const effectiveModel = modelInput.trim();
        const effectiveName = nameInput.trim() || `${effectiveBrand} Equipment`;
        const isoDate = parseMMDDYYYYToISO(purchaseDateInput);

        const newItem = {
          id: `app_${Date.now()}`,
          unitId: 'unit_main',
          name: effectiveName,
          nickname: nicknameInput.trim(),
          brand: effectiveBrand,
          modelNumber: effectiveModel,
          category: 'Appliance',
          purchaseDate: isoDate,
          warrantyMonths: isoDate ? Number(warrantyMonthsInput) : 0,
          consumables: [],
          replacementParts: [],
          seasonalTasks: generateSeasonalRemindersForAsset('Appliance', effectiveName, effectiveBrand)
        };

        const updated = [newItem, ...appliances];
        setAppliances(updated);
        TelemetryEngine.recordReliabilityEvent('asset_registered', effectiveModel, 'Appliance');
        await pushCatalogToCloud(updated);

        setBrandInput('');
        setModelInput('');
        setNameInput('');
        setNicknameInput('');
        setPurchaseDateInput('');
        setIsAnalyzing(false);
        setIsAddOpen(false);
      };

      const openAssistant = (item) => {
        setActiveAppliance(item);
        setMessages([{
          id: '1',
          sender: 'assistant',
          text: `What is going on with your ${item.brand} ${item.name}? Describe symptoms, error codes, or noises.`
        }]);
      };

      const sendQuery = async (text) => {
        const q = text || queryInput;
        if (!q.trim() || !activeAppliance || isLoading) return;

        if (q.toLowerCase().includes('go deeper') && !isPaidUser) {
          setIsPaywallOpen(true);
          return;
        }

        const userMsg = { id: Date.now().toString(), sender: 'user', text: q };
        const updated = [...messages, userMsg];
        setMessages(updated);
        setQueryInput('');

        TelemetryEngine.recordReliabilityEvent('hardware_triage', activeAppliance.modelNumber, activeAppliance.category);
        AIQuotaTracker.increment(isPaidUser);

        setIsLoading(true);
        try {
          const res = await fetch(WORKER_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `[Context: ${activeAppliance.brand} ${activeAppliance.modelNumber}] Query: ${q}`,
              history: messages,
              isPaid: isPaidUser
            })
          });
          const data = await res.json();
          setMessages([...updated, { id: Date.now().toString(), sender: 'assistant', text: data.text || "Diagnostic received." }]);
        } catch (e) {
          setMessages([...updated, { id: Date.now().toString(), sender: 'assistant', text: "Service temporarily unreachable." }]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-200 ${
          isDark ? 'bg-black text-white' : 'bg-[#F2F2F7] text-[#1C1C1E]'
        }`}>
          {/* Header */}
          <header className={`px-5 pt-12 pb-3.5 sticky top-0 z-20 backdrop-blur-2xl border-b transition-colors ${
            isDark ? 'bg-black/75 border-white/10' : 'bg-white/80 border-black/10'
          }`}>
            <div className="flex justify-between items-end">
              <div>
                <p className="text-[12px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-500">
                  {isPaidUser ? 'Pro Manager' : (currentUser ? 'Connected Account' : 'Guest Mode')}
                </p>
                <h1 className="text-3xl font-extrabold tracking-tight">Appliances</h1>
              </div>

              <div className="flex items-center gap-2.5 pb-0.5">
                <button
                  onClick={() => setIsAddOpen(true)}
                  className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-lg shadow-sm active:scale-90 transition-transform ${
                    isDark ? 'bg-white/10 text-white' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}
                >
                  +
                </button>
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className={`w-9 h-9 rounded-full flex items-center justify-center active:scale-90 transition-transform shadow-sm ${
                    isDark ? 'bg-white/10 text-white' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 4-5 8-5s8 1 8 5"/>
                  </svg>
                </button>
              </div>
            </div>
          </header>

          {/* Main List */}
          <main className="flex-1 p-4 space-y-3 pb-28">
            {appliances.length === 0 ? (
              <div className={`text-center py-16 px-4 rounded-3xl border ${isDark ? 'bg-zinc-900/40 border-white/5' : 'bg-white border-black/10'}`}>
                <p className="text-sm font-bold">No appliances added yet</p>
                <p className={`text-xs mt-1 ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>Tap + to scan a label or enter details manually.</p>
              </div>
            ) : (
              appliances.map(item => (
                <div
                  key={item.id}
                  className={`rounded-2xl p-4 border transition-all ${
                    isDark ? 'bg-zinc-900/80 border-white/10' : 'bg-white border-black/10 shadow-sm'
                  }`}
                >
                  <div className="flex justify-between items-start">
                    <div>
                      <h2 className="text-base font-extrabold truncate">{item.name}</h2>
                      <p className={`text-xs mt-0.5 ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                        {item.brand} {item.modelNumber && `• ${item.modelNumber}`}
                      </p>
                    </div>
                    <button
                      onClick={() => openAssistant(item)}
                      className="bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm active:scale-95 transition-transform"
                    >
                      Ask Manual 💬
                    </button>
                  </div>
                </div>
              ))
            )}
          </main>

          {/* Add Equipment Sheet */}
          {isAddOpen && (
            <div
              onClick={() => setIsAddOpen(false)}
              className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-[32px] p-6 space-y-4 border-t cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-extrabold">Add Equipment</h3>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsAddOpen(false)} />
                </div>

                <form onSubmit={handleAddAppliance} className="space-y-3">
                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">1. Brand / Maker *</label>
                    <input
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="e.g. Coway, GE, Moen"
                      value={brandInput}
                      onChange={(e) => setBrandInput(e.target.value)}
                      required
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">2. Model # (Optional)</label>
                    <input
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="e.g. AP-1512HH"
                      value={modelInput}
                      onChange={(e) => setModelInput(e.target.value)}
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">3. Product Name *</label>
                    <input
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="e.g. Airmega Mighty Air Purifier"
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                      required
                    />
                  </div>

                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">4. Purchase Date (MM/DD/YYYY)</label>
                    <input
                      type="text"
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="MM/DD/YYYY"
                      value={purchaseDateInput}
                      onChange={(e) => setPurchaseDateInput(formatToMMDDYYYY(e.target.value))}
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={isAnalyzing}
                    className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3.5 rounded-2xl shadow-md active:scale-98 transition-all"
                  >
                    Save Equipment
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Account & Auth Modal */}
          {isAuthModalOpen && (
            <div
              onClick={() => setIsAuthModalOpen(false)}
              className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-[60] cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-t-[32px] p-6 space-y-4 border-t cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-extrabold">Account Login / Register</h3>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsAuthModalOpen(false)} />
                </div>

                {authStep === 'email' ? (
                  <form onSubmit={handleRequestOtp} className="space-y-3">
                    <p className={`text-xs ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                      Enter your email to sign in or create an account. We'll send a 6-digit confirmation code.
                    </p>
                    <input
                      type="email"
                      className={`w-full rounded-2xl p-3 text-xs font-semibold focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="your@email.com"
                      value={authEmailInput}
                      onChange={(e) => setAuthEmailInput(e.target.value)}
                      required
                    />
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs py-3 rounded-2xl shadow-sm active:scale-95"
                    >
                      {authLoading ? 'Sending...' : 'Send Login Code'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleConfirmOtp} className="space-y-3">
                    <p className={`text-xs ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                      Enter the 6-digit PIN sent to {authEmailInput}:
                    </p>
                    <input
                      type="text"
                      inputMode="numeric"
                      maxLength="6"
                      className={`w-full text-center tracking-widest text-lg font-bold rounded-2xl p-3 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="123456"
                      value={authPinInput}
                      onChange={(e) => setAuthPinInput(e.target.value.replace(/\D/g, ''))}
                      required
                    />
                    {devPasscodeNotice && (
                      <p className="text-[11px] text-amber-500 font-bold text-center">{devPasscodeNotice}</p>
                    )}
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-2xl shadow-sm active:scale-95"
                    >
                      {authLoading ? 'Verifying...' : 'Confirm & Log In'}
                    </button>
                    <button
                      type="button"
                      onClick={() => setAuthStep('email')}
                      className="w-full text-center text-[11px] text-zinc-500 hover:underline"
                    >
                      Change Email
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* Settings Modal */}
          {isSettingsOpen && (
            <div
              onClick={() => setIsSettingsOpen(false)}
              className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-[32px] p-6 space-y-4 border-t cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-center pb-2 border-b border-white/10">
                  <h3 className="text-base font-extrabold">Settings</h3>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsSettingsOpen(false)} />
                </div>

                <div className={`p-4 rounded-2xl border space-y-2.5 ${isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10'}`}>
                  <div className="flex justify-between items-center">
                    <div>
                      <p className="text-xs font-extrabold">Account Connection</p>
                      <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                        {currentUser ? currentUser.email : "Not signed in (Guest Mode)"}
                      </p>
                    </div>
                    {currentUser ? (
                      <button onClick={handleLogout} className="text-xs text-rose-500 font-bold underline">
                        Log Out
                      </button>
                    ) : (
                      <button
                        onClick={() => { setIsSettingsOpen(false); setIsAuthModalOpen(true); }}
                        className="bg-amber-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow-sm"
                      >
                        Sign In
                      </button>
                    )}
                  </div>
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10'}`}>
                  <div>
                    <p className="text-xs font-extrabold">Subscription Plan</p>
                    <p className={`text-[11px] ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>{isPaidUser ? 'Pro Manager' : 'Free Standard'}</p>
                  </div>
                  {!isPaidUser && (
                    <button
                      onClick={() => {
                        if (!currentUser) {
                          setIsSettingsOpen(false);
                          setIsAuthModalOpen(true);
                        } else {
                          setIsPaywallOpen(true);
                        }
                      }}
                      className="bg-amber-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl"
                    >
                      Upgrade ($3.99/mo)
                    </button>
                  )}
                </div>

                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-zinc-800 text-white font-bold text-xs py-3 rounded-2xl">
                  Close
                </button>
              </div>
            </div>
          )}

          {/* Assistant Modal */}
          {activeAppliance && (
            <div
              onClick={() => setActiveAppliance(null)}
              className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-md h-[80vh] rounded-t-[32px] p-5 flex flex-col border-t cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-center pb-2 border-b border-white/10">
                  <div>
                    <h3 className="text-sm font-extrabold">{activeAppliance.name}</h3>
                    <p className="text-[11px] text-zinc-400">Diagnostic Assistant</p>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setActiveAppliance(null)} />
                </div>

                <div className="flex gap-1.5 py-2 overflow-x-auto scrollbar-none">
                  {getAdaptiveChips(activeAppliance).map(chip => (
                    <button
                      key={chip}
                      onClick={() => sendQuery(chip)}
                      className={`text-xs px-3 py-1 rounded-full font-bold whitespace-nowrap ${
                        chip === 'Go Deeper' ? 'bg-amber-600 text-white' : 'bg-zinc-800 text-zinc-300'
                      }`}
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 py-2 text-xs">
                  {messages.map(m => (
                    <div
                      key={m.id}
                      className={`p-3 rounded-2xl max-w-[85%] whitespace-pre-line font-medium ${
                        m.sender === 'user' ? 'ml-auto bg-amber-600 text-white' : 'mr-auto bg-zinc-800 text-zinc-200'
                      }`}
                    >
                      {m.text}
                    </div>
                  ))}
                  {isLoading && <p className="text-xs text-zinc-400 animate-pulse px-2">Analyzing...</p>}
                </div>

                <div className="pt-2 flex gap-2">
                  <input
                    className="flex-1 rounded-full px-4 py-2 text-xs bg-zinc-800 text-white focus:outline-none"
                    placeholder="Describe issue..."
                    value={queryInput}
                    onChange={(e) => setQueryInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && sendQuery()}
                  />
                  <button onClick={() => sendQuery()} className="bg-amber-600 text-white font-bold text-xs px-4 rounded-full">
                    Send
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
