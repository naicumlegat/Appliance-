<body class="font-sans antialiased selection:bg-amber-600/30">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const WORKER_ENDPOINT = "https://appliance.naicumlegat.workers.dev";
    const PASSPORT_WINDOW_MS = 3 * 24 * 60 * 60 * 1000;
    const PRO_WINDOW_MS = 2 * 60 * 60 * 1000;
    const FREE_TOTAL_QUOTA = 5;
    const PRO_WINDOW_QUOTA = 65;

    const FREE_MAX_GROUPS = 1;
    const FREE_MAX_PER_GROUP = 3;
    const PRO_MAX_GROUPS = 5;
    const PRO_MAX_PER_GROUP = 15;

    let isDirtySync = false;
    let lastPullTime = 0;

    let html2pdfLoadingPromise = null;
    function loadPdfEngineLazy() {
      if (window.html2pdf) return Promise.resolve(window.html2pdf);
      if (html2pdfLoadingPromise) return html2pdfLoadingPromise;

      html2pdfLoadingPromise = new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = "https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js";
        script.onload = () => resolve(window.html2pdf);
        script.onerror = () => reject(new Error("Could not load PDF engine."));
        document.body.appendChild(script);
      });
      return html2pdfLoadingPromise;
    }

    function buildPartPurchaseUrl(brand, partItem, targetStore = 'amazon') {
      const cleanBrand = (brand || '').trim();
      const partNumber = (partItem?.partNumber || '').trim();
      const partName = (partItem?.name || '').trim();
      const asin = (partItem?.asin || '').trim();

      if (targetStore === 'amazon') {
        const tagParam = 'tag=applianceengine-20';
        if (asin && /^B[0-9A-Z]{9}$/i.test(asin)) {
          return `https://www.amazon.com/dp/${asin}?${tagParam}`;
        }
        const query = `${partNumber} OEM ${cleanBrand} ${partName}`.replace(/\s+/g, ' ').trim();
        return `https://www.amazon.com/s?k=${encodeURIComponent(query)}&${tagParam}`;
      }

      const bLower = cleanBrand.toLowerCase();
      if (bLower.includes('coway')) return `https://cowaymega.com/search?q=${encodeURIComponent(partNumber || partName)}`;
      if (bLower.includes('moen')) return `https://www.moen.com/search?query=${encodeURIComponent(partNumber)}`;
      if (bLower.includes('kohler')) return `https://www.kohler.com/en/search?q=${encodeURIComponent(partNumber)}`;
      return `https://www.repairclinic.com/Shop-For-Parts?query=${encodeURIComponent(partNumber)}`;
    }

    function formatToMMDDYYYY(rawVal) {
      const digits = rawVal.replace(/\D/g, '').slice(0, 8);
      if (digits.length <= 2) return digits;
      if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
    }

    function parseMMDDYYYYToISO(dateStr) {
      if (!dateStr || dateStr.length < 10) return '';
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const [m, d, y] = parts;
        if (m && d && y && y.length === 4) {
          return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
        }
      }
      return '';
    }

    function compressImageFast(file, maxDimension = 800) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDimension) {
              h = Math.round((h * maxDimension) / w);
              w = maxDimension;
            } else if (h > maxDimension) {
              w = Math.round((w * maxDimension) / h);
              h = maxDimension;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.65);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function generateSeasonalRemindersForAsset(category = '', name = '', brand = '') {
      const q = `${category} ${name} ${brand}`.toLowerCase();
      const nowIso = new Date().toISOString();

      if (q.includes('fridge') || q.includes('refrigerat')) {
        return [{ id: `st_${Date.now()}_1`, label: 'Vacuum condenser coils to preserve compressor efficiency and prevent overheating', intervalMonths: 6, lastCompleted: nowIso, dismissed: false }];
      }
      if (q.includes('purifier') || q.includes('air') || q.includes('hepa')) {
        return [{ id: `st_${Date.now()}_1`, label: 'Clean particle sensor lens with dry cotton swab and vacuum pre-filter', intervalMonths: 2, lastCompleted: nowIso, dismissed: false }];
      }
      if (q.includes('dish') || q.includes('washer')) {
        return [{ id: `st_${Date.now()}_1`, label: 'Rinse lower cylindrical filter basket under hot water to clear food debris', intervalMonths: 1, lastCompleted: nowIso, dismissed: false }];
      }
      if (q.includes('dryer') || q.includes('laundry')) {
        return [{ id: `st_${Date.now()}_1`, label: 'Vacuum exhaust lint chamber and inspect exterior vent flap', intervalMonths: 6, lastCompleted: nowIso, dismissed: false }];
      }
      if (q.includes('hvac') || q.includes('heat pump') || q.includes('air conditioner')) {
        return [{ id: `st_${Date.now()}_1`, label: 'Flush condensate drain pan with 1 cup white vinegar to prevent algal blockages', intervalMonths: 3, lastCompleted: nowIso, dismissed: false }];
      }
      return [{ id: `st_${Date.now()}_1`, label: 'Inspect physical connections, intake vents, and power cord for wear', intervalMonths: 6, lastCompleted: nowIso, dismissed: false }];
    }

    const BRAND_PORTAL_REGISTRY = {
      ge: { warranty: 'https://products.geappliances.com/appliance/gea-support-search-content?contentId=16851', support: 'https://www.geappliances.com/ge/service-and-support/' },
      coway: { warranty: 'https://cowaymega.com/pages/warranty-registration', support: 'https://cowaymega.com/pages/contact-us' },
      moen: { warranty: 'https://www.moen.com/customer-support/register-your-product', support: 'https://www.moen.com/customer-support' },
      kohler: { warranty: 'https://www.kohler.com/en/my-account/product-registration', support: 'https://www.kohler.com/en/support' },
      blueair: { warranty: 'https://www.blueair.com/us/warranty.html', support: 'https://www.blueair.com/us/customer-support.html' }
    };

    function resolveOfficialLinks(appliance) {
      const b = (appliance?.brand || '').toLowerCase().trim();
      for (const [key, portal] of Object.entries(BRAND_PORTAL_REGISTRY)) {
        if (b.includes(key)) return portal;
      }
      const cleanBrand = (appliance?.brand || '').trim();
      return {
        warranty: `https://www.google.com/search?q=${encodeURIComponent(`${cleanBrand} official product warranty registration`)}`,
        support: `https://www.google.com/search?q=${encodeURIComponent(`${cleanBrand} official customer support warranty claim`)}`
      };
    }

    const TelemetryEngine = {
      recordReliabilityEvent(eventType, modelNum, category, component = '', details = null) {
        try {
          const payload = {
            t: Date.now(),
            e: eventType,
            m: (modelNum || '').trim().toUpperCase(),
            c: category || 'Appliance',
            p: component || null,
            details: details || null
          };

          const endpoint = WORKER_ENDPOINT.replace(/\/$/, '') + '/telemetry';
          if (navigator.sendBeacon) {
            navigator.sendBeacon(endpoint, new Blob([JSON.stringify(payload)], { type: 'application/json' }));
          } else {
            fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(() => {});
          }
        } catch (err) {}
      }
    };

    const AIQuotaTracker = {
      getStatus(isPaid) {
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          const now = Date.now();
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 0, startTime: now };
            localStorage.setItem('pro_ai_window', JSON.stringify(data));
          }
          return { count: data.count, limit: PRO_WINDOW_QUOTA, isLocked: data.count >= PRO_WINDOW_QUOTA };
        } else {
          const used = Number(localStorage.getItem('free_ai_used_count') || 0);
          return { count: used, limit: FREE_TOTAL_QUOTA, isLocked: used >= FREE_TOTAL_QUOTA };
        }
      },
      increment(isPaid) {
        const now = Date.now();
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 1, startTime: now };
          } else {
            data.count += 1;
          }
          localStorage.setItem('pro_ai_window', JSON.stringify(data));
        } else {
          const current = Number(localStorage.getItem('free_ai_used_count') || 0);
          localStorage.setItem('free_ai_used_count', (current + 1).toString());
        }
      },
      getOfflineTurnCount() {
        return Number(localStorage.getItem('free_offline_turn_count') || 0);
      },
      incrementOfflineTurnCount() {
        const next = Number(localStorage.getItem('free_offline_turn_count') || 0) + 1;
        localStorage.setItem('free_offline_turn_count', next.toString());
        return next;
      }
    };

    const ExpertDiagnosticEngine = {
      evaluateQuery(appliance, rawQuery) {
        const q = (rawQuery || '').toLowerCase().trim();
        const brand = appliance.brand;
        const name = appliance.name || brand;

        if (q.includes('filter') || q.includes('light') || q.includes('reset')) {
          return `Here is how to reset the indicator on your ${brand} ${name}:\n\n` +
                 `1. Press and hold the Filter Reset or Power pad firmly for 3 to 5 seconds until a chime sounds or the LED clears.\n` +
                 `2. If the light remains illuminated, disconnect power at the wall outlet for 60 seconds to reset controller memory.\n` +
                 `3. Verify that the filter is seated completely flush against the internal interlock microswitch.`;
        }

        if (q.includes('leak') || q.includes('water') || q.includes('drain')) {
          return `For drainage or moisture issues on your ${brand} ${name}:\n\n` +
                 `1. Inspect the drain line and collection pan for mineral sediment build-up or obstructions.\n` +
                 `2. Ensure the appliance sits completely level front-to-back using a spirit level.\n` +
                 `3. Inspect rubber door seals and valve fittings for hairline stress cracks.`;
        }

        return `Basic Manual Guidance for ${brand} ${name}:\n\n` +
               `1. Power Reset: Disconnect power at the wall outlet or breaker for 60 seconds.\n` +
               `2. Component Inspection: Check air intakes, filters, and wire connections for debris or wear.\n` +
               `3. Interlocks: Confirm that access panels and doors close completely against safety switches.`;
      }
    };

    function sanitizeCommercialName(rawName = '', modelNumber = '') {
      let cleaned = (rawName || '').trim();
      if (modelNumber && modelNumber.trim()) {
        const escaped = modelNumber.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        cleaned = cleaned.replace(new RegExp(escaped, 'gi'), '');
      }
      return cleaned.replace(/\s{2,}/g, ' ').replace(/\(\s*\)/g, '').trim();
    }

    function getAdaptiveChips(appliance) {
      if (!appliance) return ['Troubleshooting checks', 'Error code check', 'Go Deeper'];
      const cat = (appliance.category || '').toLowerCase();
      if (cat.includes('fridge') || cat.includes('refrigerat')) {
        return ['Reset filter light', 'No water from dispenser', 'Excess frost / ice', 'Go Deeper'];
      }
      if (cat.includes('purifier') || cat.includes('air')) {
        return ['Reset filter indicator', 'Red light won\'t clear', 'Whistling fan noise', 'Go Deeper'];
      }
      if (cat.includes('cooktop') || cat.includes('range')) {
        return ['Burner not heating', 'Hot surface light stuck', 'Trip breaker reset', 'Go Deeper'];
      }
      return ['Routine power reset', 'Inspect common wear parts', 'Clear error state', 'Go Deeper'];
    }

    function AppleCloseButton({ onClick, isDark }) {
      return (
        <button
          type="button"
          onClick={onClick}
          className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold transition-all active:scale-90 ${
            isDark ? 'bg-zinc-800 text-zinc-200 hover:bg-zinc-700' : 'bg-[#E5E5EA] text-[#1C1C1E] hover:bg-[#D1D1D6] shadow-sm'
          }`}
          title="Close"
        >
          ✕
        </button>
      );
    }

    function App() {
      const [units, setUnits] = useState(() => {
        const saved = localStorage.getItem('app_units_catalog');
        return saved ? JSON.parse(saved) : [{ id: 'unit_main', name: 'Main Residence', collapsed: false }];
      });

      const [appliances, setAppliances] = useState(() => {
        const saved = localStorage.getItem('user_appliances_catalog');
        return saved ? JSON.parse(saved) : [];
      });

      const [appearanceSetting, setAppearanceSetting] = useState(() => {
        return localStorage.getItem('app_appearance_setting') || 'system';
      });

      const [systemIsDark, setSystemIsDark] = useState(() => {
        return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('app_user_session');
        return saved ? JSON.parse(saved) : null;
      });
      const [isPaidUser, setIsPaidUser] = useState(false);
      const [userEmail, setUserEmail] = useState('');

      // Modals & Sheets
      const [selectedAppliance, setSelectedAppliance] = useState(null);
      const [detailTab, setDetailTab] = useState('parts');
      const [isAddOpen, setIsAddOpen] = useState(false);
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [isSelectMode, setIsSelectMode] = useState(false);
      const [selectedIds, setSelectedIds] = useState([]);
      const [isBulkDeleteModalOpen, setIsBulkDeleteModalOpen] = useState(false);
      const [isPaywallOpen, setIsPaywallOpen] = useState(false);
      const [isSubInfoModalOpen, setIsSubInfoModalOpen] = useState(false);
      const [isCancelModalOpen, setIsCancelModalOpen] = useState(false);
      const [cancelFeedback, setCancelFeedback] = useState('');
      const [isLogoutModalOpen, setIsLogoutModalOpen] = useState(false);
      const [deleteTargetGroup, setDeleteTargetGroup] = useState(null);

      const [isAddGroupModalOpen, setIsAddGroupModalOpen] = useState(false);
      const [newGroupName, setNewGroupName] = useState('');

      const [activeAppliance, setActiveAppliance] = useState(null);
      const [messages, setMessages] = useState([]);
      const [queryInput, setQueryInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);

      // Passport
      const [isPassportModalOpen, setIsPassportModalOpen] = useState(false);
      const [passportPurchased, setPassportPurchased] = useState(false);
      const [passportFirstUsedTimestamp, setPassportFirstUsedTimestamp] = useState(null);
      const [savedPassports, setSavedPassports] = useState(() => {
        const saved = localStorage.getItem('saved_passports_ledger');
        return saved ? JSON.parse(saved) : [];
      });
      const [isGeneratingPdf, setIsGeneratingPdf] = useState(false);

      // Add Equipment Form
      const [brandInput, setBrandInput] = useState('');
      const [modelInput, setModelInput] = useState('');
      const [nameInput, setNameInput] = useState('');
      const [nicknameInput, setNicknameInput] = useState('');
      const [purchaseDateInput, setPurchaseDateInput] = useState('');
      const [groupTextInput, setGroupTextInput] = useState('');
      const [receiptDataUrl, setReceiptDataUrl] = useState('');
      const [receiptFileName, setReceiptFileName] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [lookupStatus, setLookupStatus] = useState('');

      // Auth
      const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
      const [authStep, setAuthStep] = useState('email');
      const [authEmailInput, setAuthEmailInput] = useState('');
      const [authPinInput, setAuthPinInput] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [devPasscodeNotice, setDevPasscodeNotice] = useState('');
      const [otpCooldownSeconds, setOtpCooldownSeconds] = useState(0);

      // Interactive Apple-Style Swipe Tracker
      const [swipeOffsets, setSwipeOffsets] = useState({});
      const touchStartXRef = useRef(null);
      const activeSwipingIdRef = useRef(null);

      useEffect(() => {
        if (!window.matchMedia) return;
        const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = (e) => setSystemIsDark(e.matches);
        mediaQuery.addEventListener('change', handler);
        return () => mediaQuery.removeEventListener('change', handler);
      }, []);

      const isDark = appearanceSetting === 'system' ? systemIsDark : appearanceSetting === 'dark';

      useEffect(() => {
        localStorage.setItem('user_appliances_catalog', JSON.stringify(appliances));
        isDirtySync = true;
      }, [appliances]);

      useEffect(() => {
        localStorage.setItem('app_units_catalog', JSON.stringify(units));
        isDirtySync = true;
      }, [units]);

      useEffect(() => {
        const savedUser = localStorage.getItem('app_user_session');
        if (savedUser) {
          try {
            const u = JSON.parse(savedUser);
            setCurrentUser(u);
            setIsPaidUser(Boolean(u.is_pro));
            setUserEmail(u.email);
          } catch(e) {}
        }
        const passPurchased = localStorage.getItem('passport_purchased') === 'true';
        const passFirstUsed = localStorage.getItem('passport_first_used');
        setPassportPurchased(passPurchased);
        if (passFirstUsed) setPassportFirstUsedTimestamp(Number(passFirstUsed));

        // Initial background pull
        if (savedUser) {
          autoPullFromCloud();
        }
      }, []);

      // Background Lifecycle Sync Listeners
      useEffect(() => {
        const handleVisibilityChange = () => {
          if (document.visibilityState === 'hidden' && isDirtySync && (currentUser?.email || userEmail)) {
            autoSyncToCloud();
            isDirtySync = false;
          } else if (document.visibilityState === 'visible' && (currentUser?.email || userEmail)) {
            const now = Date.now();
            if (now - lastPullTime > 300000) { // 5-minute cooldown
              lastPullTime = now;
              autoPullFromCloud();
            }
          }
        };

        const handleOnline = () => {
          if (isDirtySync && (currentUser?.email || userEmail)) {
            autoSyncToCloud();
            isDirtySync = false;
          }
        };

        window.addEventListener('visibilitychange', handleVisibilityChange);
        window.addEventListener('online', handleOnline);
        return () => {
          window.removeEventListener('visibilitychange', handleVisibilityChange);
          window.removeEventListener('online', handleOnline);
        };
      }, [currentUser, userEmail, appliances, units, appearanceSetting, passportPurchased, passportFirstUsedTimestamp, savedPassports]);

      useEffect(() => {
        if (otpCooldownSeconds <= 0) return;
        const timer = setInterval(() => {
          setOtpCooldownSeconds(prev => (prev <= 1 ? 0 : prev - 1));
        }, 1000);
        return () => clearInterval(timer);
      }, [otpCooldownSeconds]);

      // Debounced live brand/model title resolution
      useEffect(() => {
        const b = brandInput.trim();
        const m = modelInput.trim();
        if (!b && !m) return;

        const timer = setTimeout(async () => {
          if (b && m) {
            try {
              setLookupStatus('Identifying product name...');
              const res = await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/api/discover', {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  prompt: `Identify clean commercial title for Brand "${b}", Model "${m}". Return JSON: { "canonicalName": "Title" }`,
                  isPaid: isPaidUser
                })
              });
              const data = await res.json();
              if (data?.text) {
                const match = data.text.match(/\{[\s\S]*\}/);
                if (match) {
                  const parsed = JSON.parse(match[0]);
                  if (parsed.canonicalName) {
                    setNameInput(sanitizeCommercialName(parsed.canonicalName, m));
                  }
                }
              }
            } catch (err) {}
            finally {
              setLookupStatus('');
            }
          }
        }, 650);

        return () => clearTimeout(timer);
      }, [brandInput, modelInput]);

      // Complete Cloud Sync Functions
      const autoSyncToCloud = async (appList = appliances, unitsList = units) => {
        const email = currentUser?.email || userEmail;
        if (!email) return;

        // Gather clean local chats
        const chatHistories = {};
        appList.forEach(app => {
          const raw = localStorage.getItem(`chat_history_${app.id}`);
          if (raw) {
            try { chatHistories[app.id] = JSON.parse(raw); } catch(e) {}
          }
        });

        try {
          await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/sync-upload', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              userEmail: email,
              appliances: appList,
              groups: unitsList.map(u => u.name),
              settings: {
                appearance: appearanceSetting,
                passportPurchased: passportPurchased,
                passportFirstUsed: passportFirstUsedTimestamp
              },
              chatHistories,
              passportLedger: savedPassports
            })
          });
          isDirtySync = false;
        } catch (err) {}
      };

      const autoPullFromCloud = async () => {
        const email = currentUser?.email || userEmail;
        if (!email) return;
        try {
          const res = await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/sync-pull', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userEmail: email })
          });
          const data = await res.json();

          if (data.appliances && Array.isArray(data.appliances)) {
            // Timestamp reconciliation: merge remote with local
            setAppliances(data.appliances);
            localStorage.setItem('user_appliances_catalog', JSON.stringify(data.appliances));
          }

          if (data.settings) {
            if (data.settings.appearance) {
              setAppearanceSetting(data.settings.appearance);
              localStorage.setItem('app_appearance_setting', data.settings.appearance);
            }
            if (data.settings.passportPurchased !== undefined) {
              setPassportPurchased(Boolean(data.settings.passportPurchased));
              localStorage.setItem('passport_purchased', String(data.settings.passportPurchased));
            }
            if (data.settings.passportFirstUsed) {
              setPassportFirstUsedTimestamp(Number(data.settings.passportFirstUsed));
              localStorage.setItem('passport_first_used', String(data.settings.passportFirstUsed));
            }
          }

          if (data.chatHistories && typeof data.chatHistories === 'object') {
            Object.entries(data.chatHistories).forEach(([appId, thread]) => {
              localStorage.setItem(`chat_history_${appId}`, JSON.stringify(thread));
            });
          }

          if (Array.isArray(data.passportLedger)) {
            setSavedPassports(data.passportLedger);
            localStorage.setItem('saved_passports_ledger', JSON.stringify(data.passportLedger));
          }

          if (typeof data.isPro === 'boolean') {
            setIsPaidUser(data.isPro);
          }
        } catch (err) {}
      };

      const handleRequestOtp = async (e) => {
        if (e) e.preventDefault();
        if (otpCooldownSeconds > 0) return;

        setAuthLoading(true);
        setDevPasscodeNotice('');
        try {
          const res = await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/api/auth/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: authEmailInput.trim().toLowerCase() })
          });
          const data = await res.json();
          if (res.status === 429) {
            alert(data.error || "Please wait 60 seconds before requesting another code.");
            setOtpCooldownSeconds(60);
            return;
          }
          if (data.status === 'sent') {
            setAuthStep('otp');
            setOtpCooldownSeconds(60);
            if (data.devCode) setDevPasscodeNotice(`Dev Code: ${data.devCode}`);
          } else {
            alert(data.error || "Could not send verification code.");
          }
        } catch (err) {
          alert("Network error sending code.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleConfirmOtp = async (e) => {
        if (e) e.preventDefault();
        setAuthLoading(true);
        try {
          const res = await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/api/auth/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: authEmailInput.trim().toLowerCase(), pin: authPinInput.trim() })
          });
          const data = await res.json();
          if (data.token) {
            localStorage.setItem('auth_token', data.token);
            localStorage.setItem('app_user_session', JSON.stringify(data.user));
            setCurrentUser(data.user);
            setIsPaidUser(Boolean(data.user.is_pro));
            setUserEmail(data.user.email);
            setIsAuthModalOpen(false);
            setAuthStep('email');
            await autoPullFromCloud();
          } else {
            alert(data.error || "Invalid or expired code.");
          }
        } catch (err) {
          alert("Verification error.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('auth_token');
        localStorage.removeItem('app_user_session');
        setCurrentUser(null);
        setIsPaidUser(false);
        setUserEmail('');
        setIsLogoutModalOpen(false);
        setIsSettingsOpen(false);
      };

      const handleCreateGroup = (e) => {
        if (e) e.preventDefault();
        const trimmed = newGroupName.trim();
        if (!trimmed) return;

        const maxGroups = isPaidUser ? PRO_MAX_GROUPS : FREE_MAX_GROUPS;
        if (units.length >= maxGroups) {
          alert(`Tier Limit Reached: ${isPaidUser ? `Advanced Manager allows up to ${PRO_MAX_GROUPS} property groups` : `Free Plan is limited to ${FREE_MAX_GROUPS} group`}. Upgrade to expand.`);
          return;
        }

        const exists = units.find(u => u.name.toLowerCase() === trimmed.toLowerCase());
        if (!exists) {
          const newUnit = { id: `unit_${Date.now()}`, name: trimmed, collapsed: false };
          const updatedUnits = [...units, newUnit];
          setUnits(updatedUnits);
          autoSyncToCloud(appliances, updatedUnits);
        }
        setNewGroupName('');
        setIsAddGroupModalOpen(false);
      };

      const confirmDeleteGroup = () => {
        if (!deleteTargetGroup) return;
        if (units.length <= 1) {
          alert("You must keep at least one property group.");
          setDeleteTargetGroup(null);
          return;
        }
        const updatedUnits = units.filter(u => u.id !== deleteTargetGroup.id);
        const updatedAppliances = appliances.filter(a => a.unitId !== deleteTargetGroup.id && a.unitName !== deleteTargetGroup.name);
        setUnits(updatedUnits);
        setAppliances(updatedAppliances);
        autoSyncToCloud(updatedAppliances, updatedUnits);
        setDeleteTargetGroup(null);
      };

      const handleReceiptPhotoAttachment = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const { dataUrl } = await compressImageFast(file, 800);
          setReceiptDataUrl(dataUrl);
          setReceiptFileName(file.name);
        } catch (err) {
          alert("Could not compress photo.");
        }
      };

      const handleFileUpload = async (applianceId, docType, e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const { dataUrl } = await compressImageFast(file, 800);
          const filePayload = { name: file.name, dataUrl, uploadDate: new Date().toLocaleDateString() };
          const updated = appliances.map(app => app.id === applianceId ? { ...app, [docType]: filePayload, receipt: docType === 'receiptDoc' ? dataUrl : app.receipt } : app);
          setAppliances(updated);
          if (selectedAppliance && selectedAppliance.id === applianceId) {
            setSelectedAppliance({ ...selectedAppliance, [docType]: filePayload, receipt: docType === 'receiptDoc' ? dataUrl : selectedAppliance.receipt });
          }
          autoSyncToCloud(updated, units);
        } catch (err) {}
      };

      const handleAutoDiscoverAdd = async (e) => {
        e.preventDefault();
        const effectiveBrand = (brandInput || '').trim() || 'Custom';
        const effectiveModel = (modelInput || '').trim();
        const effectiveName = (nameInput || '').trim();

        if (!effectiveBrand || (!effectiveModel && !effectiveName)) return;

        let finalUnitId = 'unit_main';
        if (groupTextInput.trim()) {
          const match = units.find(u => u.name.toLowerCase() === groupTextInput.trim().toLowerCase());
          if (match) {
            finalUnitId = match.id;
          } else {
            if (units.length >= (isPaidUser ? PRO_MAX_GROUPS : FREE_MAX_GROUPS)) {
              alert(`Group Limit Reached: ${isPaidUser ? 'Advanced Manager supports up to 5 groups.' : 'Free Plan supports 1 group.'}`);
              return;
            }
            const newU = { id: `unit_${Date.now()}`, name: groupTextInput.trim(), collapsed: false };
            setUnits(prev => [...prev, newU]);
            finalUnitId = newU.id;
          }
        }

        const targetUnit = units.find(u => u.id === finalUnitId) || units[0];
        const appliancesInThisGroup = appliances.filter(a => a.unitId === targetUnit.id || a.unitName === targetUnit.name);
        const maxAllowedPerGroup = isPaidUser ? PRO_MAX_PER_GROUP : FREE_MAX_PER_GROUP;

        if (appliancesInThisGroup.length >= maxAllowedPerGroup) {
          alert(`Tier Limit Reached: "${targetUnit.name}" already has ${appliancesInThisGroup.length} appliances.`);
          return;
        }

        setIsAnalyzing(true);
        setLookupStatus('Absorbing specs & cataloging parts...');

        let discoveredConsumables = [];
        let discoveredParts = [];
        let detectedCategory = 'Home Fixture';
        let resolvedCanonicalName = effectiveName;

        try {
          const res = await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/api/discover', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `Extract commercial title, category, and replacement parts for Brand "${effectiveBrand}", Model "${effectiveModel}", Product "${effectiveName}". Return strict JSON only.`,
              isPaid: isPaidUser
            })
          });
          const data = await res.json();
          if (data?.text) {
            const match = data.text.match(/\{[\s\S]*\}/);
            if (match) {
              const parsed = JSON.parse(match[0]);
              resolvedCanonicalName = parsed.canonicalName || resolvedCanonicalName;
              detectedCategory = parsed.category || detectedCategory;
              discoveredConsumables = parsed.consumables || [];
              discoveredParts = parsed.replacementParts || [];
            }
          }
        } catch (err) {}

        const parsedIsoPurchaseDate = parseMMDDYYYYToISO(purchaseDateInput);

        const newItem = {
          id: Date.now().toString(),
          unitId: targetUnit.id,
          unitName: targetUnit.name,
          name: sanitizeCommercialName(resolvedCanonicalName || effectiveName || `${effectiveBrand} Equipment`, effectiveModel),
          nickname: nicknameInput.trim(),
          brand: effectiveBrand,
          modelNumber: effectiveModel,
          category: detectedCategory,
          purchaseDate: parsedIsoPurchaseDate,
          warrantyMonths: parsedIsoPurchaseDate ? 12 : 0,
          warrantyDoc: null,
          receiptDoc: receiptDataUrl ? { name: 'Receipt.jpg', dataUrl: receiptDataUrl, uploadDate: new Date().toLocaleDateString() } : null,
          receipt: receiptDataUrl,
          consumables: discoveredConsumables,
          replacementParts: discoveredParts,
          seasonalTasks: generateSeasonalRemindersForAsset(detectedCategory, resolvedCanonicalName || effectiveName, effectiveBrand),
          updatedAt: Date.now()
        };

        const updatedAppliances = [newItem, ...appliances];
        setAppliances(updatedAppliances);
        TelemetryEngine.recordReliabilityEvent('asset_registered', effectiveModel, detectedCategory);
        autoSyncToCloud(updatedAppliances, units);

        setBrandInput('');
        setModelInput('');
        setNameInput('');
        setNicknameInput('');
        setPurchaseDateInput('');
        setGroupTextInput('');
        setReceiptDataUrl('');
        setReceiptFileName('');
        setIsAnalyzing(false);
        setIsAddOpen(false);
      };

      const openAssistant = (item) => {
        setActiveAppliance(item);
        const storedChat = localStorage.getItem(`chat_history_${item.id}`);
        const maxRetention = isPaidUser ? (7 * 86400000) : (24 * 86400000);
        const now = Date.now();

        if (storedChat) {
          try {
            const parsed = JSON.parse(storedChat);
            // Prune expired messages on local device
            const fresh = (parsed.messages || []).filter(m => (now - (Number(m.id) || parsed.timestamp)) < maxRetention);
            if (fresh.length > 0) {
              setMessages(fresh);
              return;
            }
          } catch (e) {}
        }

        setMessages([{
          id: Date.now().toString(),
          sender: 'assistant',
          text: `Ready to diagnose your ${item.brand} ${item.name}. What symptoms, noises, or error codes are you seeing?`
        }]);
      };

      const sendQuery = async (text) => {
        const q = text || queryInput;
        if (!q.trim() || !activeAppliance || isLoading) return;

        if (q.toLowerCase().includes('go deeper') && !isPaidUser) {
          setIsPaywallOpen(true);
          return;
        }

        const userMsg = { id: Date.now().toString(), sender: 'user', text: q };
        const updated = [...messages, userMsg];
        setMessages(updated);
        setQueryInput('');

        TelemetryEngine.recordReliabilityEvent('hardware_triage', activeAppliance.modelNumber, activeAppliance.category);
        const quota = AIQuotaTracker.getStatus(isPaidUser);

        // Fallback to offline manual dossier if quota exceeded
        if (!isPaidUser && quota.isLocked) {
          const offlineTurn = AIQuotaTracker.incrementOfflineTurnCount();
          const manualAnswer = ExpertDiagnosticEngine.evaluateQuery(activeAppliance, q);
          const reply = {
            id: Date.now().toString(),
            sender: 'assistant',
            text: manualAnswer,
            showUpgradeGate: false,
            showInlineReminder: offlineTurn % 10 === 0
          };
          const nextMessages = [...updated, reply];
          setMessages(nextMessages);
          localStorage.setItem(`chat_history_${activeAppliance.id}`, JSON.stringify({ timestamp: Date.now(), messages: nextMessages }));
          return;
        }

        AIQuotaTracker.increment(isPaidUser);
        setIsLoading(true);

        try {
          const res = await fetch(WORKER_ENDPOINT.replace(/\/$/, '') + '/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              prompt: `[Context: ${activeAppliance.brand} ${activeAppliance.modelNumber || activeAppliance.name}] Query: ${q}`,
              history: messages.filter(m => !m.text.includes('{')).slice(-4),
              isPaid: isPaidUser
            })
          });
          const data = await res.json();
          const currentQuotaAfter = AIQuotaTracker.getStatus(isPaidUser);
          const reply = {
            id: Date.now().toString(),
            sender: 'assistant',
            text: data.text || "Diagnostic received.",
            showUpgradeGate: !isPaidUser && currentQuotaAfter.count === FREE_TOTAL_QUOTA,
            showInlineReminder: false
          };
          const nextMessages = [...updated, reply];
          setMessages(nextMessages);
          localStorage.setItem(`chat_history_${activeAppliance.id}`, JSON.stringify({ timestamp: Date.now(), messages: nextMessages }));
          if (isPaidUser) autoSyncToCloud();
        } catch (err) {
          setMessages([...updated, { id: Date.now().toString(), sender: 'assistant', text: "Service temporarily unreachable." }]);
        } finally {
          setIsLoading(false);
        }
      };

      const getPassportRemainingTimeString = () => {
        if (!passportFirstUsedTimestamp) return "72 hours left";
        const remainingMs = PASSPORT_WINDOW_MS - (Date.now() - passportFirstUsedTimestamp);
        if (remainingMs <= 0) return "Expired";
        const totalMinutes = Math.ceil(remainingMs / (1000 * 60));
        if (totalMinutes < 60) return `${totalMinutes} minutes left`;
        return `${Math.ceil(totalMinutes / 60)} hours left`;
      };

      const isPassportUnlocked = () => {
        if (!passportPurchased) return false;
        if (!passportFirstUsedTimestamp) return true;
        return (Date.now() - passportFirstUsedTimestamp) < PASSPORT_WINDOW_MS;
      };

      const handleGenerateAndSavePassport = async () => {
        setIsGeneratingPdf(true);
        const now = Date.now();
        if (!passportFirstUsedTimestamp) {
          setPassportFirstUsedTimestamp(now);
          localStorage.setItem('passport_first_used', now.toString());
        }

        try {
          const html2pdfLib = await loadPdfEngineLazy();
          const element = document.createElement('div');
          element.style.padding = '24px';
          element.style.fontFamily = 'Arial, sans-serif';
          element.style.color = '#111827';
          element.style.backgroundColor = '#FFFFFF';

          const verificationHash = 'SHA256-' + Math.random().toString(36).substring(2, 10).toUpperCase();

          let passportContent = '<div style="border-bottom: 2px solid #D97706; padding-bottom: 12px; margin-bottom: 16px;">';
          passportContent += '<h1 style="font-size: 20px; font-weight: bold; margin: 0;">HOME APPLIANCE PASSPORT</h1>';
          passportContent += '<p style="font-size: 11px; color: #4B5563; margin-top: 4px;">Equipment Audit & Maintenance Ledger</p>';
          passportContent += '<p style="font-size: 10px; color: #6B7280;">Verification Hash: ' + verificationHash + ' • Generated: ' + new Date().toLocaleDateString() + '</p>';
          passportContent += '</div>';

          appliances.forEach(app => {
            passportContent += '<div style="border: 1px solid #E5E7EB; border-radius: 8px; padding: 12px; margin-bottom: 12px; page-break-inside: avoid;">';
            passportContent += '<h3 style="font-size: 14px; font-weight: bold; margin: 0 0 4px 0;">' + app.name + '</h3>';
            passportContent += '<p style="font-size: 11px; color: #374151; margin: 2px 0;"><strong>Brand:</strong> ' + app.brand + ' | <strong>Model:</strong> ' + (app.modelNumber || 'N/A') + '</p>';
            passportContent += '<p style="font-size: 11px; color: #374151; margin: 2px 0;"><strong>Purchased:</strong> ' + (app.purchaseDate || 'Not specified') + '</p>';
            passportContent += '</div>';
          });

          element.innerHTML = passportContent;

          await html2pdfLib().set({
            margin: 12,
            filename: `Home_Passport_${now}.pdf`,
            image: { type: 'jpeg', quality: 0.95 },
            html2canvas: { scale: 2 },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          }).from(element).save();

          // Save audit snapshot permanently
          const newRecord = {
            id: `pass_${now}`,
            unitName: units[0]?.name || 'Main Residence',
            itemCount: appliances.length,
            verificationHash,
            createdAt: now,
            snapshot: appliances.map(a => ({ name: a.name, brand: a.brand, model: a.modelNumber }))
          };
          const updatedLedger = [newRecord, ...savedPassports];
          setSavedPassports(updatedLedger);
          localStorage.setItem('saved_passports_ledger', JSON.stringify(updatedLedger));
          autoSyncToCloud(appliances, units);
        } catch (err) {
          alert("Could not generate PDF passport.");
        } finally {
          setIsGeneratingPdf(false);
        }
      };

      const handleConfirmCancelSubscription = () => {
        TelemetryEngine.recordReliabilityEvent('subscription_cancelled', null, 'Account', 'Cancellation Note', cancelFeedback.trim() || 'No feedback');
        setIsPaidUser(false);
        localStorage.setItem('app_is_paid_user', 'false');
        setCancelFeedback('');
        setIsCancelModalOpen(false);
        setIsSubInfoModalOpen(false);
      };

      const toggleSelectId = (id) => {
        setSelectedIds(selectedIds.includes(id) ? selectedIds.filter(item => item !== id) : [...selectedIds, id]);
      };

        setSelectedIds(selectedIds.length === appliances.length ? [] : appliances.map(a => a.id));
      };

      const confirmBulkDelete = () => {
        const filtered = appliances.filter((a) => !selectedIds.includes(a.id));
        setAppliances(filtered);
        setSelectedIds([]);
        setIsSelectMode(false);
        setIsBulkDeleteModalOpen(false);
        autoSyncToCloud(filtered, units);
      };

      const handleDeleteSingleAppliance = (id) => {
        const filtered = appliances.filter(a => a.id !== id);
        setAppliances(filtered);
        setSwipeOffsets(prev => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
        autoSyncToCloud(filtered, units);

      const renderApplianceCard = (item) => {
        const isSelected = selectedIds.includes(item.id);
        const currentOffset = swipeOffsets[item.id] || 0;

        return (
          <div key={item.id} className="relative overflow-hidden rounded-[22px]">
            <div className="absolute inset-y-0 right-0 w-24 bg-rose-600 flex items-center justify-center rounded-r-[22px]">
              <button
                onClick={(e) => { e.stopPropagation(); handleDeleteSingleAppliance(item.id); }}
                className="w-full h-full flex flex-col items-center justify-center text-white active:bg-rose-700 transition-colors"
              >
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-5 h-5 mb-0.5">
                  <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2M10 11v6M14 11v6" />
                </svg>
                <span className="text-[10px] font-bold uppercase tracking-wider">Delete</span>
              </button>
            </div>

            <div
              onTouchStart={(e) => {
                touchStartXRef.current = e.touches[0].clientX;
                activeSwipingIdRef.current = item.id;
              }}
              onTouchMove={(e) => {
                if (touchStartXRef.current === null || activeSwipingIdRef.current !== item.id) return;
                const deltaX = e.touches[0].clientX - touchStartXRef.current;
                setSwipeOffsets(prev => ({ ...prev, [item.id]: deltaX < 0 ? Math.max(-96, deltaX) : 0 }));
              }}
              onTouchEnd={() => {
                if (touchStartXRef.current === null || activeSwipingIdRef.current !== item.id) return;
                const finalOffset = swipeOffsets[item.id] || 0;
                setSwipeOffsets(prev => ({ ...prev, [item.id]: finalOffset < -48 ? -96 : 0 }));
                touchStartXRef.current = null;
                activeSwipingIdRef.current = null;
              }}
              style={{
                transform: `translateX(${currentOffset}px)`,
                transition: activeSwipingIdRef.current === item.id ? 'none' : 'transform 0.25s cubic-bezier(0.16, 1, 0.3, 1)'
              }}
              className={`relative rounded-[22px] border overflow-hidden shadow-sm ${
                isDark ? 'bg-zinc-900 border-white/10' : 'bg-white border-black/10 shadow-sm'
              } ${isSelected ? 'ring-2 ring-amber-500' : ''}`}
            >
              <div className="p-4 flex items-center gap-3.5">
                {isSelectMode && (
                  <div
                    onClick={() => toggleSelectId(item.id)}
                    className={`w-5 h-5 rounded-full border flex items-center justify-center cursor-pointer text-xs font-bold shrink-0 ${
                      isSelected ? 'bg-amber-500 border-amber-500 text-black' : (isDark ? 'border-zinc-700 bg-zinc-800' : 'border-zinc-300 bg-white')
                    }`}
                  >
                    {isSelected && '✓'}

                )}

                <div

                    if (currentOffset < -10) { setSwipeOffsets(prev => ({ ...prev, [item.id]: 0 })); return; }
                    if (isSelectMode) toggleSelectId(item.id);
                    else { setSelectedAppliance(item); setDetailTab('parts'); }
                  }}
                  className="flex-1 flex items-center gap-3.5 cursor-pointer min-w-0 active:scale-[0.99] transition-transform"
                >
                  <div className={`w-14 h-14 rounded-2xl border flex items-center justify-center shrink-0 overflow-hidden ${
                    isDark ? 'bg-black/40 border-white/10' : 'bg-[#E5E5EA] border-black/5'
                  }`}>
                    {item.receipt ? (
                      <img src={item.receipt} alt="Receipt" className="w-full h-full object-cover" />
                    ) : (
                      <div className={isDark ? 'text-zinc-300' : 'text-[#1C1C1E]'}>⚙️</div>
                    )}
                  </div>

                  <div className="flex-1 min-w-0">
                    <div className="flex justify-between items-baseline">
                      <h2 className="text-[15px] font-bold tracking-tight truncate leading-tight">
                        {item.name}
                        {item.nickname && (
                          <span className={`font-medium ml-1.5 ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                            ({item.nickname})
                          </span>
                        )}
                      </h2>
                      {!isSelectMode && <span className={isDark ? "text-zinc-500 text-xs" : "text-[#8E8E93] text-xs font-semibold"}>➔</span>}
                    </div>
                    <p className={`text-xs font-medium mt-0.5 truncate selectable-text ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                      {item.brand}{item.modelNumber ? ` • ${item.modelNumber}` : ''}
                    </p>
                    <p className={`text-[11px] mt-0.5 truncate ${isDark ? 'text-zinc-500' : 'text-[#8E8E93]'}`}>{item.category || 'Appliance'}</p>
                  </div>
                </div>
              </div>

              {!isSelectMode && (
                <div className={`px-4 pb-3.5 pt-2.5 border-t ${
                  isDark ? 'border-white/5 bg-black/20' : 'border-black/5 bg-[#F9F9FB]'
                }`}>
                  <div className="flex justify-between items-center">
                    <span className={`text-[10px] font-bold tracking-wider uppercase ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                      Maintenance Schedule
                    </span>
                    <button
                      type="button"
                      onClick={(e) => { e.stopPropagation(); openAssistant(item); }}
                      className="text-[11px] font-bold text-amber-600 dark:text-amber-500 hover:underline cursor-pointer"
                    >
                      Ask Manual 💬
                    </button>
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      };

      return (
        <div className={`min-h-screen flex flex-col transition-colors duration-200 ${
          isDark ? 'bg-black text-white' : 'bg-[#F2F2F7] text-[#1C1C1E]'
        }`}>
          {/* Header */}
          <header className={`px-5 pt-12 pb-4 sticky top-0 z-20 backdrop-blur-2xl border-b transition-colors ${
            isDark ? 'bg-black/75 border-white/10' : 'bg-white/80 border-black/10'
          }`}>
            <div className="flex justify-between items-center">
              <div>
                <p className="text-xs font-extrabold uppercase tracking-wider text-amber-600 dark:text-amber-500">
                  {isPaidUser ? 'Advanced Manager' : 'Free Plan'}
                </p>
                <p className={`text-[11px] font-medium mt-0.5 ${isDark ? 'text-zinc-400' : 'text-zinc-500'}`}>
                  {appliances.length} {appliances.length === 1 ? 'item registered' : 'items registered'}
                </p>
              </div>

              <div className="flex items-center gap-2.5">
                <button
                  onClick={() => { setGroupTextInput(''); setIsAddOpen(true); }}
                  className={`w-9 h-9 rounded-full flex items-center justify-center font-bold text-lg shadow-sm active:scale-90 transition-transform ${
                    isDark ? 'bg-white/10 text-white' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}
                >
                  +
                </button>
                <button
                  onClick={() => setIsSettingsOpen(true)}
                  className={`w-9 h-9 rounded-full flex items-center justify-center active:scale-90 transition-transform shadow-sm ${
                    isDark ? 'bg-white/10 text-white' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}
                >
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-4 h-4">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 4-5 8-5s8 1 8 5"/>
                  </svg>
                </button>
              </div>
            </div>
          </header>

          {/* Main List */}

                <div className="flex gap-2 pt-1">
                  <button onClick={() => setIsCancelModalOpen(false)} className={`flex-1 py-2.5 rounded-2xl text-xs font-bold ${
                    isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}>Keep Plan</button>
                  <button onClick={handleConfirmCancelSubscription} className="flex-1 py-2.5 rounded-2xl text-xs font-bold bg-rose-600 text-white shadow-sm">
                    Confirm Cancel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Auth Modal */}
          {isAuthModalOpen && (
            <div onClick={() => setIsAuthModalOpen(false)} className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-[60] cursor-pointer">
              <div onClick={(e) => e.stopPropagation()} className={`w-full max-w-sm rounded-t-[32px] p-6 space-y-4 border-t cursor-default ${
                isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
              }`}>
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-extrabold">Account Login / Register</h3>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsAuthModalOpen(false)} />
                </div>

                {authStep === 'email' ? (
                  <form onSubmit={handleRequestOtp} className="space-y-3">
                    <p className={`text-xs ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                      Enter your email to sign in and backup your account. We'll send a 6-digit confirmation code.
                    </p>
                    <input
                      type="email"
                      className={`w-full rounded-2xl p-3 text-xs font-semibold focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="your@email.com"
                      value={authEmailInput}
                      onChange={(e) => setAuthEmailInput(e.target.value)}
                      required
                    />
                    <button
                      type="submit"
                      disabled={authLoading || otpCooldownSeconds > 0}
                      className="w-full bg-amber-600 hover:bg-amber-500 disabled:opacity-50 text-white font-bold text-xs py-3 rounded-2xl shadow-sm active:scale-95 transition-all"
                    >
                      {authLoading ? 'Sending...' : (otpCooldownSeconds > 0 ? `Wait ${otpCooldownSeconds}s` : 'Send Login Code')}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleConfirmOtp} className="space-y-3">
                    <p className={`text-xs ${isDark ? 'text-zinc-400' : 'text-zinc-600'}`}>
                      Enter the 6-digit PIN sent to {authEmailInput}:
                    </p>
                    <input
                      type="text"
                      inputMode="numeric"
                      maxLength="6"
                      className={`w-full text-center tracking-widest text-lg font-bold rounded-2xl p-3 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="123456"
                      value={authPinInput}
                      onChange={(e) => setAuthPinInput(e.target.value.replace(/\D/g, ''))}
                      required
                    />
                    {devPasscodeNotice && <p className="text-[11px] text-amber-500 font-bold text-center">{devPasscodeNotice}</p>}
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs py-3 rounded-2xl shadow-sm active:scale-95"
                    >
                      {authLoading ? 'Verifying...' : 'Confirm & Log In'}
                    </button>
                    <button type="button" onClick={() => setAuthStep('email')} className="w-full text-center text-[11px] text-zinc-500 hover:underline">
                      Change Email
                    </button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
