    // Client-Side Rolling Quota & Lockout Manager
    const AIQuotaTracker = {
      getStatus(isPaid) {
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          const now = Date.now();
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 0, startTime: now };
            localStorage.setItem('pro_ai_window', JSON.stringify(data));
          }
          const remainingMinutes = Math.max(0, Math.ceil((PRO_WINDOW_MS - (now - data.startTime)) / 60000));
          return {
            count: data.count,
            limit: PRO_WINDOW_QUOTA,
            isLocked: data.count >= PRO_WINDOW_QUOTA,
            remainingMinutes
          };
        } else {
          const used = Number(localStorage.getItem('free_ai_used_count') || 0);
          return {
            count: used,
            limit: FREE_TOTAL_QUOTA,
            isLocked: used >= FREE_TOTAL_QUOTA,
            remainingMinutes: 0
          };
        }
      },
      increment(isPaid) {
        const now = Date.now();
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 1, startTime: now };
          } else {
            data.count += 1;
          }
          localStorage.setItem('pro_ai_window', JSON.stringify(data));
        } else {
          const current = Number(localStorage.getItem('free_ai_used_count') || 0);
          localStorage.setItem('free_ai_used_count', (current + 1).toString());
        }
      }
    };

    function queryLocalManualDatabase(appliance, rawQuery) {
      const q = (rawQuery || '').toLowerCase();
      
      if (q.includes('filter') || q.includes('reset') || q.includes('light')) {
        const matchedConsumable = appliance.consumables?.[0];
        if (matchedConsumable && matchedConsumable.installTips) {
          return `Local Manual Guidance for ${appliance.brand} ${appliance.modelNumber}:\n\n${matchedConsumable.installTips}`;
        }
        return `Manual Reset Procedure: To reset the filter alert indicator on most ${appliance.brand} models, hold the Filter Status / Reset button firmly for 3 to 5 seconds until the display light chimes or shifts to blue/green.`;
      }

      if (q.includes('burn') || q.includes('heat') || q.includes('ignit') || q.includes('element')) {
        return `Owner Manual Care Note: Ensure burner ports and glass contacts are free from grease deposits. Disconnect power for 60 seconds at your circuit breaker if touch sensors fail to register.`;
      }

      if (q.includes('frost') || q.includes('leak') || q.includes('cool') || q.includes('water')) {
        return `Standard Manual Diagnostic: Inspect the door gasket seal for tears and verify vents are not blocked by storage bins. Clear internal drain tubes if standing water collects in the lower deli drawer.`;
      }

      return `Owner Guide Summary: Verified manual documentation for ${appliance.brand} (${appliance.modelNumber}) recommends checking power connections, testing breaker switch reset, and verifying cycle locks. Review attached docs under Warranty & Documents for full schematics.`;
    }

    async function generateAuditVerificationHash(dataString) {
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(dataString);
        const hashBuffer = await crypto.subtle.digest('SHA-256', data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase().substring(0, 32);
      } catch (e) {
        let hash = 0;
        for (let i = 0; i < dataString.length; i++) {
          hash = ((hash << 5) - hash) + dataString.charCodeAt(i);
          hash |= 0;
        }
        return Math.abs(hash).toString(16).toUpperCase().padStart(16, '0');
      }
    }

      recordReliabilityEvent(eventType, modelNum, category, component = '') {
        try {
          const enabled = localStorage.getItem('app_telemetry_optin') !== 'false';
          if (!enabled) return;

          const rawEvents = localStorage.getItem('app_telemetry_queue') || '[]';
          const queue = JSON.parse(rawEvents);

          const sanitizedEvent = {
            t: Date.now(),
            e: eventType,
            m: (modelNum || '').trim().toUpperCase(),
            c: category || 'Appliance',
            p: component || null
          };

          queue.push(sanitizedEvent);
          if (queue.length > 50) queue.shift();
          localStorage.setItem('app_telemetry_queue', JSON.stringify(queue));
        } catch (err) {}
      }
    };

    function compressImageFile(file, maxWidth = 1000, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];
            resolve({ dataUrl, base64, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Primary Dispatcher through Cloudflare Worker
    async function requestDiagnosticFromWorker(prompt, history = [], imagePayload = null, isPaid = false) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      try {
        const res = await fetch(WORKER_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          signal: controller.signal,
          body: JSON.stringify({
            prompt: (prompt || '').substring(0, 500),
            history,
            imagePayload,
            isPaid
          })
        });

        clearTimeout(timeoutId);
        const data = await res.json();
        return data.text || data.response || data.diagnostic || "No response received.";
      } catch (err) {
        clearTimeout(timeoutId);
        throw new Error(err.message || "Diagnostic service offline.");
      }
    }

      };

      const handleAddApplianceToSpecificGroup = (unitName) => {
        setGroupTextInput(unitName);

      };

      const calculateDaysRemaining = (lastReplaced, interval) => {
        const diff = Math.floor((Date.now() - new Date(lastReplaced).getTime()) / (1000 * 60 * 60 * 24));
        return interval - diff;
      };

      const getPercentageRemaining = (lastReplaced, interval) => {
        const diff = Math.floor((Date.now() - new Date(lastReplaced).getTime()) / (1000 * 60 * 60 * 24));
        const remaining = interval - diff;
        const pct = Math.round((remaining / interval) * 100);
        return Math.max(0, Math.min(100, pct));
      };

      const getWarrantyRemainingDays = (purchaseDate, warrantyMonths) => {
        if (!purchaseDate || !warrantyMonths || Number(warrantyMonths) <= 0) return null;
        const pDate = new Date(purchaseDate);
        if (isNaN(pDate.getTime())) return null;
        const expDate = new Date(pDate);
        expDate.setMonth(expDate.getMonth() + Number(warrantyMonths));
        return Math.ceil((expDate.getTime() - Date.now()) / (1000 * 60 * 60 * 24));
      };

      const toggleSelectId = (id) => {
        setSelectedIds(selectedIds.includes(id) ? selectedIds.filter(item => item !== id) : [...selectedIds, id]);
      };

      const selectAll = () => {
        setSelectedIds(selectedIds.length === appliances.length ? [] : appliances.map(a => a.id));
      };

      const confirmBulkDelete = () => {
        selectedIds.forEach((id) => localStorage.removeItem(`chat_history_${id}`));
        setAppliances(appliances.filter((a) => !selectedIds.includes(a.id)));

        setIsBulkDeleteModalOpen(false);

      const handleDismissSeasonalTask = (applianceId, taskId) => {
        setAppliances(appliances.map(app => app.id === applianceId ? {
          ...app,
          seasonalTasks: (app.seasonalTasks || []).map(t => t.id === taskId ? { ...t, dismissed: true } : t)
        } : app));
      };

      const handleFileUpload = async (applianceId, docType, e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const { dataUrl } = await compressImageFile(file, 1200, 0.72);
          const filePayload = { name: file.name, dataUrl, uploadDate: new Date().toLocaleDateString() };
          setAppliances(appliances.map(app => app.id === applianceId ? { ...app, [docType]: filePayload } : app));
          if (selectedAppliance && selectedAppliance.id === applianceId) {
            setSelectedAppliance({ ...selectedAppliance, [docType]: filePayload });
          }
        } catch (err) {}
      };

      const handleCameraScanSticker = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsAnalyzing(true);
        setLookupStatus('Inspecting data tag...');

        try {
          const compressed = await compressImageFile(file, 800, 0.65);
          const prompt = `Identify appliance brand, model number, and category from this sticker. Return pure JSON: { "brand": "Brand", "modelNumber": "MODEL123", "category": "Category" }`;

          const raw = await requestDiagnosticFromWorker(prompt, [], compressed, isPaidUser);
          const cleanText = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
          const jsonMatch = cleanText.match(/\{[\s\S]*\}/);

          if (jsonMatch) {
            const parsed = JSON.parse(jsonMatch[0]);
            if (parsed.brand) setBrandInput(parsed.brand);
            if (parsed.modelNumber) setModelInput(parsed.modelNumber);
            if (!nameInput && parsed.brand) setNameInput(`${parsed.brand} ${parsed.category || 'Appliance'}`);
            setLookupStatus(`Identified: ${parsed.brand} ${parsed.modelNumber}`);
          }
        } catch (err) {
          setLookupStatus(err.message || 'Could not parse sticker.');
        } finally {
          setIsAnalyzing(false);
        }
      };

      const handleAutoDiscoverAdd = async (e) => {
        e.preventDefault();
        if (!brandInput || !modelInput) return;

        setIsAnalyzing(true);
        setLookupStatus('Querying equipment database...');

        let discoveredConsumables = [];
        let discoveredParts = [];
        let detectedCategory = 'Appliance';
        let componentsReplaceable = true;

        try {
          const prompt = `Lookup appliance: Brand "${brandInput}", Model "${modelInput}". Return pure JSON only:
{
  "category": "Refrigerator",
  "areComponentsOfficiallyReplaceable": true,
  "consumables": [{ "name": "Filter", "partNumber": "RPWFE", "intervalDays": 180, "installTips": "Flush 2 gallons" }],
  "replacementParts": [{ "category": "Doors", "name": "Gasket", "partNumber": "WR14X31558" }]
}`;
          const raw = await requestDiagnosticFromWorker(prompt, [], null, isPaidUser);
          const cleanText = raw.replace(/```json/gi, '').replace(/```/g, '').trim();
          const jsonMatch = cleanText.match(/\{[\s\S]*\}/);
          const parsed = JSON.parse(jsonMatch ? jsonMatch[0] : cleanText);

          if (parsed.category) detectedCategory = parsed.category;
          if (typeof parsed.areComponentsOfficiallyReplaceable === 'boolean') {
            componentsReplaceable = parsed.areComponentsOfficiallyReplaceable;
          }
          if (Array.isArray(parsed.consumables)) {
            discoveredConsumables = parsed.consumables.map((item, idx) => ({
              id: `c_${Date.now()}_${idx}`,
              name: item.name || 'Consumable Filter',
              partNumber: item.partNumber || 'OEM Standard',
              intervalDays: Number(item.intervalDays) || 180,
              lastReplaced: new Date().toISOString(),
              installTips: item.installTips || 'Replace per instructions.'
            }));
          }
          if (componentsReplaceable && Array.isArray(parsed.replacementParts)) {
            discoveredParts = parsed.replacementParts.map((item, idx) => ({
              id: `p_${Date.now()}_${idx}`,
              category: item.category || 'Components',
              name: item.name,
              partNumber: item.partNumber || 'OEM Part'
            }));
          }
        } catch (err) {}

        const bLower = brandInput.toLowerCase();
        const mLower = modelInput.toLowerCase();
        if (detectedCategory === 'Appliance') {
          if (bLower.includes('blueair') || bLower.includes('coway') || mLower.includes('air')) {
            detectedCategory = 'Air Purifier';
            componentsReplaceable = false;
          } else if (mLower.includes('gwe') || mLower.includes('fridge')) {
            detectedCategory = 'Refrigerator';
            componentsReplaceable = true;
          }
        }

        const resolvedImg = resolveProductImage(brandInput, modelInput, detectedCategory);

        let finalUnitId = 'unit_main';
        if (isPaidUser && groupTextInput.trim()) {
          const match = units.find(u => u.name.toLowerCase() === groupTextInput.trim().toLowerCase());
          if (match) {
            finalUnitId = match.id;
          } else {
            const newU = {
              id: `unit_${Date.now()}`,
              name: groupTextInput.trim(),
              notificationsEnabled: true,
              collapsed: false
            };
            setUnits(prev => [...prev, newU]);
            finalUnitId = newU.id;
          }
        }

        const defaultSeasonal = [];
        if (detectedCategory.includes('Fridge') || detectedCategory.includes('Refrigerator')) {
          defaultSeasonal.push({ id: `st_${Date.now()}`, label: 'Vacuum condenser coils to maintain cooling efficiency', intervalMonths: 6, lastCompleted: new Date().toISOString(), dismissed: false });
        } else if (detectedCategory.includes('Dishwasher')) {
          defaultSeasonal.push({ id: `st_${Date.now()}`, label: 'Clean bottom filter basket under warm water', intervalMonths: 3, lastCompleted: new Date().toISOString(), dismissed: false });
        }

        const newItem = {
          id: Date.now().toString(),
          unitId: finalUnitId,
          name: nameInput.trim() || `${brandInput} ${modelInput}`,
          brand: brandInput.trim(),
          modelNumber: modelInput.trim(),
          category: detectedCategory,
          imageUrl: resolvedImg,
          purchaseDate: purchaseDateInput || '',

          warrantyDoc: null,
          receiptDoc: null,
          componentsReplaceable,
          seasonalTasks: defaultSeasonal,
          consumables: discoveredConsumables,
          replacementParts: discoveredParts

        TelemetryEngine.recordReliabilityEvent('asset_registered', modelInput, detectedCategory);

        setAppliances([newItem, ...appliances]);
        setNameInput('');
        setBrandInput('');
        setModelInput('');
        setGroupTextInput('');
        setPurchaseDateInput('');
        setIsAnalyzing(false);
        setIsAddOpen(false);

      const handleCommitReplacementDate = (applianceId, consumableId, chosenDateStr) => {
        const replacementIso = chosenDateStr ? new Date(chosenDateStr + 'T12:00:00').toISOString() : new Date().toISOString();
        const app = appliances.find(a => a.id === applianceId);
        const cons = app?.consumables?.find(c => c.id === consumableId);

        if (app && cons) {
          TelemetryEngine.recordReliabilityEvent('filter_replaced', app.modelNumber, app.category, cons.partNumber);

        setAppliances(appliances.map(a => a.id === applianceId ? {

      const openAssistant = (item) => {

      const sendQuery = async (text) => {
        const q = text || queryInput;
        if (!q.trim() || !activeAppliance || isLoading) return;

        if (q.toLowerCase().includes('go deeper') && !isPaidUser) {
          setIsPaywallOpen(true);
          return;
        }

        const userMsg = { id: Date.now().toString(), sender: 'user', text: q };
        const updated = [...messages, userMsg];
        setMessages(updated);
        setQueryInput('');

        const quota = AIQuotaTracker.getStatus(isPaidUser);

        if (!isPaidUser && quota.isLocked) {
          const localManualAnswer = queryLocalManualDatabase(activeAppliance, q);
          const limitCardMsg = {
            id: Date.now().toString(),
            sender: 'assistant',
            text: localManualAnswer,
            showUpgradeGate: true
          };
          setMessages([...updated, limitCardMsg]);
          return;
        }

        if (isPaidUser && quota.isLocked) {
          setMessages([...updated, {
            id: Date.now().toString(),
            sender: 'assistant',
            text: `Pro Diagnostic Limit Reached (65/65 queries used).\n\nYour 2-hour window refreshes in ${quota.remainingMinutes} minutes.`
          }]);
          return;
        }

        setIsLoading(true);
        try {
          AIQuotaTracker.increment(isPaidUser);

          // Always inject appliance metadata so Gemini knows the exact target unit
          const prompt = `[Context: ${activeAppliance.brand} ${activeAppliance.modelNumber} (${activeAppliance.category})] User question: ${q}`;

          const reply = await requestDiagnosticFromWorker(prompt, messages, null, isPaidUser);

          const hasTechNotice = reply.includes('[TECH_RECOMMENDED]');
          const hasReplaceNotice = reply.includes('[REPLACEMENT_RECOMMENDED]');
          const cleanReply = reply
            .replace('[TECH_RECOMMENDED]', '')
            .replace('[REPLACEMENT_RECOMMENDED]', '')
            .trim();

          const currentQuotaAfter = AIQuotaTracker.getStatus(isPaidUser);
          const reachedLimitNow = !isPaidUser && currentQuotaAfter.isLocked;

          const assistantMsg = {
            id: Date.now().toString(),
            sender: 'assistant',
            text: cleanReply,
            suggestTech: hasTechNotice,
            suggestReplacement: hasReplaceNotice,
            showUpgradeGate: reachedLimitNow
          };

          const finalMessages = [...updated, assistantMsg];
          setMessages(finalMessages);
          localStorage.setItem(`chat_history_${activeAppliance.id}`, JSON.stringify({ messages: finalMessages }));

          if (isPaidUser && q.toLowerCase().includes('go deeper')) {
            TelemetryEngine.recordReliabilityEvent('hardware_triage', activeAppliance.modelNumber, activeAppliance.category);
          }
        } catch (err) {
          setMessages([...updated, { id: Date.now().toString(), sender: 'assistant', text: `Diagnostic Note: ${err.message}` }]);

          setIsLoading(false);

      const openAmazon = (brand, partNumber) => {

        window.open(url, '_blank', 'noopener,noreferrer');

      const handleBuyPassport = () => {

        localStorage.setItem('passport_purchased', 'true');

      const handleDownloadPassport = async () => {
        setIsGeneratingPdf(true);

          const now = Date.now();
          setPassportFirstUsedTimestamp(now);
          localStorage.setItem('passport_first_used', now.toString());
        }

        const auditPayload = JSON.stringify({
          account: userEmail,
          exportTime: new Date().toISOString(),
          includedUnits: passportSelectedUnits,
          assets: appliances.filter(a => passportSelectedUnits.includes(a.unitId))
        });
        const generatedHash = await generateAuditVerificationHash(auditPayload);
        setAuditCertHash(generatedHash);

        setTimeout(() => {
          const element = document.getElementById('passport-document-export');
          const opt = {
            margin: [8, 8, 8, 8],
            filename: `Appliance_Passport_${new Date().toISOString().split('T')[0]}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
          };

          window.html2pdf().set(opt).from(element).save().then(() => {
            setIsGeneratingPdf(false);
          }).catch(() => {
            setIsGeneratingPdf(false);
          });
        }, 150);
      };

      const togglePassportUnitSelection = (unitId) => {

      const autocompleteGroupSuggestions = units.filter(u =>
        groupTextInput.trim() &&

      );

      const renderApplianceCard = (item) => {

              >
                <div className={`w-14 h-14 rounded-2xl border flex items-center justify-center shrink-0 overflow-hidden ${

                }`}>
                  {item.imageUrl ? (

                  ) : (

                <div className="flex justify-between items-center pb-2 border-b border-black/10 dark:border-white/10">
                  <div>
                    <h3 className="text-base font-extrabold">Account & Settings</h3>
                    <p className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>{userEmail}</p>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsSettingsOpen(false)} />
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div>
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Subscription</span>
                    <p className="text-sm font-extrabold">{isPaidUser ? 'Pro Manager' : 'Free Standard'}</p>
                  </div>
                  {isPaidUser ? (
                    <button onClick={() => setIsCancelModalOpen(true)} className="text-xs text-rose-600 dark:text-rose-400 font-bold underline">
                      Cancel Plan
                    </button>
                  ) : (
                    <button onClick={toggleTier} className="text-xs font-bold px-3.5 py-1.5 rounded-full bg-amber-600 hover:bg-amber-500 text-white shadow-sm">
                      Activate Pro
                    </button>
                  )}
                </div>

                {/* Quota & AI Status Display */}
                <div className={`p-4 rounded-2xl border space-y-1 ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div className="flex justify-between items-center">
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>AI Engine Usage</span>
                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                      isPaidUser ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-500'
                    }`}>
                      {isPaidUser ? 'Pro Rolling 2h' : 'Free Tier'}
                    </span>
                  </div>
                  <p className="text-xs font-bold">
                    {isPaidUser 
                      ? `${AIQuotaTracker.getStatus(true).count} / 65 requests used this 2-hour window`
                      : `${AIQuotaTracker.getStatus(false).count} / 5 free queries used`}
                  </p>
                  <p className={`text-[10px] ${isDark ? 'text-zinc-400' : 'text-[#8E8E93]'}`}>
                    {isPaidUser 
                      ? `Resets automatically every 2 hours. Next refresh in ~${AIQuotaTracker.getStatus(true).remainingMinutes}m.`
                      : 'After 5 queries, app switches to zero-cost offline manual data.'}
                  </p>
                </div>

                {/* Home Appliance Passport Section In Settings */}
                <div className={`p-4 rounded-2xl border space-y-2.5 ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div className="flex justify-between items-center">
                    <div>
                      <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Official Audit Document</span>
                      <p className="text-xs font-extrabold">Home Appliance Passport (PDF)</p>
                    </div>
                    <span className="text-[11px] font-bold text-amber-600 dark:text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full">
                      $2.99
                    </span>
                  </div>
                  <p className={`text-[10px] leading-tight ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                    One-time export generates a certified PDF audit trail with verification hash for home inspections, move-outs, or sales. Unlimited exports for 3 days after initial use.
                  </p>
                  <button
                    onClick={() => { setIsSettingsOpen(false); setIsPassportModalOpen(true); }}
                    className="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs py-2 rounded-xl shadow-sm transition-all active:scale-95"
                  >
                    Configure & Export Passport ↗
                  </button>
                </div>

                {/* Cloud Sync */}
                <div className={`p-4 rounded-2xl border space-y-1.5 ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div className="flex justify-between items-center">
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Cloud Sync Engine</span>
                    <span className="text-[10px] font-bold text-emerald-600 dark:text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full">Worker Active</span>
                  </div>
                  <p className="text-xs font-bold">Cloudflare Edge Proxy Connected</p>
                  <p className={`text-[10px] leading-tight ${isDark ? 'text-zinc-400' : 'text-[#8E8E93]'}`}>
                    Directly routed via https://appliance.naicumlegat.workers.dev/ with active Workers KV caching and zero client exposure.
                  </p>
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div>
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Appearance</span>
                    <p className="text-sm font-extrabold">Theme Mode</p>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => toggleTheme('dark')} className={`px-3.5 py-1.5 rounded-full text-xs font-bold ${
                      isDark ? 'bg-black text-white shadow-sm' : 'bg-[#E5E5EA] text-[#636366]'
                    }`}>Dark</button>
                    <button onClick={() => toggleTheme('light')} className={`px-3.5 py-1.5 rounded-full text-xs font-bold ${
                      !isDark ? 'bg-[#1C1C1E] text-white shadow-sm' : 'bg-zinc-800 text-zinc-400'
                    }`}>Light</button>
                  </div>
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div className="pr-3">
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Privacy & Data</span>
                    <p className="text-xs font-bold">Anonymous Reliability Sharing</p>
                    <p className={`text-[10px] leading-tight mt-0.5 font-medium ${isDark ? 'text-zinc-500' : 'text-[#8E8E93]'}`}>Contributes anonymous failure rates and lifespans. Zero personal identity collected.</p>
                  </div>
                  <button
                    onClick={toggleTelemetry}
                    className={`px-3 py-1 rounded-full text-xs font-bold ${
                      telemetryOptIn
                        ? (isDark ? 'bg-emerald-500 text-black' : 'bg-emerald-100 text-emerald-800 border border-emerald-300')
                        : (isDark ? 'bg-zinc-700 text-zinc-400' : 'bg-[#E5E5EA] text-[#636366]')
                    }`}
                  >
                    {telemetryOptIn ? 'Enabled' : 'Disabled'}
                  </button>
                </div>

                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3.5 rounded-2xl shadow-sm">
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* Pro Overview Paywall Modal */}
          {isPaywallOpen && (
            <div
              onClick={() => setIsPaywallOpen(false)}
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-[32px] p-6 space-y-4 shadow-2xl border cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-500">Pro Diagnostics</span>
                    <h3 className="text-lg font-extrabold tracking-tight mt-0.5">Component & Electrical Triage</h3>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsPaywallOpen(false)} />
                </div>
                <div className={`space-y-2 text-xs p-3.5 rounded-2xl font-medium ${
                  isDark ? 'bg-zinc-800/80 text-zinc-300' : 'bg-[#E5E5EA]/60 text-[#1C1C1E]'
                }`}>
                  <p>✓ <strong>Hardware Circuit Isolation:</strong> Diagnose faulty microswitches, limiters, and control boards.</p>
                  <p>✓ <strong>Multimeter Ohm Testing:</strong> Exact terminal resistance values and continuity steps.</p>
                  <p>✓ <strong>High-Volume Diagnostics:</strong> 65 advanced reasoning requests every 2 hours.</p>
                  <p>✓ <strong>Multi-Unit Properties:</strong> Organize appliances into custom units with independent alert muting.</p>
                </div>
                <div className="flex flex-col gap-2 pt-1">
                  <button onClick={() => { setIsPaidUser(true); localStorage.setItem('app_is_paid_user', 'true'); setIsPaywallOpen(false); }} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3 rounded-2xl shadow-sm">
                    Activate Pro Diagnostics ($3.99/mo)
                  </button>
                  <button onClick={() => setIsPaywallOpen(false)} className={`text-xs font-bold py-1 text-center ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                    Continue with Basic Manual
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Cancellation Sheet */}
          {isCancelModalOpen && (
            <div
              onClick={() => setIsCancelModalOpen(false)}
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-[60] cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-[32px] p-6 space-y-3 shadow-2xl border cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <h3 className="text-sm font-extrabold">Cancel Pro Subscription?</h3>
                <p className={`text-xs font-medium leading-relaxed ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                  We're sad to see you go! Thank you for your support. Your Pro access stays active until the end of this billing cycle.
                </p>
                <textarea
                  rows="2"
                  className={`w-full rounded-2xl p-2.5 text-xs font-medium focus:outline-none border ${
                    isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/60 border-black/10 text-black'
                  }`}
                  placeholder="What could we improve? (Optional)"
                  value={cancelFeedback}
                  onChange={(e) => setCancelFeedback(e.target.value)}
                />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setIsCancelModalOpen(false)} className={`flex-1 py-2.5 rounded-2xl text-xs font-bold ${
                    isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}>
                    Keep Plan
                  </button>
                  <button onClick={() => { setIsPaidUser(false); localStorage.setItem('app_is_paid_user', 'false'); setIsCancelModalOpen(false); setIsSettingsOpen(false); }} className="flex-1 py-2.5 rounded-2xl text-xs font-bold bg-rose-600 text-white shadow-sm">
                    Confirm Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
