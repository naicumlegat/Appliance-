    const TelemetryEngine = {
      recordReliabilityEvent(eventType, modelNum, category, component = '') {
        try {
          const enabled = localStorage.getItem('app_telemetry_optin') !== 'false';
          if (!enabled) return;

          const rawEvents = localStorage.getItem('app_telemetry_queue') || '[]';
          const queue = JSON.parse(rawEvents);

          const sanitizedEvent = {
            t: Date.now(),
            e: eventType,
            m: (modelNum || '').trim().toUpperCase(),
            c: category || 'Appliance',
            p: component || null
          };

          queue.push(sanitizedEvent);
          if (queue.length > 50) queue.shift();
          localStorage.setItem('app_telemetry_queue', JSON.stringify(queue));
        } catch (err) {
          // Silent local failure to prevent user disruption
        }
      }
    };

    function compressImageFile(file, maxWidth = 1200, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];
            resolve({ dataUrl, base64, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function getCategoryGlyph(type = '') {
      const t = (type || '').toLowerCase();
      if (t.includes('purifier') || t.includes('air') || t.includes('blueair') || t.includes('hepa')) return GLYPHS.purifier;
      if (t.includes('fridge') || t.includes('refrigerat')) return GLYPHS.refrigerator;
      if (t.includes('cooktop') || t.includes('stove') || t.includes('range') || t.includes('oven')) return GLYPHS.cooktop;
      if (t.includes('dish')) return GLYPHS.dishwasher;
      return GLYPHS.default;
    }

    async function callGeminiWithFallback(apiKey, prompt, temp = 0.2, timeoutMs = 12000, imagePayload = null) {
      if (!apiKey || !apiKey.trim()) {
        throw new Error('No API Key configured. Please add your key in Account Settings.');
      }

      let lastError = null;
      for (const model of MODEL_CASCADE) {
        for (let attempt = 0; attempt < 2; attempt++) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

          try {
            if (attempt > 0) await new Promise((r) => setTimeout(r, 1200));

            const parts = [{ text: prompt }];
            if (imagePayload) {
              parts.push({
                inlineData: { mimeType: imagePayload.mimeType, data: imagePayload.base64 }
              });
            }

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify({
                  contents: [{ parts }],
                  generationConfig: { temperature: temp }
                }),
              }
            );

            clearTimeout(timeoutId);
            const data = await res.json();

            if (data.error) {
              const code = data.error.code;
              if (code === 503 || code === 429) {
                lastError = `Rate limit (${code}). Retrying...`;
                continue;
              }
              throw new Error(`API (${code}): ${data.error.message}`);
            }

            if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
              return data.candidates[0].content.parts[0].text;
            }
          } catch (err) {
            clearTimeout(timeoutId);
            lastError = err.message;
          }
        }
      }
      throw new Error(lastError || 'Service busy.');
    }

Return strictly valid JSON only:
{

  "areComponentsOfficiallyReplaceable": true,
  "consumables": [

User query: "${q}"
Context: ${isPaidUser ? 'Pro Master Technician. Provide terminal checks, multimeter resistance ranges, and hardware fault isolation if relevant.' : 'Friendly manual guide. Provide 2-3 safe checks strictly from the owner guide under 80 words.'}
Answer cleanly:`;
            const reply = await callGeminiWithFallback(activeKey, prompt, 0.2);

          else if (b.includes('blueair')) url = `https://www.blueair.com/en-us/search?q=${encodeURIComponent(partNumber)}`;

                <div className="flex justify-between items-center">
                  <h3 className="text-lg font-extrabold tracking-tight">Add Appliance</h3>
                  <button onClick={() => setIsAddOpen(false)} className="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-xs">✕</button>
                </div>

                <button
                  type="button"
                  onClick={() => cameraInputRef.current && cameraInputRef.current.click()}
                  className="w-full bg-amber-500/15 border border-amber-500/30 text-amber-400 font-bold text-xs py-3 rounded-2xl active:scale-98 transition-all"
                >
                  Scan QR / Sticker Tag
                </button>
                <input ref={cameraInputRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={handleCameraScanSticker} />

                <form onSubmit={handleAutoDiscoverAdd} className="space-y-3">
                  {isPaidUser && (
                    <div>
                      <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Assign to Unit</label>
                      <select
                        className={`w-full rounded-2xl p-3 text-xs mt-1 ${isDark ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-black'}`}
                        value={assignedUnitId}
                        onChange={(e) => setAssignedUnitId(e.target.value)}
                      >
                        {units.map(u => <option key={u.id} value={u.id}>{u.name} ({u.type})</option>)}
                      </select>
                    </div>
                  )}

                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Nickname</label>
                    <input
                      className={`w-full rounded-2xl p-3 text-xs mt-1 ${isDark ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-black'}`}
                      placeholder="e.g. Master Bedroom Purifier"
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Brand *</label>
                      <input
                        className={`w-full rounded-2xl p-3 text-xs mt-1 ${isDark ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-black'}`}
                        placeholder="e.g. GE, Coway"
                        value={brandInput}
                        onChange={(e) => setBrandInput(e.target.value)}
                        required
                      />
                    </div>
                    <div>
                      <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Model # *</label>
                      <input
                        className={`w-full rounded-2xl p-3 text-xs mt-1 ${isDark ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-black'}`}
                        placeholder="e.g. GWE191"
                        value={modelInput}
                        onChange={(e) => setModelInput(e.target.value)}
                        required
                      />
                    </div>
                  </div>

                  <div>
                    <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Purchase Date</label>
                    <input
                      type="date"
                      className={`w-full rounded-2xl p-3 text-xs mt-1 ${isDark ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-black'}`}
                      value={purchaseDateInput}
                      onChange={(e) => setPurchaseDateInput(e.target.value)}
                    />
                  </div>

                  {isAnalyzing && <p className="text-xs text-amber-500 font-medium text-center animate-pulse">{lookupStatus}</p>}

                  <button
                    type="submit"
                    disabled={isAnalyzing}
                    className="w-full bg-amber-500 hover:bg-amber-400 text-black font-extrabold text-xs py-3.5 rounded-2xl shadow-md active:scale-98 transition-all"
                  >
                    {isAnalyzing ? 'Inspecting...' : 'Add Appliance'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Settings Modal (Theme, Subscriptions, Anonymous Telemetry) */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-50">
              <div className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-[32px] p-6 space-y-4 shadow-2xl ${
                isDark ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-900'
              }`}>
                <div className="flex justify-between items-center pb-2 border-b border-white/10">
                  <div>
                    <h3 className="text-base font-extrabold">Account & Settings</h3>
                    <p className="text-xs text-zinc-400">{userEmail}</p>
                  </div>
                  <button onClick={() => setIsSettingsOpen(false)} className="w-7 h-7 rounded-full bg-zinc-800 flex items-center justify-center text-xs">✕</button>
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center ${isDark ? 'bg-zinc-800/80' : 'bg-zinc-100'}`}>
                  <div>
                    <span className="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Subscription</span>
                    <p className="text-sm font-bold">{isPaidUser ? 'Pro Manager' : 'Free Standard'}</p>
                  </div>
                  {isPaidUser ? (
                    <button onClick={() => setIsCancelModalOpen(true)} className="text-xs text-rose-400 font-semibold underline">
                      Cancel Plan
                    </button>
                  ) : (
                    <button onClick={toggleTier} className="text-xs font-bold px-3 py-1 rounded-full bg-amber-500 text-black">
                      Activate Pro
                    </button>
                  )}
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center ${isDark ? 'bg-zinc-800/80' : 'bg-zinc-100'}`}>
                  <div>
                    <span className="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Appearance</span>
                    <p className="text-sm font-bold">Theme Mode</p>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => toggleTheme('dark')} className={`px-3 py-1 rounded-full text-xs font-bold ${isDark ? 'bg-black text-white' : 'text-zinc-500'}`}>Dark</button>
                    <button onClick={() => toggleTheme('light')} className={`px-3 py-1 rounded-full text-xs font-bold ${!isDark ? 'bg-white text-black shadow-sm' : 'text-zinc-500'}`}>Light</button>
                  </div>
                </div>

                {/* Privacy-First Anonymous Reliability Telemetry Toggle */}
                <div className={`p-4 rounded-2xl flex justify-between items-center ${isDark ? 'bg-zinc-800/80' : 'bg-zinc-100'}`}>
                  <div className="pr-3">
                    <span className="text-[10px] uppercase font-bold tracking-wider text-zinc-400">Privacy & Data</span>
                    <p className="text-xs font-bold">Anonymous Reliability Sharing</p>
                    <p className="text-[10px] text-zinc-500 leading-tight mt-0.5">Contributes anonymous model failure rates and lifespans. Zero personal identity or emails collected.</p>
                  </div>
                  <button
                    onClick={toggleTelemetry}
                    className={`px-3 py-1 rounded-full text-xs font-bold ${
                      telemetryOptIn ? 'bg-emerald-500 text-black' : 'bg-zinc-700 text-zinc-400'
                    }`}
                  >
                    {telemetryOptIn ? 'Enabled' : 'Disabled'}
                  </button>
                </div>

                <div className="space-y-1">
                  <label className="text-[10px] font-bold uppercase tracking-wider text-zinc-400">Gemini API Key</label>
                  <input
                    type="password"
                    className={`w-full rounded-2xl p-3 text-xs focus:outline-none ${isDark ? 'bg-zinc-800 text-white' : 'bg-zinc-100 text-black'}`}
                    placeholder="AIzaSy..."
                    value={apiKey}
                    onChange={(e) => { setApiKey(e.target.value); localStorage.setItem('gemini_api_key', e.target.value.trim()); }}
                  />
                </div>

                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-amber-500 text-black font-extrabold text-xs py-3 rounded-2xl shadow-sm">
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* Non-Intrusive Pro Overview (Triggered when tapping 'Go Deeper' on Free) */}
          {isPaywallOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50">
              <div className={`w-full max-w-sm rounded-[32px] p-6 space-y-4 shadow-2xl ${
                isDark ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-900'
              }`}>
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-amber-500">Pro Master Diagnostics</span>
                    <h3 className="text-lg font-extrabold tracking-tight mt-0.5">Component & Electrical Triage</h3>
                  </div>
                  <button onClick={() => setIsPaywallOpen(false)} className="text-xs text-zinc-400">✕</button>
                </div>
                <div className={`space-y-2 text-xs p-3.5 rounded-2xl ${isDark ? 'bg-zinc-800/80 text-zinc-300' : 'bg-zinc-100 text-zinc-700'}`}>
                  <p>✓ <strong>Hardware Circuit Isolation:</strong> Diagnose faulty microswitches, limiters, and control boards.</p>
                  <p>✓ <strong>Multimeter Ohm Testing:</strong> Exact terminal resistance values and continuity steps.</p>
                  <p>✓ <strong>Multi-Unit Properties:</strong> Organize appliances into units (APT 25, Airbnb) with per-unit alert muting.</p>
                </div>
                <div className="flex flex-col gap-2 pt-1">
                  <button onClick={() => { setIsPaidUser(true); localStorage.setItem('app_is_paid_user', 'true'); setIsPaywallOpen(false); }} className="w-full bg-amber-500 text-black font-extrabold text-xs py-3 rounded-2xl active:scale-98">
                    Activate Pro Diagnostics
                  </button>
                  <button onClick={() => setIsPaywallOpen(false)} className="text-xs text-zinc-400 py-1 text-center">
                    Continue with Basic Manual
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Cancellation Sheet */}
          {isCancelModalOpen && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-[60]">
              <div className={`w-full max-w-sm rounded-[32px] p-6 space-y-3 shadow-2xl ${
                isDark ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-900'
              }`}>
                <h3 className="text-sm font-extrabold">Cancel Pro Subscription?</h3>
                <p className="text-xs text-zinc-400 leading-relaxed">
                  We're sad to see you go! Thank you for your support. Your Pro access stays active until the end of this billing cycle.
                </p>
                <textarea
                  rows="2"
                  className={`w-full rounded-2xl p-2.5 text-xs focus:outline-none ${isDark ? 'bg-zinc-800' : 'bg-zinc-100'}`}
                  placeholder="What could we improve? (Optional)"
                  value={cancelFeedback}
                  onChange={(e) => setCancelFeedback(e.target.value)}
                />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setIsCancelModalOpen(false)} className={`flex-1 py-2 rounded-2xl text-xs font-semibold ${isDark ? 'bg-zinc-800' : 'bg-zinc-200'}`}>
                    Keep Plan
                  </button>
                  <button onClick={() => { setIsPaidUser(false); localStorage.setItem('app_is_paid_user', 'false'); setIsCancelModalOpen(false); setIsSettingsOpen(false); }} className="flex-1 py-2 rounded-2xl text-xs font-bold bg-rose-600 text-white">
                    Confirm Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
