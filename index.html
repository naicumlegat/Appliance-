    function ApplianceVisual({ type = '', customUrl = '', className = "w-14 h-14" }) {
      const [imgError, setImgError] = useState(!customUrl);

      const resolvedKey = (() => {
        const t = (type || '').toLowerCase();
        if (t.includes('purifier') || t.includes('air') || t.includes('blueair') || t.includes('hepa')) return 'purifier';
        if (t.includes('fridge') || t.includes('refrigerat')) return 'refrigerator';
        if (t.includes('cooktop') || t.includes('stove') || t.includes('range') || t.includes('oven')) return 'cooktop';
        if (t.includes('dish')) return 'dishwasher';
        if (t.includes('wash') || t.includes('dryer') || t.includes('laundry')) return 'laundry';
        return 'default';
      })();

      if (customUrl && !imgError) {
        return (
          <img
            src={customUrl}
            alt={type}
            onError={() => setImgError(true)}
            className={`${className} rounded-lg object-contain bg-slate-900 border border-slate-800 p-1`}
          />
        );
      }

      return (
        <div className={`${className} rounded-lg bg-slate-900 border border-slate-800 flex items-center justify-center shrink-0 shadow-inner`}>
          {CATEGORY_ICONS[resolvedKey] || CATEGORY_ICONS.default}
        </div>
      );
    }

    const openWarrantyRegistration = (brand, model) => {
      const b = (brand || '').toLowerCase();
      let url = '';

      if (b.includes('blueair')) url = 'https://www.blueair.com/us/warranty.html';
      else if (b.includes('ge')) url = 'https://www.geappliances.com/ge/service-and-support/register-your-appliance.htm';
      else if (b.includes('coway')) url = 'https://cowaymega.com/pages/warranty';
      else if (b.includes('whirlpool')) url = 'https://www.whirlpool.com/owners.html';
      else if (b.includes('samsung')) url = 'https://www.samsung.com/us/support/register/';
      else if (b.includes('lg')) url = 'https://www.lg.com/us/support/product-registration';
      else if (b.includes('bosch')) url = 'https://www.bosch-home.com/us/owner-support/product-registration';
      else url = `https://www.google.com/search?q=${encodeURIComponent(brand + ' ' + model + ' register product warranty')}`;

      window.open(url, '_blank', 'noopener,noreferrer');
    };

    async function callGeminiWithFallback(apiKey, prompt, temp = 0.2, timeoutMs = 9000, enableSearch = false) {
      let lastError = null;

      for (const model of MODEL_CASCADE) {
        for (let attempt = 0; attempt < 2; attempt++) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

          try {
            if (attempt > 0) {
              await new Promise((r) => setTimeout(r, 1200));
            }

            const bodyPayload = {
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: temp },
            };

            if (enableSearch) {
              bodyPayload.tools = [{ googleSearch: {} }];
            }

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify(bodyPayload),
              }
            );

            clearTimeout(timeoutId);
            const data = await res.json();

            if (data.error) {
              const code = data.error.code;
              if (code === 503 || code === 429) {
                lastError = `Demand spike (${code}). Retrying...`;
                continue;
              }
              throw new Error(`API Error (${code}): ${data.error.message}`);
            }

            if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
              return {
                text: data.candidates[0].content.parts[0].text,
                grounding: data.candidates[0]?.groundingMetadata || null
              };
            } else if (data.candidates?.[0]?.finishReason) {
              throw new Error(`Response stopped: ${data.candidates[0].finishReason}`);
            }
          } catch (err) {
            clearTimeout(timeoutId);
            if (err.name === 'AbortError') {
              lastError = 'Request timed out after 9s.';
            } else {
              lastError = err.message;
            }
          }
        }
      }

      throw new Error(lastError || 'Service busy.');
    }

      const calculateDaysRemaining = (lastReplaced, interval) => {
        const diff = Math.floor((Date.now() - new Date(lastReplaced).getTime()) / (1000 * 60 * 60 * 24));
        return interval - diff;
      };

      const getPercentageRemaining = (lastReplaced, interval) => {
        const diff = Math.floor((Date.now() - new Date(lastReplaced).getTime()) / (1000 * 60 * 60 * 24));
        const remaining = interval - diff;
        const pct = Math.round((remaining / interval) * 100);
        return Math.max(0, Math.min(100, pct));
      };

      const loadApplianceChat = (applianceId) => {
        try {
          const raw = localStorage.getItem(`chat_history_${applianceId}`);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (Date.now() > parsed.expiresAt) {
            localStorage.removeItem(`chat_history_${applianceId}`);
            return null;
          }
          return parsed.messages;
        } catch {
          return null;
        }
      };

      const saveApplianceChat = (applianceId, newMessages) => {
        try {
          const payload = {
            expiresAt: Date.now() + CHAT_RETENTION_MS,
            messages: newMessages
          };
          localStorage.setItem(`chat_history_${applianceId}`, JSON.stringify(payload));
        } catch (err) {
          console.error('Failed to save chat history', err);
        }

        if (!deleteTarget) return;

        setAppliances(appliances.filter((a) => a.id !== targetId));

        const reader = new FileReader();
        reader.onloadend = () => {
          const filePayload = {
            name: file.name,
            dataUrl: reader.result,
            uploadDate: new Date().toLocaleDateString()
          };

          const updated = appliances.map((app) => {
            if (app.id === applianceId) {
              return { ...app, [docType]: filePayload };
            }
            return app;
          });

          setAppliances(updated);
          if (selectedAppliance && selectedAppliance.id === applianceId) {
            setSelectedAppliance({ ...selectedAppliance, [docType]: filePayload });
          }
        };
        reader.readAsDataURL(file);
      };

        setActiveSourcingModal({
          brand: brandName,
          partName,
          partNumber,
          sellers: [],
          isSearching: true,
          error: ''

            const prompt = `You are a real-time hardware procurement specialist.
Find 2 to 3 verified websites currently stocking replacement part:
Brand: "${brandName}"
Part Name: "${partName}"
OEM / Part #: "${partNumber}"

Check authorized distributors such as AppliancePartsPros.com, RepairClinic.com, Encompass.com, Amazon.com, or the manufacturer's genuine direct store.

Respond strictly with valid JSON only. No explanations.
Format:
{
  "sellers": [
    {
      "merchant": "AppliancePartsPros",
      "directUrl": "https://www.appliancepartspros.com/...",
      "status": "In Stock",
      "price": "$54.95"
    },
    {
      "merchant": "Amazon",
      "directUrl": "https://www.amazon.com/dp/...",
      "status": "Available",
      "price": "$52.00"
    }
  ]
}`;

            const res = await callGeminiWithFallback(activeKey, prompt, 0.1, 9000, true);
            const jsonMatch = res.text.match(/\{[\s\S]*\}/);
            if (jsonMatch) {
              const parsed = JSON.parse(jsonMatch[0]);
              if (Array.isArray(parsed.sellers) && parsed.sellers.length > 0) {
                setActiveSourcingModal({

                  partName,
                  partNumber,
                  sellers: parsed.sellers.filter(s => s.directUrl && s.directUrl.startsWith('http')),
                  isSearching: false,
                  error: ''
                });
                return;
              }
            }
          } catch (err) {
            console.warn('Live stock verification note:', err);
          }
        }

        // Direct Merchant Fallbacks (Zero Generic Search Engines)
        const encodedQuery = encodeURIComponent(`${brandName} ${partNumber}`);
        const defaultVerifiedStores = [
          {
            merchant: 'AppliancePartsPros',
            directUrl: `https://www.appliancepartspros.com/search.aspx?model=${encodeURIComponent(partNumber)}`,
            status: 'Verified OEM Distributor',
            price: 'Check Listing'
          },
          {
            merchant: 'Amazon Prime Store',
            directUrl: `https://www.amazon.com/s?k=${encodedQuery}&tag=applianceengine-20`,
            status: 'Marketplace Available',
            price: 'Live Price'
          },
          {
            merchant: 'RepairClinic Parts',
            directUrl: `https://www.repairclinic.com/Shop-For-Parts?query=${encodeURIComponent(partNumber)}`,
            status: 'Authorized Retailer',
            price: 'Check Listing'
          }

        setActiveSourcingModal({
          brand: brandName,
          partName,
          partNumber,
          sellers: defaultVerifiedStores,
          isSearching: false,
          error: ''
        });
      };

      // Asset Discovery: Detects Non-Replaceable / Sealed Units
      const handleAutoDiscoverAdd = async (e) => {
        e.preventDefault();
        if (!brand || !modelNumber) return;

        setIsAnalyzing(true);
        setLookupStatus('Analyzing hardware architecture & serviceability...');

        let discoveredConsumables = [];
        let discoveredParts = [];
        let detectedCategory = 'Appliance';
        let componentsReplaceable = true;

        const activeKey = apiKey.trim();

        if (activeKey) {
          try {
            const prompt = `You are an appliance engineering and hardware parts database specialist.
Analyze:
Brand: "${brand}"
Model Number: "${modelNumber}"

Determine:
1. Category ("Air Purifier", "Refrigerator", "Cooktop", "Range", "Dishwasher", "Washer", "Dryer", "Microwave", etc.)
2. areComponentsOfficiallyReplaceable: Does the manufacturer officially sell individual internal replacement components (e.g., replacement heating elements, switches, motors) for this product?
   - Note: Most small desktop appliances, budget purifiers, or sealed countertop electronics are non-serviceable sealed units (set areComponentsOfficiallyReplaceable to false).
   - Major appliances (ranges, refrigerators, cooktops, dishwashers) have replaceable parts (set areComponentsOfficiallyReplaceable to true).
3. Consumable maintenance filters (water filters, air filters). If none exist, return [].
4. OEM Replacement components (if areComponentsOfficiallyReplaceable is true). If false, return [].

Respond strictly with valid JSON only:
{
  "category": "Air Purifier",
  "areComponentsOfficiallyReplaceable": false,
  "consumables": [
    { "name": "Particle + Carbon Filter", "partNumber": "OEM-123", "intervalDays": 180, "installTips": "Hold reset 3s." }
  ],
  "replacementParts": []
}`;

            const res = await callGeminiWithFallback(activeKey, prompt, 0.1, 8000);
            const jsonMatch = res.text.match(/\{[\s\S]*\}/);
            const cleanJsonString = jsonMatch ? jsonMatch[0] : res.text.trim();
            const parsed = JSON.parse(cleanJsonString);

            if (parsed.category) detectedCategory = parsed.category;
            if (typeof parsed.areComponentsOfficiallyReplaceable === 'boolean') {
              componentsReplaceable = parsed.areComponentsOfficiallyReplaceable;
            }

            if (Array.isArray(parsed.consumables)) {
              discoveredConsumables = parsed.consumables.map((item, idx) => ({
                id: `c_${Date.now()}_${idx}`,
                name: item.name || 'Consumable Filter',
                partNumber: item.partNumber || 'OEM Standard',
                intervalDays: Number(item.intervalDays) || 180,
                lastReplaced: new Date().toISOString(),
                installTips: item.installTips || 'Replace according to manufacturer instructions.'
              }));
            }

            if (componentsReplaceable && Array.isArray(parsed.replacementParts)) {
              discoveredParts = parsed.replacementParts.map((item, idx) => ({
                id: `p_${Date.now()}_${idx}`,
                category: item.category || 'Components',
                name: item.name,
                partNumber: item.partNumber || 'OEM Part',
                priceEst: item.priceEst || '$40 - $90'
              }));
            }
          } catch (err) {
            console.warn('API lookup timed out or failed. Falling back to local category discovery:', err);
          }
        }

        const brandLower = brand.toLowerCase();
        const modelLower = modelNumber.toLowerCase();

        if (detectedCategory === 'Appliance') {
          if (brandLower.includes('blueair') || brandLower.includes('coway') || modelLower.includes('air')) {
            detectedCategory = 'Air Purifier';
            componentsReplaceable = false; // Purifiers generally only sell filters, not internal motors/fans to retail customers
          } else if (modelLower.includes('gwe') || modelLower.includes('fridge')) {
            detectedCategory = 'Refrigerator';
            componentsReplaceable = true;
          } else if (modelLower.includes('jp') || modelLower.includes('cooktop')) {
            detectedCategory = 'Cooktop';
            componentsReplaceable = true;
          }
        }

        if (discoveredConsumables.length === 0 && detectedCategory === 'Air Purifier') {
          discoveredConsumables = [
            {
              id: `c_${Date.now()}_0`,
              name: brandLower.includes('blueair') ? 'Particle + Carbon Filter' : 'HEPA & Carbon Filter',
              partNumber: brandLower.includes('blueair') ? 'Signature Filter' : 'OEM Standard',
              intervalDays: 180,
              lastReplaced: new Date().toISOString(),
              installTips: 'Reset filter light by holding reset button for 3 seconds.'
            }
          ];
        }

        const newItem = {
          id: Date.now().toString(),
          name: name.trim() || `${brand} ${modelNumber}`,
          brand: brand.trim(),
          modelNumber: modelNumber.trim(),
          category: detectedCategory,
          imageUrl: '',
          warrantyDoc: null,
          receiptDoc: null,
          componentsReplaceable,
          consumables: discoveredConsumables,
          replacementParts: discoveredParts
        };

        setAppliances([newItem, ...appliances]);
        setName('');
        setBrand('');
        setModelNumber('');
        setIsAnalyzing(false);
        setLookupStatus('');
        setIsAddOpen(false);

            consumables: app.consumables.map((c) =>

            },
          ];
          setMessages(initialMessages);
          saveApplianceChat(item.id, initialMessages);
        }
      };

      const sendQuery = async (text) => {
        const q = text || queryInput;
        if (!q.trim() || !activeAppliance || isLoading) return;

        if (q.toLowerCase().includes('go deeper') && !isPaidUser) {
          setIsPaywallOpen(true);
          return;
        }

        const userMsg = { id: Date.now().toString(), sender: 'user', text: q };
        const updatedHistory = [...messages, userMsg];
        setMessages(updatedHistory);
        saveApplianceChat(activeAppliance.id, updatedHistory);
        setQueryInput('');
        setIsLoading(true);

        const activeKey = apiKey.trim();

        if (activeKey) {
          try {
            const historyText = updatedHistory
              .slice(-5)
              .map((m) => `${m.sender.toUpperCase()}: ${m.text}`)
              .join('\n');

            let prompt = '';

            if (isPaidUser) {
              prompt = `You are a certified master appliance repair technician.
Appliance: ${activeAppliance.brand} (Model: ${activeAppliance.modelNumber})
History:
${historyText}

Question: "${q}"

1. If initial triage: Give 2-3 simple safe checks under 100 words and end with: "💡 Did these initial checks solve it? If not, reply **'Go Deeper'** and I'll walk you through more in-depth testing (multimeter checks, switch testing, and exact part numbers)."
2. If user said 'Go Deeper': Give full technical component testing, multimeter ohms, switch wiring, and OEM part replacement steps.`;
            } else {
              prompt = `You are an appliance manual reader.
Appliance: ${activeAppliance.brand} (${activeAppliance.modelNumber})
Question: "${q}"

Provide a 2-3 bullet point answer strictly from the owner guide under 90 words. If it is an internal electrical failure not in the owner guide, provide the closest basic check (breaker/indicator) and note that advanced diagnostics require Pro.`;
            }

            const res = await callGeminiWithFallback(activeKey, prompt, 0.2, 10000);
            const finalHistory = [...updatedHistory, { id: (Date.now() + 1).toString(), sender: 'assistant', text: res.text }];
            setMessages(finalHistory);
            saveApplianceChat(activeAppliance.id, finalHistory);
          } catch (err) {
            const errorHistory = [
              ...updatedHistory,
              { id: (Date.now() + 1).toString(), sender: 'assistant', text: `Diagnostic service note: ${err.message}` },
            ];
            setMessages(errorHistory);
            saveApplianceChat(activeAppliance.id, errorHistory);
          } finally {
            setIsLoading(false);
          }
        } else {
          setTimeout(() => {
            const fallbackHistory = [
              ...updatedHistory,
              { id: (Date.now() + 1).toString(), sender: 'assistant', text: 'Please add your free Gemini API key under ⚙️ API to query live service manuals.' },
            ];
            setMessages(fallbackHistory);
            saveApplianceChat(activeAppliance.id, fallbackHistory);
            setIsLoading(false);
          }, 300);
        }
      };

      const handleTouchStart = (e) => {
        touchStartX.current = e.touches[0].clientX;
      };

      const handleTouchEnd = (e, id) => {

                  </button>
                  <button
                    onClick={() => handleResetConsumable(activeConsumableModal.appliance.id, activeConsumableModal.consumable.id)}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-4 py-2 rounded-lg"
                  >
                    Mark as Replaced Today
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* VERIFIED IN-STOCK SELLERS ACTION MODAL (z-[65]) */}
          {activeSourcingModal && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[65] backdrop-blur-md">
              <div className="bg-slate-900 border border-slate-700/80 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl relative">
                <button
                  onClick={() => setActiveSourcingModal(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>
                <div>
                  <span className="inline-block bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase tracking-wider mb-1.5">
                    Live Stock Check
                  </span>
                  <h3 className="text-sm font-bold text-slate-100 truncate">{activeSourcingModal.partName}</h3>
                  <p className="text-xs text-slate-400">OEM #: {activeSourcingModal.partNumber}</p>
                </div>

                {activeSourcingModal.isSearching ? (
                  <div className="py-6 text-center space-y-2">
                    <div className="w-6 h-6 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                    <p className="text-xs text-slate-300 font-medium">Scanning certified inventory across merchants...</p>
                    <p className="text-[10px] text-slate-500">Checking AppliancePartsPros, Encompass, and authorized suppliers.</p>
                  </div>
                ) : (
                  <div className="space-y-2">
                    <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider">
                      Verified Order Links
                    </p>
                    {activeSourcingModal.sellers.map((seller, idx) => (
                      <div key={idx} className="bg-slate-950 border border-slate-800 rounded-xl p-3 flex items-center justify-between">
                        <div>
                          <p className="text-xs font-bold text-slate-200">{seller.merchant}</p>
                          <div className="flex items-center gap-2 mt-0.5">
                            <span className="text-[10px] text-emerald-400 font-medium">{seller.status}</span>
                            {seller.price && <span className="text-[10px] text-slate-400">• {seller.price}</span>}
                          </div>
                        </div>
                        <a
                          href={seller.directUrl}
                          target="_blank"
                          rel="noreferrer"
                          className="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm"
                        >
                          <span>Open Store</span>
                          <span className="text-[9px]">↗</span>
                        </a>
                      </div>
                    ))}
                  </div>
                )}

                <div className="pt-1">
                  <button
                    onClick={() => setActiveSourcingModal(null)}
                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg font-semibold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CONFIRMATION POPUP FOR PRODUCT REMOVAL (z-[70]) */}
          {deleteTarget && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[70] backdrop-blur-md">
              <div className="bg-slate-900 border border-rose-500/40 rounded-2xl p-5 w-full max-w-xs space-y-4 shadow-2xl text-center">
                <div className="w-12 h-12 bg-rose-950/80 border border-rose-800 rounded-full flex items-center justify-center mx-auto text-rose-400">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" className="w-6 h-6">
                    <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" strokeLinecap="round" strokeLinejoin="round"/>
                  </svg>
                </div>
                <div>
                  <h3 className="text-sm font-bold text-slate-100">Remove Appliance?</h3>
                  <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                    Are you sure you want to delete <strong>{deleteTarget.name}</strong>? This also purges stored chat histories and uploaded documents.
                  </p>
                </div>
                <div className="flex gap-2 pt-2">
                  <button
                    onClick={() => setDeleteTarget(null)}
                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg font-semibold"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={confirmDelete}
                    className="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs py-2 rounded-lg font-bold"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Ask Manual Assistant Modal (z-50) */}
          {activeAppliance && (
            <div className="fixed inset-0 bg-black/70 flex items-end sm:items-center justify-center p-0 sm:p-4 z-50">
              <div className="bg-slate-800 border-t sm:border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-sm h-[82vh] flex flex-col p-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-700">
                  <div>
                    <h3 className="text-sm font-bold text-slate-100">
                      {isPaidUser ? '⭐ Pro Diagnostic Tech' : '📖 Manual Search'}
                    </h3>
                    <p className="text-xs text-slate-400">{activeAppliance.brand} {activeAppliance.modelNumber}</p>
                  </div>
                  <button onClick={() => setActiveAppliance(null)} className="text-slate-400 hover:text-white text-base">✕</button>
                </div>

                <div className="py-1 text-center">
                  <span className="text-[10px] text-slate-500 tracking-wide">
                    🔒 Active thread • Messages stored locally for 5 days
                  </span>
                </div>

                <div className="flex flex-wrap gap-1.5 py-1.5">
                  {[
                    'Filter replacement / reset',
                    'Not turning on',
                    'Go Deeper'
                  ].map((chip) => (
                    <button
                      key={chip}
                      disabled={isLoading}
                      onClick={() => sendQuery(chip)}
                      className={`text-[11px] px-2.5 py-1 rounded-full disabled:opacity-50 font-medium transition-colors ${
                        chip === 'Go Deeper'
                          ? 'bg-indigo-600/30 text-indigo-300 border border-indigo-500/40 hover:bg-indigo-600/50'
                          : 'bg-slate-700/80 hover:bg-slate-600 text-blue-300'
                      }`}
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <div className="flex-1 overflow-y-auto space-y-2 py-2 text-xs">
                  {messages.map((m) => (
                    <div
                      key={m.id}
                      className={`p-2.5 rounded-xl whitespace-pre-line max-w-[88%] ${
                        m.sender === 'user'
                          ? 'ml-auto bg-blue-600 text-white'
                          : 'mr-auto bg-slate-900 border border-slate-700 text-slate-200'
                      }`}
                    >
                      {m.text}
                    </div>
                  ))}
                  {isLoading && (
                    <div className="mr-auto bg-slate-900 border border-slate-700 text-slate-400 p-2.5 rounded-xl text-xs">
                      {isPaidUser ? 'Analyzing issue & checking triage steps...' : 'Searching manual pages...'}
                    </div>
                  )}
                </div>

                <div className="pt-2 border-t border-slate-700 flex gap-2">
                  <input
                    className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 focus:outline-none"
                    placeholder={isPaidUser ? "Describe issue or type 'Go Deeper'..." : "Search user manual..."}
                    value={queryInput}
                    disabled={isLoading}
                    onChange={(e) => setQueryInput(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && sendQuery()}
                  />
                  <button
                    onClick={() => sendQuery()}
                    disabled={isLoading}
                    className="bg-sky-600 hover:bg-sky-500 text-white font-semibold text-xs px-3 py-2 rounded-lg disabled:opacity-50"
                  >
                    Ask
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PRO PAYWALL / UPSELL MODAL (z-[60]) */}
          {isPaywallOpen && (
            <div className="fixed inset-0 bg-black/85 flex items-center justify-center p-4 z-[60] backdrop-blur-md">
              <div className="bg-slate-900 border border-indigo-500/40 rounded-2xl p-5 w-full max-w-sm space-y-4 shadow-2xl relative">
                <button
                  onClick={() => setIsPaywallOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white text-sm"
                >
                  ✕
                </button>
                <div>
                  <span className="inline-block bg-indigo-500/10 text-indigo-400 border border-indigo-500/30 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider mb-2">
                    Pro Diagnostic Tier
                  </span>
                  <h3 className="text-base font-bold text-slate-100">
                    Unlock Master Technician Analysis
                  </h3>
                  <p className="text-xs text-slate-400 mt-1 leading-relaxed">
                    Standard search covers owner guide basics. <strong>Go Deeper</strong> uses advanced AI hardware reasoning to isolate physical faults.
                  </p>
                </div>

                <div className="space-y-2 bg-slate-950/80 p-3.5 rounded-xl border border-slate-800 text-xs">
                  <div className="flex items-start gap-2.5">
                    <span className="text-indigo-400 text-sm mt-0.5">⚡</span>
                    <div>
                      <p className="font-semibold text-slate-200">Hardware Component Isolation</p>
                      <p className="text-[11px] text-slate-400">Differentiates failing switches, heating ribbons, thermal limiters, and control boards.</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-2.5">
                    <span className="text-indigo-400 text-sm mt-0.5">🔍</span>
                    <div>
                      <p className="font-semibold text-slate-200">Multimeter Ohm & Voltage Testing</p>
                      <p className="text-[11px] text-slate-400">Exact terminal pin numbers, continuity checks, and expected resistance ranges.</p>
                    </div>
                  </div>
                  <div className="flex items-start gap-2.5">
                    <span className="text-indigo-400 text-sm mt-0.5">📋</span>
                    <div>
                      <p className="font-semibold text-slate-200">Direct OEM Part Cross-Reference</p>
                      <p className="text-[11px] text-slate-400">Exact part numbers with price estimates and direct retailer order links.</p>
                    </div>
                  </div>
                </div>

                <div className="pt-1 flex flex-col gap-2">
                  <button
                    onClick={() => {
                      setIsPaidUser(true);
                      localStorage.setItem('app_is_paid_user', 'true');
                      setIsPaywallOpen(false);
                    }}
                    className="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-2.5 rounded-lg shadow-md transition-all text-center"
                  >
                    Activate Pro Diagnostics
                  </button>
                  <button
                    onClick={() => setIsPaywallOpen(false)}
                    className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs py-2 rounded-lg"
                  >
                    Continue with Basic Manual
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Settings Modal (z-50) */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm">
                <h3 className="text-base font-bold mb-1 text-slate-100">Settings & Tier</h3>
                <p className="text-xs text-slate-400 mb-3">Configure Gemini API key and active tier.</p>
                <form onSubmit={saveSettings} className="space-y-3">
                  <div>
                    <label className="text-[11px] text-slate-300 font-medium">Gemini API Key</label>
                    <input
                      type="password"
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100 mt-1"
                      placeholder="AIzaSy..."
                      value={keyInput}
                      onChange={(e) => setKeyInput(e.target.value)}
                    />
                  </div>

                  <div className="bg-slate-900/80 p-3 rounded-lg border border-slate-700 flex items-center justify-between">
                    <div>
                      <p className="text-xs font-semibold text-slate-200">Paid Subscriber Mode</p>
                      <p className="text-[10px] text-slate-400">Quick triage first + deep dive on demand</p>
                    </div>
                    <button
                      type="button"
                      onClick={() => setIsPaidUser(!isPaidUser)}
                      className={`text-xs px-3 py-1 rounded-full font-bold ${
                        isPaidUser ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300'
                      }`}
                    >
                      {isPaidUser ? 'ACTIVE' : 'FREE'}
                    </button>
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setIsSettingsOpen(false)}
                      className="bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-blue-600 text-white text-xs font-semibold px-4 py-2 rounded-lg"
                    >
                      Save Settings
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add Asset Modal (z-50) */}
          {isAddOpen && (
            <div className="fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 w-full max-w-sm">
                <h3 className="text-base font-bold mb-1 text-slate-100">Add Appliance</h3>
                <p className="text-xs text-slate-400 mb-3">
                  Enter brand and model. Consumables and parts catalog will be auto-populated.
                </p>
                <form onSubmit={handleAutoDiscoverAdd} className="space-y-3">
                  <input
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100"
                    placeholder="Nickname (Optional, e.g. Bedroom Purifier)"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                  />
                  <input
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100"
                    placeholder="Brand (e.g. Blueair, Coway, GE)"
                    value={brand}
                    onChange={(e) => setBrand(e.target.value)}
                    required
                  />
                  <input
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-100"
                    placeholder="Model Number (e.g. 112929, GWE191JMLXFES)"
                    value={modelNumber}
                    onChange={(e) => setModelNumber(e.target.value)}
                    required
                  />

                  {isAnalyzing && (
                    <div className="bg-blue-950/60 border border-blue-800/80 rounded-lg p-2.5 text-center">
                      <p className="text-xs text-blue-300 font-medium animate-pulse">{lookupStatus}</p>
                    </div>
                  )}

                  <div className="flex justify-end gap-2 pt-2">
                    <button
                      type="button"
                      disabled={isAnalyzing}
                      onClick={() => setIsAddOpen(false)}
                      className="bg-slate-700 text-slate-200 text-xs px-3 py-2 rounded-lg disabled:opacity-50"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isAnalyzing}
                      className="bg-blue-600 hover:bg-blue-500 text-white font-semibold text-xs px-4 py-2 rounded-lg disabled:opacity-50"
                    >
                      {isAnalyzing ? 'Inspecting...' : 'Add'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
