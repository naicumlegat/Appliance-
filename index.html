    const TelemetryEngine = {
      recordReliabilityEvent(eventType, modelNum, category, component = '') {
        try {
          const enabled = localStorage.getItem('app_telemetry_optin') !== 'false';
          if (!enabled) return;

          const rawEvents = localStorage.getItem('app_telemetry_queue') || '[]';
          const queue = JSON.parse(rawEvents);

          const sanitizedEvent = {
            t: Date.now(),
            e: eventType,
            m: (modelNum || '').trim().toUpperCase(),
            c: category || 'Appliance',
            p: component || null
          };

          queue.push(sanitizedEvent);
          if (queue.length > 50) queue.shift();
          localStorage.setItem('app_telemetry_queue', JSON.stringify(queue));
        } catch (err) {}
      }
    };

    function compressImageFile(file, maxWidth = 1200, quality = 0.72) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality);
            const base64 = dataUrl.split(',')[1];
            resolve({ dataUrl, base64, mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function callGeminiWithFallback(apiKey, prompt, temp = 0.2, timeoutMs = 12000, imagePayload = null) {
      if (!apiKey || !apiKey.trim()) {
        throw new Error('No API Key configured. Please add your key in Account Settings.');
      }

      let lastError = null;
      for (const model of MODEL_CASCADE) {
        for (let attempt = 0; attempt < 2; attempt++) {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

          try {
            if (attempt > 0) await new Promise((r) => setTimeout(r, 1200));

            const parts = [{ text: prompt }];
            if (imagePayload) {
              parts.push({
                inlineData: { mimeType: imagePayload.mimeType, data: imagePayload.base64 }
              });
            }

            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey.trim()}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                signal: controller.signal,
                body: JSON.stringify({
                  contents: [{ parts }],
                  generationConfig: { temperature: temp }
                }),
              }
            );

            clearTimeout(timeoutId);
            const data = await res.json();

            if (data.error) {
              const code = data.error.code;
              if (code === 503 || code === 429) {
                lastError = `Rate limit (${code}). Retrying...`;
                continue;
              }
              throw new Error(`API (${code}): ${data.error.message}`);
            }

            if (data.candidates?.[0]?.content?.parts?.[0]?.text) {
              return data.candidates[0].content.parts[0].text;
            }
          } catch (err) {
            clearTimeout(timeoutId);
            lastError = err.message;
          }
        }
      }
      throw new Error(lastError || 'Service busy.');
    }

                                isDark
                                  ? 'bg-zinc-800 text-zinc-300 border-zinc-700 hover:text-white'
                                  : 'bg-[#E5E5EA] text-[#1C1C1E] border-black/5 hover:bg-[#D1D1D6]'
                              }`}
                            >
                              {s.name}
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  <div>
                    <label className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Nickname</label>
                    <input
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      placeholder="e.g. Master Bedroom Purifier"
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Brand *</label>
                      <input
                        className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                          isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                        }`}
                        placeholder="e.g. GE, Coway"
                        value={brandInput}
                        onChange={(e) => setBrandInput(e.target.value)}
                        required
                      />
                    </div>
                    <div>
                      <label className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Model # *</label>
                      <input
                        className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                          isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                        }`}
                        placeholder="e.g. GWE191"
                        value={modelInput}
                        onChange={(e) => setModelInput(e.target.value)}
                        required
                      />
                    </div>
                  </div>

                  <div>
                    <label className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Purchase Date</label>
                    <input
                      type="date"
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      value={purchaseDateInput}
                      onChange={(e) => setPurchaseDateInput(e.target.value)}
                    />
                  </div>

                  <div>
                    <label className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Warranty Duration</label>
                    <select
                      className={`w-full rounded-2xl p-3 text-xs font-semibold mt-1 focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                      }`}
                      value={warrantyMonthsInput}
                      onChange={(e) => setWarrantyMonthsInput(e.target.value)}
                    >
                      <option value="12">1 Year (12 months)</option>
                      <option value="24">2 Years (24 months)</option>
                      <option value="36">3 Years (36 months)</option>
                      <option value="60">5 Years (60 months)</option>
                    </select>
                  </div>

                  {isAnalyzing && <p className="text-xs text-amber-600 dark:text-amber-500 font-bold text-center animate-pulse">{lookupStatus}</p>}

                  <button
                    type="submit"
                    disabled={isAnalyzing}
                    className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3.5 rounded-2xl shadow-md active:scale-98 transition-all"
                  >
                    {isAnalyzing ? 'Inspecting...' : 'Add Appliance'}
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Bulk Deletion Toolbar */}
          {isSelectMode && (
            <div className={`fixed bottom-4 inset-x-4 max-w-sm mx-auto z-40 border rounded-2xl p-3.5 shadow-2xl flex items-center justify-between ${
              isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
            }`}>
              <div className="flex items-center gap-2">
                <button
                  onClick={selectAll}
                  className={`text-xs font-bold px-3 py-1.5 rounded-full ${
                    isDark ? 'text-zinc-200 bg-zinc-800' : 'text-[#1C1C1E] bg-[#E5E5EA]'
                  }`}
                >
                  {selectedIds.length === appliances.length ? 'Deselect All' : 'Select All'}
                </button>
                <span className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>{selectedIds.length} chosen</span>
              </div>
              <button
                disabled={selectedIds.length === 0}
                onClick={() => setIsBulkDeleteModalOpen(true)}
                className="bg-rose-600 hover:bg-rose-500 disabled:opacity-40 text-white font-bold text-xs px-4 py-1.5 rounded-full active:scale-95 shadow-sm"
              >
                Delete {selectedIds.length > 0 && `(${selectedIds.length})`}
              </button>
            </div>
          )}

          {/* Bulk Deletion Modal */}
          {isBulkDeleteModalOpen && (
            <div
              onClick={() => setIsBulkDeleteModalOpen(false)}
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-[70] cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`border rounded-[32px] p-6 w-full max-w-xs space-y-4 shadow-2xl text-center cursor-default ${
                  isDark ? 'bg-zinc-900 border-rose-500/40 text-white' : 'bg-white border-rose-300 text-[#1C1C1E]'
                }`}
              >
                <h3 className="text-base font-extrabold">Delete {selectedIds.length} Items?</h3>
                <p className={`text-xs font-medium ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>This will permanently remove the selected appliances.</p>
                <div className="flex gap-2 pt-2">
                  <button onClick={() => setIsBulkDeleteModalOpen(false)} className={`flex-1 text-xs py-2.5 rounded-2xl font-bold ${
                    isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}>Cancel</button>
                  <button onClick={confirmBulkDelete} className="flex-1 bg-rose-600 text-white text-xs py-2.5 rounded-2xl font-bold">Delete</button>
                </div>
              </div>
            </div>
          )}

          {/* Home Appliance Passport Export Modal ($3.99 Flat Fee for Everyone) */}
          {isPassportModalOpen && (
            <div
              onClick={() => setIsPassportModalOpen(false)}
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-[32px] p-6 space-y-4 shadow-2xl border cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-500">Official Document</span>
                    <h3 className="text-lg font-extrabold tracking-tight mt-0.5">Home Appliance Passport</h3>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsPassportModalOpen(false)} />
                </div>

                <div className={`p-4 rounded-2xl border space-y-2 text-xs ${
                  isDark ? 'bg-zinc-950/80 border-white/5 text-zinc-300' : 'bg-[#F9F9FB] border-black/5 text-[#1C1C1E]'
                }`}>
                  <p className="font-semibold text-sm">Comprehensive Property Audit PDF</p>
                  <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                    Compiles verified model specs, serial numbers, active filter lifespans, OEM maintenance dates, and warranty statuses into a formal presentation document for home sales, inspections, and tenants.
                  </p>
                  <div className="pt-1 flex items-center justify-between text-xs font-bold border-t border-black/5 dark:border-white/5">
                    <span>One-Time Export Fee</span>
                    <span className="text-amber-600 dark:text-amber-400">$3.99</span>
                  </div>
                </div>

                <button
                  disabled={isGeneratingPdf}
                  onClick={handleDownloadPassport}
                  className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3.5 rounded-2xl shadow-md active:scale-98 transition-all disabled:opacity-50"
                >
                  {isGeneratingPdf ? 'Compiling Passport...' : 'Pay $3.99 & Download Passport (PDF)'}
                </button>
              </div>
            </div>
          )}

          {/* HIDDEN RENDER CONTAINER FOR PROFESSIONAL PASSPORT PDF */}
          <div style={{ display: 'none' }}>
            <div id="passport-document-export" style={{ padding: '24px', fontFamily: 'Arial, sans-serif', color: '#111827', backgroundColor: '#FFFFFF' }}>
              <div style={{ borderBottom: '3px solid #D97706', paddingBottom: '16px', marginBottom: '20px' }}>
                <h1 style={{ fontSize: '24px', fontWeight: 'bold', margin: '0 0 4px 0', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Home Appliance Passport</h1>
                <p style={{ fontSize: '11px', color: '#6B7280', margin: 0 }}>Official Maintenance & Asset Audit Trail • Generated on {new Date().toLocaleDateString()}</p>
                <p style={{ fontSize: '11px', color: '#6B7280', margin: '2px 0 0 0' }}>Registered Account: {userEmail}</p>
              </div>

              <div style={{ marginBottom: '24px' }}>
                <h2 style={{ fontSize: '14px', fontWeight: 'bold', textTransform: 'uppercase', color: '#374151', borderBottom: '1px solid #E5E7EB', paddingBottom: '4px', marginBottom: '12px' }}>
                  Installed Appliances & Equipment ({appliances.length})
                </h2>

                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px', textAlign: 'left' }}>
                  <thead>
                    <tr style={{ backgroundColor: '#F3F4F6', borderBottom: '1px solid #D1D5DB' }}>
                      <th style={{ padding: '8px' }}>Asset Name</th>
                      <th style={{ padding: '8px' }}>Category</th>
                      <th style={{ padding: '8px' }}>Brand / Model</th>
                      <th style={{ padding: '8px' }}>Unit / Location</th>
                      <th style={{ padding: '8px' }}>Warranty Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {appliances.map((app, idx) => {
                      const u = units.find(unit => unit.id === app.unitId);
                      const w = getWarrantyRemainingDays(app.purchaseDate, app.warrantyMonths);
                      return (
                        <tr key={idx} style={{ borderBottom: '1px solid #E5E7EB' }}>
                          <td style={{ padding: '8px', fontWeight: 'bold' }}>{app.name}</td>
                          <td style={{ padding: '8px' }}>{app.category}</td>
                          <td style={{ padding: '8px' }}>{app.brand} • {app.modelNumber}</td>
                          <td style={{ padding: '8px' }}>{u ? u.name : 'Main Residence'}</td>
                          <td style={{ padding: '8px' }}>{w !== null && w > 0 ? `${w} days active` : 'Expired / Standard'}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>

              <div>
                <h2 style={{ fontSize: '14px', fontWeight: 'bold', textTransform: 'uppercase', color: '#374151', borderBottom: '1px solid #E5E7EB', paddingBottom: '4px', marginBottom: '12px' }}>
                  Consumables, Filters & Service Log
                </h2>

                <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px', textAlign: 'left' }}>
                  <thead>
                    <tr style={{ backgroundColor: '#F3F4F6', borderBottom: '1px solid #D1D5DB' }}>
                      <th style={{ padding: '8px' }}>Appliance</th>
                      <th style={{ padding: '8px' }}>Filter / Part Name</th>
                      <th style={{ padding: '8px' }}>OEM Part #</th>
                      <th style={{ padding: '8px' }}>Cycle Interval</th>
                      <th style={{ padding: '8px' }}>Last Serviced</th>
                    </tr>
                  </thead>
                  <tbody>
                    {appliances.flatMap(app => (app.consumables || []).map((c, cIdx) => (
                      <tr key={`${app.id}_${cIdx}`} style={{ borderBottom: '1px solid #E5E7EB' }}>
                        <td style={{ padding: '8px', fontWeight: 'bold' }}>{app.name}</td>
                        <td style={{ padding: '8px' }}>{c.name}</td>
                        <td style={{ padding: '8px', fontFamily: 'monospace' }}>{c.partNumber}</td>
                        <td style={{ padding: '8px' }}>{c.intervalDays} days</td>
                        <td style={{ padding: '8px' }}>{new Date(c.lastReplaced).toLocaleDateString()}</td>
                      </tr>
                    )))}
                  </tbody>
                </table>
              </div>

              <div style={{ marginTop: '30px', borderTop: '1px solid #E5E7EB', paddingTop: '10px', fontSize: '10px', color: '#9CA3AF', textAlign: 'center' }}>
                Certified Appliance Passport generated via Appliance Engine. Retain for property conveyance records.
              </div>
            </div>
          </div>

          {/* Settings Modal */}
          {isSettingsOpen && (
            <div
              onClick={() => setIsSettingsOpen(false)}
              className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-md max-h-[90vh] overflow-y-auto rounded-t-[32px] p-6 space-y-4 shadow-2xl border-t cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-center pb-2 border-b border-black/10 dark:border-white/10">
                  <div>
                    <h3 className="text-base font-extrabold">Account & Settings</h3>
                    <p className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>{userEmail}</p>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsSettingsOpen(false)} />
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div>
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Subscription</span>
                    <p className="text-sm font-extrabold">{isPaidUser ? 'Pro Manager' : 'Free Standard'}</p>
                  </div>
                  {isPaidUser ? (
                    <button onClick={() => setIsCancelModalOpen(true)} className="text-xs text-rose-600 dark:text-rose-400 font-bold underline">
                      Cancel Plan
                    </button>
                  ) : (
                    <button onClick={toggleTier} className="text-xs font-bold px-3.5 py-1.5 rounded-full bg-amber-600 hover:bg-amber-500 text-white shadow-sm">
                      Activate Pro
                    </button>
                  )}
                </div>

                {/* Cloud & Stripe Account Synchronization Status */}
                <div className={`p-4 rounded-2xl border space-y-1.5 ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div className="flex justify-between items-center">
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Cloud Sync Engine</span>
                    <span className="text-[10px] font-bold text-amber-600 dark:text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full">Staged for Connect</span>
                  </div>
                  <p className="text-xs font-bold">Supabase DB & Stripe Webhook Bridge</p>
                  <p className={`text-[10px] leading-tight ${isDark ? 'text-zinc-400' : 'text-[#8E8E93]'}`}>
                    Local state is verified and pre-architected to bind instantly to Supabase Auth and Stripe Webhooks once production keys are deployed.
                  </p>
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div>
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Appearance</span>
                    <p className="text-sm font-extrabold">Theme Mode</p>
                  </div>
                  <div className="flex gap-1">
                    <button onClick={() => toggleTheme('dark')} className={`px-3.5 py-1.5 rounded-full text-xs font-bold ${
                      isDark ? 'bg-black text-white shadow-sm' : 'bg-[#E5E5EA] text-[#636366]'
                    }`}>Dark</button>
                    <button onClick={() => toggleTheme('light')} className={`px-3.5 py-1.5 rounded-full text-xs font-bold ${
                      !isDark ? 'bg-[#1C1C1E] text-white shadow-sm' : 'bg-zinc-800 text-zinc-400'
                    }`}>Light</button>
                  </div>
                </div>

                <div className={`p-4 rounded-2xl flex justify-between items-center border ${
                  isDark ? 'bg-zinc-800/80 border-white/5' : 'bg-white border-black/10 shadow-sm'
                }`}>
                  <div className="pr-3">
                    <span className={`text-[10px] uppercase font-bold tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Privacy & Data</span>
                    <p className="text-xs font-bold">Anonymous Reliability Sharing</p>
                    <p className={`text-[10px] leading-tight mt-0.5 font-medium ${isDark ? 'text-zinc-500' : 'text-[#8E8E93]'}`}>Contributes anonymous failure rates and lifespans. Zero personal identity collected.</p>
                  </div>
                  <button
                    onClick={toggleTelemetry}
                    className={`px-3 py-1 rounded-full text-xs font-bold ${
                      telemetryOptIn
                        ? (isDark ? 'bg-emerald-500 text-black' : 'bg-emerald-100 text-emerald-800 border border-emerald-300')
                        : (isDark ? 'bg-zinc-700 text-zinc-400' : 'bg-[#E5E5EA] text-[#636366]')
                    }`}
                  >
                    {telemetryOptIn ? 'Enabled' : 'Disabled'}
                  </button>
                </div>

                <div className="space-y-1">
                  <label className={`text-[10px] font-bold uppercase tracking-wider ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>Gemini API Key</label>
                  <input
                    type="password"
                    className={`w-full rounded-2xl p-3 text-xs font-semibold focus:outline-none border ${
                      isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/70 border-black/10 text-black'
                    }`}
                    placeholder="AIzaSy..."
                    value={apiKey}
                    onChange={(e) => { setApiKey(e.target.value); localStorage.setItem('gemini_api_key', e.target.value.trim()); }}
                  />
                </div>

                <button onClick={() => setIsSettingsOpen(false)} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3.5 rounded-2xl shadow-sm">
                  Save & Close
                </button>
              </div>
            </div>
          )}

          {/* Pro Overview Paywall Modal */}
          {isPaywallOpen && (
            <div
              onClick={() => setIsPaywallOpen(false)}
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-50 cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-[32px] p-6 space-y-4 shadow-2xl border cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <div className="flex justify-between items-start">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider text-amber-600 dark:text-amber-500">Pro Diagnostics</span>
                    <h3 className="text-lg font-extrabold tracking-tight mt-0.5">Component & Electrical Triage</h3>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setIsPaywallOpen(false)} />
                </div>
                <div className={`space-y-2 text-xs p-3.5 rounded-2xl font-medium ${
                  isDark ? 'bg-zinc-800/80 text-zinc-300' : 'bg-[#E5E5EA]/60 text-[#1C1C1E]'
                }`}>
                  <p>✓ <strong>Hardware Circuit Isolation:</strong> Diagnose faulty microswitches, limiters, and control boards.</p>
                  <p>✓ <strong>Multimeter Ohm Testing:</strong> Exact terminal resistance values and continuity steps.</p>
                  <p>✓ <strong>Multi-Unit Properties:</strong> Organize appliances into custom units with independent alert muting.</p>
                </div>
                <div className="flex flex-col gap-2 pt-1">
                  <button onClick={() => { setIsPaidUser(true); localStorage.setItem('app_is_paid_user', 'true'); setIsPaywallOpen(false); }} className="w-full bg-amber-600 hover:bg-amber-500 text-white font-extrabold text-xs py-3 rounded-2xl shadow-sm">
                    Activate Pro Diagnostics
                  </button>
                  <button onClick={() => setIsPaywallOpen(false)} className={`text-xs font-bold py-1 text-center ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                    Continue with Basic Manual
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Cancellation Sheet */}
          {isCancelModalOpen && (
            <div
              onClick={() => setIsCancelModalOpen(false)}
              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-[60] cursor-pointer"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className={`w-full max-w-sm rounded-[32px] p-6 space-y-3 shadow-2xl border cursor-default ${
                  isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
                }`}
              >
                <h3 className="text-sm font-extrabold">Cancel Pro Subscription?</h3>
                <p className={`text-xs font-medium leading-relaxed ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                  We're sad to see you go! Thank you for your support. Your Pro access stays active until the end of this billing cycle.
                </p>
                <textarea
                  rows="2"
                  className={`w-full rounded-2xl p-2.5 text-xs font-medium focus:outline-none border ${
                    isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-[#E5E5EA]/60 border-black/10 text-black'
                  }`}
                  placeholder="What could we improve? (Optional)"
                  value={cancelFeedback}
                  onChange={(e) => setCancelFeedback(e.target.value)}
                />
                <div className="flex gap-2 pt-1">
                  <button onClick={() => setIsCancelModalOpen(false)} className={`flex-1 py-2.5 rounded-2xl text-xs font-bold ${
                    isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                  }`}>
                    Keep Plan
                  </button>
                  <button onClick={() => { setIsPaidUser(false); localStorage.setItem('app_is_paid_user', 'false'); setIsCancelModalOpen(false); setIsSettingsOpen(false); }} className="flex-1 py-2.5 rounded-2xl text-xs font-bold bg-rose-600 text-white shadow-sm">
                    Confirm Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
