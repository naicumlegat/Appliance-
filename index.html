      animation: pulse-emerald 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes wave-bounce {

    function getDegradationColor(percent) {
      const p = Math.max(0, Math.min(100, percent));
      let r, g, b;

      if (p > 50) {
        const t = (100 - p) / 50;
        r = Math.round(16 + (245 - 16) * t);
        g = Math.round(185 + (158 - 185) * t);
        b = Math.round(129 + (11 - 129) * t);
      } else if (p > 20) {
        const t = (50 - p) / 30;
        r = Math.round(245 + (249 - 245) * t);
        g = Math.round(158 + (115 - 158) * t);
        b = Math.round(11 + (22 - 11) * t);
      } else {
        const t = (20 - p) / 20;
        r = Math.round(249 + (225 - 249) * t);
        g = Math.round(115 + (29 - 115) * t);
        b = Math.round(22 + (72 - 22) * t);
      }

      return {
        rgbString: `rgb(${r}, ${g}, ${b})`,
        bgStyle: { backgroundColor: `rgb(${r}, ${g}, ${b})` }
      };
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-zinc-950 text-white p-6 flex flex-col justify-center items-center text-center">
              <div className="w-12 h-12 rounded-full bg-rose-500/20 text-[#E11D48] flex items-center justify-center font-bold text-xl mb-4">✕</div>
              <h2 className="text-lg font-black tracking-tight mb-2">Display Rendering Recovered</h2>
              <p className="text-xs text-zinc-400 max-w-xs mb-4 leading-relaxed">
                {String(this.state.error?.message || "A localized data mismatch occurred.")}

              <button 
                onClick={() => { localStorage.clear(); window.location.reload(); }}
                className="bg-[#FF9500] hover:bg-amber-500 text-white font-bold text-xs px-5 py-2.5 rounded-2xl shadow-sm active:scale-95 transition-transform"
              >
                Clear Cache & Reload
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const ApplianceStorageDB = {
      dbPromise: null,
      getDB() {
        if (!this.dbPromise) {
          this.dbPromise = new Promise((resolve, reject) => {
            const req = indexedDB.open('ApplianceEngineDB', 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains('passport_pdfs')) db.createObjectStore('passport_pdfs');
              if (!db.objectStoreNames.contains('media_store')) db.createObjectStore('media_store');
              if (!db.objectStoreNames.contains('manuals_cache')) db.createObjectStore('manuals_cache');
            };
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
          });
        }
        return this.dbPromise;
      },
      async get(storeName, key) {
        try {
          const db = await this.getDB();
          return new Promise((resolve) => {
            const tx = db.transaction(storeName, 'readonly');
            const req = tx.objectStore(storeName).get(key);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          });
        } catch (e) { return null; }
      },
      async set(storeName, key, value) {
        try {
          const db = await this.getDB();
          return new Promise((resolve) => {
            const tx = db.transaction(storeName, 'readwrite');
            const req = tx.objectStore(storeName).put(value, key);
            req.onsuccess = () => resolve();
            req.onerror = () => reject(req.error);
          });
        } catch (e) {}
      },
      async delete(storeName, key) {
        try {
          const db = await this.getDB();
          return new Promise((resolve) => {
            const tx = db.transaction(storeName, 'readwrite');
            const req = tx.objectStore(storeName).delete(key);
            req.onsuccess = () => resolve();
            req.onerror = () => resolve();
          });
        } catch (e) {}
      }
    };

    function buildPartPurchaseUrl(brand, partItem, targetStore = 'amazon') {
      const cleanBrand = (brand || '').trim();
      const partNumber = (partItem?.partNumber || '').trim();
      const partName = (partItem?.name || '').trim();
      const asin = (partItem?.asin || '').trim();

      if (targetStore === 'amazon') {
        const tagParam = 'tag=applianceengine-20';
        if (asin && /^B[0-9A-Z]{9}$/i.test(asin)) {
          return `https://www.amazon.com/dp/${asin}?${tagParam}`;
        }
        const query = `${partNumber} OEM ${cleanBrand} ${partName}`.replace(/\s+/g, ' ').trim();
        return `https://www.amazon.com/s?k=${encodeURIComponent(query)}&${tagParam}`;
      }

      const bLower = cleanBrand.toLowerCase();
      if (bLower.includes('coway')) return `https://cowaymega.com/search?q=${encodeURIComponent(partNumber || partName)}`;
      if (bLower.includes('moen')) return `https://www.moen.com/search?query=${encodeURIComponent(partNumber)}`;
      if (bLower.includes('kohler')) return `https://www.kohler.com/en/search?q=${encodeURIComponent(partNumber)}`;
      return `https://www.repairclinic.com/Shop-For-Parts?query=${encodeURIComponent(partNumber || `${cleanBrand} ${partName}`)}`;
    }

    function formatToMMDDYYYY(rawVal) {
      const digits = rawVal.replace(/\D/g, '').slice(0, 8);
      if (digits.length <= 2) return digits;
      if (digits.length <= 4) return `${digits.slice(0, 2)}/${digits.slice(2)}`;
      return `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
    }

    function parseMMDDYYYYToISO(dateStr) {
      if (!dateStr || dateStr.length < 10) return '';
      const parts = dateStr.split('/');
      if (parts.length === 3) {
        const [m, d, y] = parts;
        if (m && d && y && y.length === 4) return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
      }
      return '';
    }

    function compressImageFast(file, maxDimension = 900) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDimension) {
              h = Math.round((h * maxDimension) / w);
              w = maxDimension;
            } else if (h > maxDimension) {
              w = Math.round((w * maxDimension) / h);
              h = maxDimension;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d', { alpha: false });
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
            resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function extractBarcodeOrQrFromImage(dataUrl) {
      return new Promise((resolve) => {
        if (!window.jsQR) return resolve(null);
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR(imgData.data, imgData.width, imgData.height, { inversionAttempts: 'dontInvert' });
          resolve(code ? code.data : null);
        };
        img.onerror = () => resolve(null);
        img.src = dataUrl;
      });
    }

    function normalizeApplianceCategory(detectedCategory = '', name = '', brand = '') {
      const q = `${detectedCategory} ${name} ${brand}`.toLowerCase();
      if (q.includes('purifier') || q.includes('hepa') || q.includes('filter air') || q.includes('dehumidifier')) return 'Air Quality';
      if (q.includes('fridge') || q.includes('refrigerat') || q.includes('freezer') || q.includes('wine cooler')) return 'Refrigeration';
      if (q.includes('dish') || q.includes('washer dish')) return 'Dishwashing';
      if (q.includes('dryer') || q.includes('laundry') || q.includes('wash machine') || q.includes('clothes washer')) return 'Laundry';
      if (q.includes('hvac') || q.includes('heat pump') || q.includes('thermostat') || q.includes('air condition') || q.includes('furnace')) return 'HVAC';
      if (q.includes('cooktop') || q.includes('range') || q.includes('oven') || q.includes('stove') || q.includes('microwave')) return 'Cooking';
      if (q.includes('faucet') || q.includes('disposal') || q.includes('water heater') || q.includes('tankless') || q.includes('plumb')) return 'Plumbing Fixture';
      return 'Appliance';
    }

    function calculateConsumableStatus(consumable, appliance) {
      const intervalMonths = consumable.intervalMonths || 6;
      const baseDateStr = consumable.lastReplaced || appliance.purchaseDate;
      
      if (!baseDateStr) {
        const colors = getDegradationColor(100);
        return { 
          badgeType: null,
          percent: 100, 
          displayPercent: 100,
          colors,
          timeRemainingText: `~${intervalMonths} months remaining`,
          scheduleLine1: `Every ${intervalMonths} months`,
          scheduleLine2: 'Schedule active'
        };
      }

      const totalSpanMs = intervalMonths * 30.4375 * 24 * 60 * 60 * 1000;
      const baseMs = new Date(baseDateStr).getTime();
      const elapsedMs = Date.now() - baseMs;
      const remainingMs = totalSpanMs - elapsedMs;
      const remainingDays = Math.ceil(remainingMs / (24 * 60 * 60 * 1000));
      
      const rawPct = Math.round((remainingMs / totalSpanMs) * 100);
      const percent = Math.max(0, Math.min(100, rawPct));
      const colors = getDegradationColor(percent);

      const dueDateObj = new Date(baseMs + totalSpanMs);
      const nextDueDateStr = dueDateObj.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

      if (remainingDays < 0) {
        const overdueDays = Math.abs(remainingDays);
        return { 
          badgeType: 'past_due',
          percent: 0, 
          displayPercent: 3.5,
          colors,
          timeRemainingText: `${overdueDays} days overdue`,
          scheduleLine1: `Every ${intervalMonths} months`,
          scheduleLine2: `Was due ${nextDueDateStr}`
        };
      }

      if (remainingDays <= 5) {
        return { 
          badgeType: 'due_now',
          percent, 
          displayPercent: Math.max(3.5, percent),
          colors,
          timeRemainingText: remainingDays === 0 ? 'Due today' : `${remainingDays} days remaining`,
          scheduleLine1: `Every ${intervalMonths} months`,
          scheduleLine2: `Target: ${nextDueDateStr}`
        };
      }

      if (remainingDays <= 20) {
        return { 
          badgeType: 'replace_soon',
          percent, 
          displayPercent: Math.max(5, percent),
          colors,
          timeRemainingText: `${remainingDays} days remaining`,
          scheduleLine1: `Every ${intervalMonths} months`,
          scheduleLine2: `Target: ${nextDueDateStr}`
        };
      }

      const remainingMonths = Math.ceil(remainingDays / 30.4);
      return { 
        badgeType: null,
        percent, 
        displayPercent: percent,
        colors,
        timeRemainingText: remainingMonths === 1 ? '~1 month remaining' : `~${remainingMonths} months remaining`,
        scheduleLine1: `Every ${intervalMonths} months`,
        scheduleLine2: `Target: ${nextDueDateStr}`
      };
    }

    function calculateApplianceWarrantyStatus(appliance) {
      if (appliance.warrantyActivated) {
        return { status: 'active', label: 'Warranty Verified (OEM Active)', isExpired: false, daysRemaining: null };
      }
      if (!appliance.purchaseDate || !appliance.purchaseDate.trim()) {
        return { status: 'unverified', label: 'No Purchase Date (Unverified)', isExpired: false, daysRemaining: null };
      }
      const months = appliance.warrantyMonths || 12;
      const purchaseMs = new Date(appliance.purchaseDate).getTime();
      if (isNaN(purchaseMs)) {
        return { status: 'unverified', label: 'No Purchase Date (Unverified)', isExpired: false, daysRemaining: null };
      }
      const spanMs = months * 30.4375 * 24 * 60 * 60 * 1000;
      const expireMs = purchaseMs + spanMs;
      const remainingMs = expireMs - Date.now();
      const remainingDays = Math.ceil(remainingMs / (24 * 60 * 60 * 1000));
      if (remainingDays <= 0) {
        return { status: 'expired', label: 'Warranty Expired', isExpired: true, daysRemaining: 0 };
      }
      const remainingMonths = Math.ceil(remainingDays / 30.4);
      return {
        status: 'active',
        label: `Warranty Active (~${remainingMonths} mo remaining)`,
        isExpired: false,
        daysRemaining: remainingDays,
        isExpiringSoon: remainingDays <= 30
      };
    }

    const AIQuotaTracker = {
      getStatus(isPaid) {
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          const now = Date.now();
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 0, startTime: now };
            localStorage.setItem('pro_ai_window', JSON.stringify(data));
          }
          return { count: data.count, limit: PRO_WINDOW_QUOTA, isLocked: data.count >= PRO_WINDOW_QUOTA };
        } else {
          const used = Number(localStorage.getItem('free_ai_used_count') || 0);
          return { count: used, limit: FREE_TOTAL_QUOTA, isLocked: used >= FREE_TOTAL_QUOTA };
        }
      },
      increment(isPaid) {
        const now = Date.now();
        if (isPaid) {
          const raw = localStorage.getItem('pro_ai_window');
          let data = raw ? JSON.parse(raw) : { count: 0, startTime: now };
          if (now - data.startTime > PRO_WINDOW_MS) {
            data = { count: 1, startTime: now };
          } else {
            data.count += 1;
          }
          localStorage.setItem('pro_ai_window', JSON.stringify(data));
        } else {
          const current = Number(localStorage.getItem('free_ai_used_count') || 0);
          localStorage.setItem('free_ai_used_count', (current + 1).toString());
        }
      },
      resetAll() {
        localStorage.removeItem('free_ai_used_count');
        localStorage.removeItem('pro_ai_window');
        localStorage.removeItem('standard_ai_count');
      }
    };

    const ExpertDiagnosticEngine = {
      diagnosticTrees: {
        "air_quality_sensor": [

          `Step 2 (Starter Rattle Check): Unplug the refrigerator for safety, slide the small starter relay box off the side of the compressor, and gently shake it. Does it rattle like loose pebbles inside?`,
          `Conclusion: The ceramic disk inside the compressor start relay has cracked, preventing the compressor from starting.\n\nWe've tried every troubleshooting step I can think of for this issue.\n\nBased on what I could assess, your Compressor Start Relay likely needs replacement.\n\n[RECOMMEND_TECH]`

          `Step 2 (Impeller Spin): With power disconnected, check the small drain pump impeller with a fingertip. Does it turn freely without grinding or sticking?`,
          `Conclusion: The drain pump motor is jammed or its internal drive winding has worn out.\n\nWe've tried every troubleshooting step I can think of for this issue.\n\nBased on what I could assess, your Drain Pump Assembly likely needs replacement.\n\n[RECOMMEND_TECH]`
        ]
      },

      async lookupErrorCode(category = '', query = '') {
        const q = (query || '').toUpperCase();
        const catKey = (category || 'refrigeration').toLowerCase();
        
        let customDict = await ApplianceStorageDB.get('manuals_cache', 'chassis_error_catalog');
        if (!customDict) customDict = BUNDLED_CHASSIS_ERRORS;

        const table = customDict[catKey] || BUNDLED_CHASSIS_ERRORS[catKey] || {};
        for (const [code, desc] of Object.entries(table)) {
          if (q.includes(code)) return { code, desc };
        }
        return null;
      },

      checkOverdueConsumables(appliance) {
        const list = appliance.consumables || [];
        for (const c of list) {
          const status = calculateConsumableStatus(c, appliance);
          if (status.badgeType === 'past_due' || status.badgeType === 'due_now') {
            return { name: c.name, timeRemainingText: status.timeRemainingText };
          }
        }
        return null;
      },

      isNegativeFeedback(q) {
        const normalized = q.toLowerCase().trim();
        const triggers = [
          'no', 'nope', "didn't work", "did not work", 'still red', 'still bad', 'still warm',
          'no change', 'did that', 'tried that', 'same', 'nothing happened', 'not working',
          'failed', 'wont spin', "won't spin", 'does not spin', 'stiff', 'grinding', 'yes it rattles'
        ];
        return triggers.some(t => normalized === t || normalized.startsWith(t) || normalized.includes(t));
      },

      identifyActiveTree(history) {
        for (let i = history.length - 1; i >= 0; i--) {
          const text = history[i].text || '';
          if (text.includes('optical lens') || text.includes('sensor chamber') || text.includes('optical particle sensor')) return 'air_quality_sensor';
          if (text.includes('Safety Latch Check') || text.includes('Free-Spin Test')) return 'air_quality_fan';
          if (text.includes('Damper Airflow Check') || text.includes('Frost Buildup Inspection')) return 'refrig_temp';
          if (text.includes('Starter Rattle Check') || text.includes('compressor attempt to start')) return 'refrig_relay';
          if (text.includes('Filter & Hose Check') || text.includes('Impeller Spin')) return 'drain_general';
        }
        return null;
      },

      findNextStepIndex(treeKey, history) {
        const tree = this.diagnosticTrees[treeKey] || [];
        for (let idx = 0; idx < tree.length; idx++) {
          const stepKeyPhrase = tree[idx].slice(0, 30);
          const alreadySent = history.some(m => m.sender === 'assistant' && m.text.includes(stepKeyPhrase));
          if (!alreadySent) return idx;
        }
        return tree.length - 1;
      },

      async evaluateQuery(appliance, rawQuery, history = []) {
        const q = (rawQuery || '').toLowerCase().trim();
        const brand = appliance.brand || 'Appliance';
        const name = appliance.name || 'Equipment';
        const cleanTitle = formatApplianceTitle(brand, name);
        const category = appliance.category || 'Appliance';

        const lastAssistantMsg = [...history].reverse().find(m => m.sender === 'assistant')?.text || '';

        const hazardKeywords = ['smoke', 'burning smell', 'spark', 'sparks', 'fire', 'shock', 'arcing'];
        if (hazardKeywords.some(k => q.includes(k))) {
          return `⚠️ **CRITICAL ELECTRICAL HAZARD DETECTED**\n\n` +
                 `1. Disconnect power at the main home breaker immediately.\n` +
                 `2. Do not touch bare metal surfaces or wiring.\n\n` +
                 `Is electrical power disconnected at the breaker, and is the area safe to inspect?`;
        }

        if (lastAssistantMsg.includes('CRITICAL ELECTRICAL HAZARD')) {
          if (q.includes('yes') || q.includes('cut') || q.includes('safe') || q.includes('off')) {
            return `Breaker disconnect confirmed.\n\n` +
                   `Because an active thermal or electrical hazard occurred, inspecting internal high-voltage components carries risk.\n\n` +
                   `We've tried every troubleshooting step I can think of for this issue.\n\n` +
                   `Based on what I could assess, an internal wiring harness or electronic relay likely needs replacement.\n\n` +
                   `[RECOMMEND_TECH]`;
          }
        }

        const activeTreeKey = this.identifyActiveTree(history);
        if (activeTreeKey && this.isNegativeFeedback(q)) {
          const nextIdx = this.findNextStepIndex(activeTreeKey, history);
          const stepText = this.diagnosticTrees[activeTreeKey][nextIdx];
          const alreadyDelivered = history.some(m => m.sender === 'assistant' && m.text === stepText);
          if (!alreadyDelivered) {
            return stepText;
          }
        }

        const overdue = this.checkOverdueConsumables(appliance);
        if (overdue && (q.includes('smell') || q.includes('odor') || q.includes('air') || q.includes('flow') || q.includes('not cooling')) && history.filter(m => m.sender === 'user').length <= 1) {
          return `Quick check: Your ${overdue.name} is currently ${overdue.timeRemainingText}.\n\nA saturated filter restricts normal airflow and can cause these exact symptoms.\n\n1. Inspect or replace the overdue filter first before opening access panels.\n2. Is the filter housing clean and seated flush?`;
        }

        const errMatch = await this.lookupErrorCode(category, rawQuery);
        if (errMatch) {
          return `Fault code **${errMatch.code}** confirmed for this equipment: ${errMatch.desc}\n\nBefore ordering replacement sensors, inspect the wiring harness plug for loose pins or dust.`;
        }

        if (category === 'Air Quality' || cleanTitle.toLowerCase().includes('purifier')) {
          if (q.includes('red') || q.includes('orange') || q.includes('sensor') || q.includes('ring')) {
            return this.diagnosticTrees['air_quality_sensor'][0];
          }
          if (q.includes('spin') || q.includes('fan') || q.includes('dead') || q.includes('hum')) {
            return this.diagnosticTrees['air_quality_fan'][0];
          }
        }

        if (category === 'Refrigeration' || cleanTitle.toLowerCase().includes('fridge')) {
          if (q.includes('click') || q.includes('relay') || q.includes('hum')) {
            return this.diagnosticTrees['refrig_relay'][0];
          }
          if (q.includes('warm') || q.includes('not cooling') || q.includes('freezer') || q.includes('temp')) {
            return this.diagnosticTrees['refrig_temp'][0];
          }
        }

        if (q.includes('drain') || q.includes('water') || q.includes('pump') || q.includes('leak')) {
          return this.diagnosticTrees['drain_general'][0];
        }

        return `Safe inspection checks for your ${cleanTitle}:\n\n` +
               `1. Power Reset: Disconnect power at the breaker or plug for 60 seconds to allow microprocessors to reset.\n` +
               `2. Safety Latches: Check that all access panels, filters, and doors close completely flush.\n` +
               `3. Intake & Grilles: Ensure intake vents are free of dust or pet hair.\n\n` +
               `Safety Notice: Always disconnect electrical power before opening internal panels or inspecting wiring.`;
      }
    };

    function sanitizeCommercialName(rawName = '', modelNumber = '') {
      let cleaned = (rawName || '').trim();
      if (modelNumber && modelNumber.trim()) {
        const escaped = modelNumber.trim().replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
        cleaned = cleaned.replace(new RegExp(escaped, 'gi'), '');
      }
      return cleaned.replace(/\s{2,}/g, ' ').replace(/\(\s*\)/g, '').trim();
    }

        const hasRecommendTechToken = finalText.includes('[RECOMMEND_TECH]');
        let cleanedText = finalText.replace('[RECOMMEND_TECH]', '').trim();
        cleanedText = cleanedText.replace(/If you aren't comfortable handling the equipment yourself, I recommend having a specialist review the device physically\.?/gi, '').trim();

        const words = cleanedText.split(' ');
        let idx = 0;
        setStreamingText('');

        const timer = setInterval(() => {
          if (idx >= words.length) {
            clearInterval(timer);
            setStreamingText('');
            const nextMsg = {
              id: Date.now().toString(),
              sender: 'assistant',
              text: cleanedText,
              showTransitionCard: isFifthNotice,
              showPeriodicReminder: isPeriodicNotice,
              showReferralFork: hasRecommendTechToken
            };
            setMessages(prev => {
              const updated = [...prev, nextMsg];
              localStorage.setItem(`chat_history_${activeAppliance.id}`, JSON.stringify({ timestamp: Date.now(), messages: updated }));
              return updated;
            });
            scrollToChatBottom(true);
            return;
          }

          idx = Math.min(words.length, idx + 2);
          setStreamingText(words.slice(0, idx).join(' '));
          scrollToChatBottom(false);
        }, 115);
      };

      const sendQuery = async (text) => {
        const q = text || queryInput;
        if (!q.trim() || !activeAppliance || isLoading || isThinking) return;

        if (q.toLowerCase().includes('go deeper') && !isPaidUser) {
          setIsPaywallOpen(true);
          return;
        }

        const userMsg = { id: Date.now().toString(), sender: 'user', text: q };
        const updated = [...messages, userMsg];
        setMessages(updated);
        setQueryInput('');
        setNeedsPlacardVerification(false);

        setIsThinking(true);
        const quota = AIQuotaTracker.getStatus(isPaidUser);

        if (!isPaidUser && quota.isLocked) {
          let standardCount = Number(localStorage.getItem('standard_ai_count') || 0) + 1;
          localStorage.setItem('standard_ai_count', standardCount.toString());

          setTimeout(async () => {
            setIsThinking(false);
            const manualAnswer = await ExpertDiagnosticEngine.evaluateQuery(activeAppliance, q, updated);
            if (manualAnswer.includes('cabinet placard below:')) {
              setNeedsPlacardVerification(true);
            }
            executeStreamingAnswer(manualAnswer, false, standardCount % 10 === 0);
          }, 650);
          return;
        }

        AIQuotaTracker.increment(isPaidUser);
        const quotaAfter = AIQuotaTracker.getStatus(isPaidUser);

        setTimeout(async () => {
          try {
            const res = await fetch(`${WORKER_ENDPOINT}/api/chat`, {
              method: 'POST',
              headers: { 
                'Content-Type': 'application/json',
                'X-User-Email': currentUser?.email || userEmail || ''

                appliance: activeAppliance,
                messages: updated.slice(-6),

            });
            const data = await res.json();
            setIsThinking(false);
            const isFifthFree = !isPaidUser && quotaAfter.count === FREE_TOTAL_QUOTA;
            executeStreamingAnswer(data.reply || "Diagnostic guidance completed.", isFifthFree, false);
          } catch (err) {
            setIsThinking(false);
            const offlineAnswer = await ExpertDiagnosticEngine.evaluateQuery(activeAppliance, q, updated);
            if (offlineAnswer.includes('cabinet placard below:')) {
              setNeedsPlacardVerification(true);

            executeStreamingAnswer(offlineAnswer, false, false);

          try {
            await navigator.share({ files: [file], title: filename });
            return;
          } catch (e) {}
        }
        const url = URL.createObjectURL(pdfBlob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);

      const handleAuthVerifyOtp = async (e) => {
        e.preventDefault();

        try {
          const res = await fetch(`${WORKER_ENDPOINT}/api/auth/verify-otp`, {
            method: 'POST',

            body: JSON.stringify({ email: authEmailInput.trim().toLowerCase(), code: authPinInput.trim() })
          });
          const data = await res.json();
          if (data.user || res.ok) {

            localStorage.setItem('app_user_session', JSON.stringify(userObj));
            setCurrentUser(userObj);
            setIsPaidUser(Boolean(userObj.is_pro));
            setUserEmail(userObj.email);
            if (userObj.displayName) setUserDisplayName(userObj.displayName);
            if (data.appliances && data.appliances.length > 0) setAppliances(data.appliances);
            if (data.units && data.units.length > 0) setUnits(data.units);
            setIsAuthModalOpen(false);

            <div
              onTouchStart={(e) => {
                touchStartPosRef.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
                touchIsHorizontalRef.current = null;
                activeSwipingIdRef.current = item.id;
              }}
              onTouchMove={(e) => {
                if (activeSwipingIdRef.current !== item.id) return;
                const deltaX = e.touches[0].clientX - touchStartPosRef.current.x;
                const deltaY = e.touches[0].clientY - touchStartPosRef.current.y;

                if (touchIsHorizontalRef.current === null) {
                  if (Math.abs(deltaX) > Math.abs(deltaY) + 6) {
                    touchIsHorizontalRef.current = true;
                  } else if (Math.abs(deltaY) > Math.abs(deltaX) + 6) {
                    touchIsHorizontalRef.current = false;
                  }
                }

                if (!touchIsHorizontalRef.current) return;

                // Logarithmic rubber-banding curve
                const damped = deltaX < 0
                  ? Math.max(-96, deltaX)
                  : Math.min(24, Math.sign(deltaX) * Math.pow(Math.abs(deltaX), 0.7));

                setSwipeOffsets(prev => ({ ...prev, [item.id]: damped }));
              }}
              onTouchEnd={() => {
                if (activeSwipingIdRef.current !== item.id) return;
                if (!touchIsHorizontalRef.current) {
                  activeSwipingIdRef.current = null;

                const finalOffset = swipeOffsets[item.id] || 0;

                activeSwipingIdRef.current = null;

              className="fixed inset-0 bg-black/85 backdrop-blur-md flex items-center justify-center p-4 z-[90] cursor-pointer"
            >
              <div onClick={(e) => e.stopPropagation()} className={`border rounded-[32px] p-6 w-full max-w-xs space-y-4 shadow-2xl text-center cursor-default animate-sheet-spring ${
                isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
              }`}>
                <h3 className="text-base font-black">Log Out of {currentUser?.email}?</h3>
                <p className={`text-xs font-semibold leading-relaxed ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                  Are you sure you want to log out of your account on this device?
                </p>
                <div className="flex gap-2 pt-2">
                  <button 
                    onClick={() => {
                      setIsLogoutModalOpen(false);
                      setIsSettingsOpen(true);
                    }} 
                    className={`flex-1 text-xs py-2.5 rounded-2xl font-bold ${
                      isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-[#E5E5EA] text-[#1C1C1E]'
                    }`}
                  >
                    No
                  </button>
                  <button onClick={handleLogout} className="flex-1 bg-rose-600 hover:bg-rose-500 text-white text-xs py-2.5 rounded-2xl font-bold shadow-sm">Yes</button>
                </div>
              </div>
            </div>
          )}

          {/* 9. AUTHENTICATION MODAL */}
          {isAuthModalOpen && (
            <div 
              onClick={() => {
                setIsAuthModalOpen(false);
                setIsSettingsOpen(true);
              }} 
              className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-[60] cursor-pointer"
            >
              <div onClick={(e) => e.stopPropagation()} className={`w-full max-w-sm rounded-t-[32px] p-6 space-y-4 border-t cursor-default animate-sheet-spring ${
                isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
              }`}>
                <div className="flex justify-between items-center">
                  <h3 className="text-base font-black">Account Login</h3>
                  <AppleCloseButton 
                    isDark={isDark} 
                    onClick={() => {
                      setIsAuthModalOpen(false);
                      setIsSettingsOpen(true);
                    }} 
                  />
                </div>

                {authStep === 'email' ? (
                  <form onSubmit={handleAuthSendOtp} className="space-y-3">
                    <p className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                      Enter your email to sign in and synchronize your hardware schedule:
                    </p>
                    <input
                      type="email"
                      className={`w-full rounded-2xl p-3 text-xs font-semibold focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-white border-black/10 text-black shadow-xs'
                      }`}
                      placeholder="your@email.com"
                      value={authEmailInput}
                      onChange={(e) => setAuthEmailInput(e.target.value)}
                      required
                      autoFocus
                    />
                    <button
                      type="submit"
                      disabled={authLoading}
                      className="w-full bg-[#FF9500] hover:bg-amber-500 text-white font-black text-xs py-3 rounded-2xl shadow-sm transition-all"
                    >
                      {authLoading ? 'Sending Code...' : 'Send Login Code'}
                    </button>
                  </form>
                ) : (
                  <form onSubmit={handleAuthVerifyOtp} className="space-y-3">
                    <p className={`text-xs font-semibold ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                      A 6-digit code was sent to <strong className="text-[#FF9500]">{authEmailInput}</strong>.
                    </p>
                    
                    {devPasscodeNotice && (
                      <p className="text-[11px] font-mono text-emerald-400 bg-emerald-950/50 p-2 rounded-xl border border-emerald-800 text-center">
                        {devPasscodeNotice}
                      </p>
                    )}

                    <input
                      type="text"
                      maxLength="6"
                      className={`w-full rounded-2xl p-3 text-center text-lg tracking-widest font-mono font-black focus:outline-none border ${
                        isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-white border-black/10 text-black shadow-xs'
                      }`}
                      placeholder="000000"
                      value={authPinInput}
                      onChange={(e) => setAuthPinInput(e.target.value.replace(/\D/g, ''))}
                      required
                      autoFocus
                    />

                    <button
                      type="submit"
                      disabled={authLoading || authPinInput.length < 6}
                      className="w-full bg-[#FF9500] hover:bg-amber-500 text-white font-black text-xs py-3 rounded-2xl shadow-sm transition-all disabled:opacity-50"
                    >
                      {authLoading ? 'Verifying...' : 'Verify & Sign In'}
                    </button>

                    <div className="flex justify-between items-center pt-2">
                      <button type="button" onClick={() => setAuthStep('email')} className="text-xs text-zinc-400 hover:underline">
                        ← Change Email
                      </button>
                      <button
                        type="button"
                        disabled={otpCooldownSeconds > 0}
                        onClick={handleAuthSendOtp}
                        className="text-xs text-[#FF9500] disabled:opacity-40"
                      >
                        {otpCooldownSeconds > 0 ? `Resend in ${otpCooldownSeconds}s` : 'Resend Code'}
                      </button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}

          {/* 10. DIAGNOSTIC ASSISTANT OVERLAY BOTTOM-SHEET */}
          {activeAppliance && (
            <div onClick={() => setActiveAppliance(null)} className="fixed inset-0 bg-black/80 backdrop-blur-md flex items-end justify-center z-[80] cursor-pointer">
              <div onClick={(e) => e.stopPropagation()} className={`w-full max-w-md h-[82vh] rounded-t-[32px] p-5 flex flex-col border-t cursor-default animate-sheet-spring ${
                isDark ? 'bg-zinc-900 border-white/10 text-white' : 'bg-white border-black/10 text-[#1C1C1E]'
              }`}>
                <div className="flex justify-between items-start pb-2.5 border-b border-black/10 dark:border-white/10">
                  <div className="min-w-0 flex-1 pr-3">
                    <h3 className="text-sm font-black truncate leading-tight">{formatApplianceTitle(activeAppliance.brand, activeAppliance.name)}</h3>
                    <p className={`text-[11px] font-semibold mt-0.5 ${isDark ? 'text-zinc-400' : 'text-[#636366]'}`}>
                      {getAssistantTierLabel()}
                    </p>
                  </div>
                  <AppleCloseButton isDark={isDark} onClick={() => setActiveAppliance(null)} />
                </div>

                <div className="flex gap-1.5 py-2 overflow-x-auto scrollbar-none">
                  {getAdaptiveChips(activeAppliance).map(chip => (
                    <button
                      key={chip}
                      onClick={() => sendQuery(chip)}
                      className={`text-xs px-3 py-1 rounded-full font-bold whitespace-nowrap ${
                        chip === 'Go Deeper' ? 'bg-[#FF9500] text-white' : (isDark ? 'bg-zinc-800 text-zinc-300' : 'bg-[#E5E5EA] text-[#3A3A3C]')
                      }`}
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <div 
                  ref={chatContainerRef}
                  className="flex-1 overflow-y-auto space-y-2.5 py-2 text-xs"
                >
                  {messages.map(m => (
                    <div key={m.id} className="space-y-2.5">
                      <div className={`p-3 rounded-2xl max-w-[85%] whitespace-pre-line font-medium leading-relaxed ${
                        m.sender === 'user' ? 'ml-auto bg-[#FF9500] text-white' : (isDark ? 'mr-auto bg-zinc-800 text-zinc-200' : 'mr-auto bg-[#E5E5EA] text-black')
                      }`}>
                        {m.text}
                      </div>

                      {m.showReferralFork && (
                        <div className={`mx-auto max-w-[92%] p-4 rounded-2xl border space-y-3 shadow-md ${
                          isDark ? 'bg-zinc-950 border-white/10 text-zinc-200' : 'bg-white border-black/10 text-zinc-900 shadow-sm'
                        }`}>
                          <div className="border-b border-black/5 dark:border-white/5 pb-2 text-center">
                            <span className="text-[10px] font-black uppercase tracking-wider text-[#FF9500] block">
                              Recommended Next Steps
                            </span>
                            <p className="text-[11px] font-medium leading-relaxed text-zinc-500 dark:text-zinc-400 mt-1">
                              If you aren't comfortable handling the equipment yourself, I recommend having a specialist review the device physically.
                            </p>
                          </div>

                          <div className="grid grid-cols-2 gap-2 pt-0.5">
                            <button
                              type="button"
                              onClick={() => {
                                const wearPart = activeAppliance.replacementParts?.[0];
                                window.open(buildPartPurchaseUrl(activeAppliance.brand, wearPart || { name: 'Part' }, 'oem'), '_blank');
                              }}
                              className={`p-2.5 rounded-xl border text-center flex flex-col items-center justify-center font-bold text-xs shadow-xs active:scale-95 transition-transform ${
                                isDark ? 'bg-zinc-800/90 hover:bg-zinc-800 border-white/10 text-white' : 'bg-zinc-50 hover:bg-zinc-100 border-black/10 text-zinc-900'
                              }`}
                            >
                              <span className="leading-tight">Order OEM Part</span>
                              <span className="text-[9.5px] opacity-70 mt-0.5 font-normal">Verified Replacement ↗</span>
                            </button>

                            <button
                              type="button"
                              onClick={() => {
                                const q = `${activeAppliance.brand} certified appliance service technician repair near me`;
                                window.open(`https://www.google.com/search?q=${encodeURIComponent(q)}`, '_blank');
                              }}
                              className={`p-2.5 rounded-xl border text-center flex flex-col items-center justify-center font-bold text-xs shadow-xs active:scale-95 transition-transform ${
                                isDark ? 'bg-zinc-800/90 hover:bg-zinc-800 border-white/10 text-white' : 'bg-zinc-50 hover:bg-zinc-100 border-black/10 text-zinc-900'
                              }`}
                            >
                              <span className="leading-tight">Find a Specialist</span>
                              <span className="text-[9.5px] opacity-70 mt-0.5 font-normal">Certified Local Service ↗</span>
                            </button>
                          </div>

                          <p className="text-[11px] text-zinc-500 dark:text-zinc-400 text-center font-medium pt-1 italic">
                            Otherwise, send another message to continue troubleshooting.
                          </p>
                        </div>
                      )}

                      {m.showTransitionCard && (
                        <div className={`mr-auto max-w-[92%] p-4 rounded-2xl border space-y-2 shadow-sm ${
                          isDark ? 'bg-zinc-900 border-[#FF9500]/40' : 'bg-amber-50/80 border-amber-200'
                        }`}>
                          <span className="text-[10px] font-extrabold uppercase tracking-wider text-[#FF9500]">
                            Advanced Diagnostic Limit Reached
                          </span>
                          <p className={`text-xs font-semibold leading-relaxed ${isDark ? 'text-zinc-300' : 'text-[#3A3A3C]'}`}>
                            Your 5 complimentary inquiries are complete. Responses will now continue using <strong>Standard Diagnostic</strong>.
                          </p>
                          <div className="flex justify-end pt-1">
                            <button
                              type="button"
                              onClick={() => setIsPaywallOpen(true)}
                              className="bg-[#FF9500] hover:bg-amber-500 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl shadow-xs active:scale-95 transition-all"
                            >
                              Upgrade to Advanced Manager ↗
                            </button>
                          </div>
                        </div>
                      )}

                      {m.showPeriodicReminder && (
                        <div className="flex justify-center my-2">
                          <button
                            type="button"
                            onClick={() => setIsPaywallOpen(true)}
                            className={`text-[11px] font-bold py-1.5 px-3.5 rounded-full border transition-all active:scale-95 flex items-center gap-1 ${
                              isDark 
                                ? 'bg-zinc-900/90 text-[#FF9500] border-[#FF9500]/30 hover:bg-zinc-800' 
                                : 'bg-amber-50 text-amber-800 border-amber-200 hover:bg-amber-100 shadow-2xs'
                            }`}
                          >
                            <span>Using Standard Diagnostic • Upgrade to Advanced Diagnostic ➔</span>
                          </button>
                        </div>
                      )}
                    </div>
                  ))}

                  {isThinking && (
                    <div className={`p-3 rounded-2xl w-fit mr-auto flex items-center gap-1.5 ${
                      isDark ? 'bg-zinc-800 text-zinc-400' : 'bg-[#E5E5EA] text-[#636366]'
                    }`}>
                      <span className="w-1.5 h-1.5 rounded-full bg-zinc-400 dark:bg-zinc-500 wave-dot"></span>
                      <span className="w-1.5 h-1.5 rounded-full bg-zinc-400 dark:bg-zinc-500 wave-dot"></span>
                      <span className="w-1.5 h-1.5 rounded-full bg-zinc-400 dark:bg-zinc-500 wave-dot"></span>
                    </div>
                  )}

                  {streamingText && (
                    <div className={`p-3 rounded-2xl max-w-[85%] mr-auto whitespace-pre-line font-medium leading-relaxed animate-smooth-reveal ${
                      isDark ? 'bg-zinc-800 text-zinc-200' : 'bg-[#E5E5EA] text-black'
                    }`}>
                      {streamingText}
                    </div>
                  )}

                  {needsPlacardVerification && (
                    <div className={`p-3.5 rounded-2xl border space-y-2 mt-2 ${
                      isDark ? 'bg-zinc-950 border-[#FF9500]/40' : 'bg-amber-50 border-amber-200'
                    }`}>
                      <div className="flex justify-between items-center">
                        <span className="text-[10px] font-black uppercase tracking-wider text-[#FF9500]">
                          Placard Model Verification Required
                        </span>
                        <button
                          type="button"
                          onClick={() => placardFileInputRef.current?.click()}
                          className={`inline-flex items-center gap-1 text-[11px] font-bold px-2 py-1 rounded-lg transition-colors ${
                            isDark ? 'bg-zinc-800 text-[#FF9500] hover:bg-zinc-700' : 'bg-white text-[#FF9500] hover:bg-amber-100 shadow-2xs'
                          }`}
                        >
                          <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                          </svg>
                          <span>Snap Photo</span>
                        </button>
                      </div>
                      <p className={`text-[11px] leading-relaxed ${isDark ? 'text-zinc-300' : 'text-[#3A3A3C]'}`}>
                        Enter the exact model SKU from the silver rating plate to reconcile factory schematics:
                      </p>
                      <div className="flex gap-2 pt-1">
                        <input
                          className={`flex-1 rounded-xl px-3 py-1.5 text-xs font-semibold border focus:outline-none ${
                            isDark ? 'bg-zinc-800 border-zinc-700 text-white' : 'bg-white border-black/10 text-black'
                          }`}
                          placeholder="e.g. 5440i"
                          value={placardVerifyInput}
                          onChange={(e) => setPlacardVerifyInput(e.target.value)}
                          onKeyDown={(e) => e.key === 'Enter' && handleInlinePlacardVerification()}
                        />
                        <button
                          type="button"
                          onClick={handleInlinePlacardVerification}
                          className="bg-[#FF9500] hover:bg-amber-500 text-white font-bold text-xs px-3.5 py-1.5 rounded-xl shadow-xs"
                        >
                          Verify ➔
                        </button>
                      </div>
                    </div>
                  )}

                  {isLoading && <p className="text-xs text-zinc-400 animate-pulse px-2">Analyzing...</p>}
                </div>

                <div className="pt-2 flex flex-col gap-1.5 border-t border-black/5 dark:border-white/5">
                  <div className="flex gap-2">
                    <input
                      className={`flex-1 rounded-full px-4 py-2 text-xs focus:outline-none ${
                        isDark ? 'bg-zinc-800 text-white' : 'bg-[#E5E5EA] text-black'
                      }`}
                      placeholder="Describe issue, sound, or symptom..."
                      value={queryInput}
                      onChange={(e) => setQueryInput(e.target.value)}
                      onKeyDown={(e) => e.key === 'Enter' && sendQuery()}
                    />
                    <button onClick={() => sendQuery()} className="bg-[#FF9500] text-white font-bold text-xs px-4 rounded-full active:scale-95 transition-transform">
                      Send
                    </button>
                  </div>
                  <p className={`text-[9px] text-center font-semibold ${isDark ? 'text-zinc-500' : 'text-[#636366]'}`}>
                    Informational reference only. Always disconnect electrical power before servicing equipment.
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* 11. INLINE PDF VIEWER */}
          {inlinePdfViewerData && (
            <div className="fixed inset-0 z-[95] flex flex-col bg-zinc-950 text-white animate-sheet-spring">
              <div className="p-4 pt-12 border-b border-white/10 flex justify-between items-center bg-zinc-900/90 backdrop-blur-md">
                <button
                  onClick={() => {
                    URL.revokeObjectURL(inlinePdfViewerData.url);
                    setInlinePdfViewerData(null);
                  }}
                  className="px-4 py-1.5 rounded-full text-xs font-bold bg-zinc-800 text-zinc-200"
                >
                  Done
                </button>
                <h3 className="text-xs font-extrabold truncate px-2">{inlinePdfViewerData.title}</h3>
                <button
                  onClick={() => handleShareOrDownloadPdf(inlinePdfViewerData.blob, `${inlinePdfViewerData.title.replace(/\s+/g, '_')}.pdf`)}
                  className="px-3.5 py-1.5 rounded-full text-xs font-bold bg-[#FF9500] text-white"
                >
                  Share ↗
                </button>
              </div>
              <iframe src={inlinePdfViewerData.url} className="w-full flex-1 border-none" title="PDF Preview" />
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
